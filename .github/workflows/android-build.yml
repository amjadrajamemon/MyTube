name: Build MyTube Android APKs

# 2026-10-19: XY AUTO native playback compatibility and navigation correction.

on:
  push:
    branches: [ main, 'feature/**' ]
    paths:
      - 'source/**'
      - 'ci/**'
      - '.github/workflows/android-build.yml'
      - '.github/mytube-signing-sha1.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mytube-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify TV controller, air-mouse and keyboard source
        shell: bash
        run: |
          set -euo pipefail
          M=source/app/src/main/AndroidManifest.xml
          H=source/app/src/main/java/com/drivedeck/tubedeck/ui/components/TvInputSupport.kt
          S=source/app/src/main/java/com/drivedeck/tubedeck/ui/components/SearchAssistField.kt
          P=source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'android.intent.category.LEANBACK_LAUNCHER' "$M"
          grep -Fq 'android.software.leanback.supports_touch' "$M"
          grep -Fq 'android.hardware.touchscreen' "$M"
          grep -Fq 'fun isTvLikeNavigationDevice' "$H"
          grep -Fq 'fun Modifier.tvInputHighlight' "$H"
          grep -Fq 'itemsIndexed(choices' "$S"
          grep -Fq 'firstSuggestionFocusRequester.requestFocus()' "$S"
          grep -Fq 'KEYCODE_DPAD_CENTER' "$P"
          grep -Fq 'KEYCODE_MEDIA_PLAY_PAUSE' "$P"
          grep -Fq 'tvPendingControlFocus' "$P"
          echo "TV navigation source invariants verified."

      - name: Verify v1.8.12 dual-APK source
        shell: bash
        run: |
          set -euxo pipefail
          test -f source/settings.gradle.kts
          grep -q 'versionName = "1.8.12"' source/app/build.gradle.kts
          grep -q 'versionCode = 94' source/app/build.gradle.kts
          grep -q 'create("arm64")' source/app/build.gradle.kts
          grep -q 'create("universal")' source/app/build.gradle.kts
          grep -q 'armeabi-v7a' source/app/build.gradle.kts
          grep -q 'nativeWhisperSupported' source/app/src/main/java/com/drivedeck/tubedeck/player/WhisperAudioAsr.kt
          PLAYER=source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          RESOLVER=source/app/src/main/java/com/drivedeck/tubedeck/player/YoutubeStreamResolver.kt
          MODEL=source/app/src/main/java/com/drivedeck/tubedeck/data/model/TubeDeckModels.kt
          grep -Fq 'PlaybackContinuationMode.LOOP_CURRENT -> PlaybackContinuationMode.AUTO_NEXT' "$PLAYER"
          grep -Fq 'PlaybackContinuationMode.AUTO_NEXT -> PlaybackContinuationMode.EPISODES' "$PLAYER"
          grep -Fq 'PlaybackContinuationMode.EPISODES -> PlaybackContinuationMode.LOOP_CURRENT' "$PLAYER"
          grep -Fq 'val compactCardWidth = ((screenWidthDp - 50f) / 6f).coerceIn(88f, 132f).dp' "$PLAYER"
          grep -Fq 'cardWidth = compactCardWidth' "$PLAYER"
          ! grep -Fq 'private fun PlaybackContinuationCard(' "$PLAYER"
          grep -Fq 'AUTO_NEXT("Auto play")' "$MODEL"
          SETTINGS=source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/SettingsScreen.kt
          REPO=source/app/src/main/java/com/drivedeck/tubedeck/data/repository/TubeDeckRepository.kt
          grep -Fq 'episodes.drop(currentIndex + 1) + episodes.take(currentIndex)' "$PLAYER"
          grep -Fq 'preferredSubtitleTracks(' "$RESOLVER"
          grep -Fq 'Loading Urdu captions' "$PLAYER"
          grep -Fq 'Loading English captions' "$PLAYER"
          grep -Fq 'listOf("en" to "English", "ur" to "Urdu")' "$PLAYER"
          grep -Fq 'Clear watch history & reset Relevant' "$SETTINGS"
          grep -Fq 'homeSuggestionsJob = null' "$REPO"
          grep -Fq 'sharedEpisodeShelf = continuationEpisodeShelf' "$PLAYER"
          grep -Fq 'sharedEpisodesLoading = continuationEpisodesLoading' "$PLAYER"
          grep -Fq 'sideBySideEpisodeFeeds && autoLoadEpisodes && autoLoadUpNext' "$PLAYER"
          grep -Fq 'key = { "dual-episode-${it.videoId}" }' "$PLAYER"
          grep -Fq 'key = { "dual-related-${it.videoId}" }' "$PLAYER"
          grep -Fq 'Portrait feeds · Side by side' "$SETTINGS"
          grep -Fq 'YouTube desktop interface' "$SETTINGS"
          grep -Fq 'desktopYoutubeUiEnabled = desktopYoutubeUiEnabled' "$SETTINGS"
          grep -Fq 'putBoolean("desktopYoutubeUiEnabled"' "$REPO"
          grep -Fq 'AUTO_NEXT("Auto play")' "$MODEL"
          grep -Fq 'desktopTheaterEnabled = desktopTheaterEnabled' source/app/src/main/java/com/drivedeck/tubedeck/MainActivity.kt
          grep -Fq 'watch.hasAttribute(' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/BrowserScreen.kt
          grep -Fq 'putBoolean("sideBySideEpisodeFeeds"' "$REPO"
          grep -Fq 'detectVerticalDragGestures' "$PLAYER"
          grep -Fq 'downwardDrag > 72f' "$PLAYER"
          grep -Fq 'Loop · repeat the current video' "$PLAYER"
          grep -Fq 'Auto play · play the next relevant video' "$PLAYER"
          grep -Fq 'Episode next · continue with the next detected episode' "$PLAYER"
          grep -Fq 'var playbackSpeedMenuExpanded by remember { mutableStateOf(false) }' "$PLAYER"
          grep -Fq 'private val PLAYBACK_SPEED_OPTIONS = listOf(' "$PLAYER"
          grep -Fq '1.0f,' "$PLAYER"
          grep -Fq '5.0f' "$PLAYER"
          grep -Fq '"1.0x · Normal"' "$PLAYER"
          grep -Fq 'Text("Audio enhancements", fontWeight = FontWeight.Bold)' "$PLAYER"
          grep -Fq 'Text(if (equalizerEnabled) "Equalizer · On" else "Equalizer · Off")' "$PLAYER"
          grep -Fq 'setSelectUndeterminedTextLanguage(captionsEnabled || captionDubbingActive)' "$PLAYER"
          grep -Fq 'enabled = hasCaptions || youtubeVideo' "$PLAYER"
          grep -Fq 'var showCaptionMenu by remember { mutableStateOf(false) }' "$PLAYER"
          grep -Fq 'onCaptionLanguage = ::selectCaptionLanguage' "$PLAYER"
          grep -Fq 'Could not prepare video source' "$PLAYER"
          ! grep -Fq 'if (youtubeVideo) onWebFallback()' "$PLAYER"
          grep -Fq 'MAX_PLAYER_SUBTITLE_TRACKS = 16' "$RESOLVER"
          ! grep -Fq 'showPlaybackSpeedMenu' "$PLAYER"
          ! grep -Fq 'private fun stepPlaybackSpeed' "$PLAYER"
          ! grep -Fq 'val displayControlsReserve' "$PLAYER"
          grep -Fq 'textScale = equalizerTextScale' "$PLAYER"
          grep -Fq '.windowInsetsPadding(WindowInsets.safeDrawing)' "$PLAYER"
          grep -Fq 'Equalizer text size' "$SETTINGS"
          grep -Fq 'equalizerTextScale = equalizerTextScale.coerceIn(1.0f, 1.8f)' "$SETTINGS"
          grep -Fq 'putFloat("equalizerTextScale"' "$REPO"
          grep -Fq 'preferredPlaybackSpeed.coerceIn(0.25f, 5.0f)' "$REPO"
          echo "Building MyTube v1.8.12 ARM64 + Universal source tree."

      - name: Verify OAuth + navigation release-critical source
        shell: bash
        run: |
          set -euxo pipefail
          AUTH=source/app/src/main/java/com/drivedeck/tubedeck/auth/GoogleAccountSession.kt
          MAIN=source/app/src/main/java/com/drivedeck/tubedeck/MainActivity.kt
          NATIVE=source/app/src/main/java/com/drivedeck/tubedeck/NativePlayerActivity.kt
          BRIDGE=source/app/src/main/java/com/drivedeck/tubedeck/player/NativePipSessionBridge.kt
          BACKSEQ=source/app/src/main/java/com/drivedeck/tubedeck/player/PlaybackBackSequenceTracker.kt
          grep -Fq 'signInGoogleIdentity(activity, clientId)' "$AUTH"
          ! grep -Fq 'googleWebClientId' "$AUTH"
          ! grep -Fq 'LEGACY_SETTINGS_PREFS' "$AUTH"
          ! grep -Fq 'LEGACY_IDENTITY_PREFS' "$AUTH"
          ! grep -Fq 'google_account_session' "$AUTH"
          ! grep -Fq 'tubedeck_prefs' "$AUTH"
          ! grep -Fq 'googleWebClientId' source/app/src/main/java/com/drivedeck/tubedeck/data/model/TubeDeckModels.kt
          ! grep -Fq 'googleWebClientId' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/TubeDeckRepository.kt
          ! grep -Fq 'Google OAuth client' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/SettingsScreen.kt
          grep -Fq 'AuthorizationRequest.Prompt.SELECT_ACCOUNT' "$AUTH"
          grep -Fq 'googleAccountChooserIntent' "$AUTH"
          grep -Fq 'AccountManager.newChooseAccountIntent' "$AUTH"
          grep -Fq 'googleAddAccountIntent' "$AUTH"
          grep -Fq 'Settings.ACTION_ADD_ACCOUNT' "$AUTH"
          grep -Fq 'mytube_account_session_v2' "$AUTH"
          test -f source/app/src/main/java/com/drivedeck/tubedeck/auth/GoogleDeviceCodeOAuth.kt
          grep -Fq 'https://oauth2.googleapis.com/device/code' source/app/src/main/java/com/drivedeck/tubedeck/auth/GoogleDeviceCodeOAuth.kt
          grep -Fq 'urn:ietf:params:oauth:grant-type:device_code' source/app/src/main/java/com/drivedeck/tubedeck/auth/GoogleDeviceCodeOAuth.kt
          grep -Fq 'mytube_google_device_refresh_v1' source/app/src/main/java/com/drivedeck/tubedeck/auth/GoogleDeviceCodeOAuth.kt
          grep -Fq 'AndroidKeyStore' source/app/src/main/java/com/drivedeck/tubedeck/auth/GoogleDeviceCodeOAuth.kt
          grep -Fq 'startDeviceCodeAuthorization' "$AUTH"
          grep -Fq 'completeDeviceTokenSet' "$AUTH"
          grep -Fq 'isDeviceCodeConfigured' "$AUTH"
          grep -Fq 'GoogleDeviceCodeDialog' "$MAIN"
          grep -Fq 'repository.clearWatchHistory()' "$MAIN"
          grep -Fq 'Watch history cleared · Relevant feed refreshed' "$MAIN"
          grep -Fq 'GoogleDeviceCodeDialog' "$NATIVE"
          ! grep -Fq 'authorizeWithGoogleAuthUtil' "$AUTH"
          ! grep -Fq 'GoogleAuthUtil.getToken' "$AUTH"
          ! grep -Fq 'UserRecoverableAuthException' "$AUTH"
          grep -Fq 'youtubeAuthorized: Boolean = false' "$AUTH"
          ! grep -Fq 'GoogleSignIn' "$AUTH"
          grep -Fq 'Fresh-install invariant' "$AUTH"
          grep -Fq 'googleAccountChooserIntent' "$MAIN"
          grep -Fq 'googleAccountChooserIntent' "$NATIVE"
          grep -Fq 'googleid:googleid:1.1.1' source/app/build.gradle.kts
          grep -Fq 'parseGoogleIdTokenClaims' "$AUTH"
          grep -Fq 'setAccount(Account(identity.email, "com.google"))' "$AUTH"
          grep -Fq 'https://www.googleapis.com/auth/youtube.readonly' "$AUTH"
          grep -Fq 'channels?part=snippet&mine=true' "$AUTH"
          grep -Fq 'subscriptions?part=id&mine=true' "$AUTH"
          grep -Fq 'NativePipSessionBridge' "$MAIN"
          grep -Fq 'NativePipSessionBridge' "$NATIVE"
          grep -Fq 'Keep PiP' "$NATIVE"
          grep -Fq 'PlaybackBackAction.CLOSE_PLAYBACK' "$MAIN"
          grep -Fq 'PlaybackBackAction.CLOSE_PLAYBACK' "$NATIVE"
          grep -Fq 'NativePipSessionBridge.Action.SHOW_CHOOSER' "$MAIN"
          grep -Fq 'NativePipSessionBridge.Action.SHOW_CHOOSER' "$NATIVE"
          grep -Fq 'NativePipSessionBridge.Action.PAUSE' "$NATIVE"
          grep -Fq 'NativePipSessionBridge.Action.PAUSE' "$MAIN"
          grep -Fq 'PlaybackBackSequenceTracker.record' "$MAIN"
          grep -Fq 'PlaybackBackSequenceTracker.record' "$NATIVE"
          grep -Fq 'RAPID_GAP_MS = 550L' "$BACKSEQ"
          grep -Fq 'moveTaskToBack(true)' "$MAIN"
          grep -Fq 'activityClass = NativePlayerActivity::class.java' "$NATIVE"
          grep -Fq 'pipExitPendingStop' "$NATIVE"
          grep -Fq 'delay(1_800L)' "$NATIVE"
          grep -Fq 'stale/malformed internal intent must never tear down' "$NATIVE"
          grep -Fq 'BackgroundAudioController.stop(applicationContext)' "$NATIVE"
          grep -Fq 'setCloseAction(closeAction)' source/app/src/main/java/com/drivedeck/tubedeck/player/PlaybackPipActions.kt
          grep -Fq '.setActions(listOf(keepAction, audioAction))' source/app/src/main/java/com/drivedeck/tubedeck/player/PlaybackPipActions.kt
          ! grep -Fq '.setActions(listOf(keepAction, audioAction, closeAction))' source/app/src/main/java/com/drivedeck/tubedeck/player/PlaybackPipActions.kt
          grep -Fq 'pipExitResolutionJob' "$NATIVE"
          grep -Fq 'delay(1_800L)' "$NATIVE"
          grep -Fq 'foregroundPlaybackAllowed = false' "$NATIVE"
          grep -Fq 'pauseGeneration += 1' "$NATIVE"
          grep -Fq 'ACTION_KEEP_PIP' source/app/src/main/java/com/drivedeck/tubedeck/player/PlaybackPipActions.kt
          grep -Fq 'PlaybackPipActionReceiver' source/app/src/main/AndroidManifest.xml
          grep -Fq 'resolveForDownload' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/MediaDownloader.kt
          RESOLVER=source/app/src/main/java/com/drivedeck/tubedeck/player/YoutubeStreamResolver.kt
          grep -Fq 'resolveWithDownloadEngine' "$RESOLVER"
          grep -Fq 'parseDownloadEngineSubtitles(root)' "$RESOLVER"
          grep -Fq 'collect("automatic_captions", autoGenerated = true)' "$RESOLVER"
          grep -Fq 'subtitles = engineSubtitles' "$RESOLVER"
          grep -Fq 'youtubedl-android:ffmpeg:0.18.1' source/app/build.gradle.kts
          grep -Fq 'FFmpeg.init(app)' source/app/src/main/java/com/drivedeck/tubedeck/player/YtDlpUpdateManager.kt
          grep -Fq 'YoutubeDL.execute(' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/MediaDownloader.kt
          ! grep -Fq 'MediaExtractor' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/MediaDownloader.kt
          grep -Fq 'latestVersion' source/app/src/main/java/com/drivedeck/tubedeck/player/YtDlpUpdateManager.kt
          grep -Fq 'pipExitPendingStop' "$MAIN"
          grep -Fq 'PiP exit alone is not a request to show the 3-option chooser' "$MAIN"
          grep -Fq 'Cancel the close watchdog and clear the bridge only after expansion is confirmed' "$NATIVE"
          grep -Fq 'cancelPending' source/app/src/main/java/com/drivedeck/tubedeck/player/AudioHandoffStartup.kt
          grep -Fq 'centerControlDiameter = if (compactPortrait) 52.dp else 60.dp' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'ERROR_CODE_DECODER_INIT_FAILED' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq '!youtubeVideo || inPictureInPicture' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt || grep -Fq '!youtubeVideo || inPictureInPicture)' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'vaultListView' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/DownloadsScreen.kt
          grep -Fq 'GridView' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/DownloadsScreen.kt
          grep -Fq 'chooseFileDestination(request)' "$MAIN"
          grep -Fq 'append("Q").append(currentQueue)' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/DownloadQueueNotifier.kt
          grep -Fq 'append("  ✓").append(finished)' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/DownloadQueueNotifier.kt
          grep -Fq 'append("  F").append(failed)' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/DownloadQueueNotifier.kt
          grep -Fq 'append("  R").append(retriedTasks)' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/DownloadQueueNotifier.kt
          grep -Fq 'append("  ETA ").append' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/DownloadQueueNotifier.kt
          grep -Fq 'if (!hasQueueWork)' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/DownloadQueueNotifier.kt
          ! grep -Fq 'append("  ⏱")' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/DownloadQueueNotifier.kt
          grep -Fq 'STOP_FOREGROUND_REMOVE' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/DownloadForegroundService.kt
          grep -Fq '!firstFrameRendered' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'onRenderedFirstFrame' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          ! grep -Fq 'listOf("All", "Music", "Gaming", "News", "Live", "Technology", "Sports", "Movies", "Learning")' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/DriveDeckScreen.kt
          grep -Fq 'vaultListView by rememberSaveable { mutableStateOf(true) }' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/DownloadsScreen.kt
          grep -Fq 'queueListView by rememberSaveable { mutableStateOf(true) }' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/DownloadsScreen.kt
          grep -Fq 'Finished/Completed' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/DownloadsScreen.kt
          grep -Fq 'Pending/Queue' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/DownloadsScreen.kt
          ! grep -Fq 'Copy files' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/DownloadsScreen.kt
          grep -Fq 'canonicalVideoUrl' source/app/src/main/java/com/drivedeck/tubedeck/player/YoutubeUrls.kt
          grep -Fq 'canonicalVideoUrl(url)' source/app/src/main/java/com/drivedeck/tubedeck/player/YoutubeStreamResolver.kt
          grep -Fq 'resolvePlaybackWithFallback' source/app/src/main/java/com/drivedeck/tubedeck/player/YoutubeStreamResolver.kt
          grep -Fq 'resolveWithDownloadEngine(context, canonicalUrl)' source/app/src/main/java/com/drivedeck/tubedeck/player/YoutubeStreamResolver.kt
          grep -Fq 'DownloadQueuePolicy.pendingTasks' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/DownloadsScreen.kt
          grep -Fq 'MAX_AUTO_RETRIES = 7' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/DownloadRetryPolicy.kt
          grep -Fq 'Activity/History' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/DownloadsScreen.kt
          grep -Fq 'PlaybackEqualizerController(context.applicationContext)' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'Graphic equalizer' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'Do not touch AudioFX here' source/app/src/main/java/com/drivedeck/tubedeck/player/PlaybackEqualizerController.kt
          grep -Fq 'fun prepareEqualizer()' source/app/src/main/java/com/drivedeck/tubedeck/player/PlaybackEqualizerController.kt
          grep -Fq 'equalizerController.prepareEqualizer()' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'equalizerController.probeDts()' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'isTvLikePlaybackDevice(context)' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq '.setEnableDecoderFallback(true)' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'requestedTarget.coerceAtMost(if (resourceLimits.constrained) resourceLimits.maxAutoVideoHeight else 720)' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'PlaybackResourcePolicy.detect' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'resourceLimits.targetBufferBytes' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          test -f source/app/src/test/java/com/drivedeck/tubedeck/player/PlaybackResourcePolicyTest.kt
          grep -Fq 'COMMENTS_PRIMARY_TIMEOUT_MS = 8_000L' source/app/src/main/java/com/drivedeck/tubedeck/player/YoutubeStreamResolver.kt
          grep -Fq 'COMMENTS_FALLBACK_TIMEOUT_MS = 10_000L' source/app/src/main/java/com/drivedeck/tubedeck/player/YoutubeStreamResolver.kt
          grep -Fq 'youtube:max_comments=$safeLimit,$safeLimit,0,0;comment_sort=top' source/app/src/main/java/com/drivedeck/tubedeck/player/YoutubeStreamResolver.kt
          grep -Fq 'YoutubeStreamResolver.commentsBatch(' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'Comments are disabled for this video' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'Text("Load more")' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'enum class PlaybackContinuationMode' source/app/src/main/java/com/drivedeck/tubedeck/data/model/TubeDeckModels.kt
          grep -Fq 'putString("playbackContinuationMode", next.playbackContinuationMode.name)' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/TubeDeckRepository.kt
          grep -Fq 'putFloat("playerControllerScale"' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/TubeDeckRepository.kt
          grep -Fq 'putBoolean("showRelevantShelf"' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/TubeDeckRepository.kt
          grep -Fq 'putBoolean("showEpisodesShelf"' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/TubeDeckRepository.kt
          grep -Fq 'putBoolean("homeHistoryEnabled", next.homeHistoryEnabled)' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/TubeDeckRepository.kt
          grep -Fq 'homeHistoryEnabled = prefs.getBoolean("homeHistoryEnabled", true)' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/TubeDeckRepository.kt
          grep -Fq 'ToggleRow("Relevant"' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/SettingsScreen.kt
          grep -Fq 'ToggleRow("History"' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/SettingsScreen.kt
          grep -Fq 'ToggleRow("Trending"' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/SettingsScreen.kt
          grep -Fq 'if (historyEnabled)' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/DriveDeckScreen.kt
          grep -Fq 'Controller size ·' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/SettingsScreen.kt
          grep -Fq 'Swipe shelf · Relevant row' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/SettingsScreen.kt
          grep -Fq 'Swipe shelf · Episodes row' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/SettingsScreen.kt
          grep -Fq 'playbackCardsSwipeZone' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'showPlaybackModeCards = totalDy < -(size.height * .08f)' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'private fun PlaybackContinuationCards(' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'PlaybackContinuationMode.LOOP_CURRENT -> Icons.Default.Repeat' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'Player.REPEAT_MODE_ONE' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
