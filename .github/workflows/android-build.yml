name: Build MyTube Android APKs

on:
  push:
    branches: [ main ]
    paths:
      - 'source/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mytube-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
    timeout-minutes: 65

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify v1.3.13 dual-APK source
        shell: bash
        run: |
          set -euo pipefail
          test -f source/settings.gradle.kts
          grep -q 'versionName = "1.3.13"' source/app/build.gradle.kts
          grep -q 'create("arm64")' source/app/build.gradle.kts
          grep -q 'create("universal")' source/app/build.gradle.kts
          grep -q 'armeabi-v7a' source/app/build.gradle.kts
          grep -q 'nativeWhisperSupported' source/app/src/main/java/com/drivedeck/tubedeck/player/WhisperAudioAsr.kt
          echo "Building MyTube v1.3.13 ARM64 + Universal source tree."

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore stable debug signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mytube-debug-signing-v1

      - name: Ensure stable debug signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$HOME/.android/debug.keystore"
          EXPECTED_FILE="$GITHUB_WORKSPACE/.github/mytube-signing-sha1.txt"
          EXPECTED_SHA1="$(tr -d '\r\n ' < "$EXPECTED_FILE")"
          mkdir -p "$(dirname "$KEYSTORE")"

          if [ ! -s "$KEYSTORE" ]; then
            if [ "$EXPECTED_SHA1" != "UNSET" ] && [ -n "$EXPECTED_SHA1" ]; then
              echo "::error::Pinned MyTube signing key is missing. Refusing to rotate OAuth identity."
              echo "::error::Expected SHA-1: $EXPECTED_SHA1"
              exit 1
            fi
            echo "::notice::Generating the one-time MyTube debug signing identity."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=MyTube Debug,O=MyTube,C=PK"
          fi

          keytool -list -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android >/dev/null
          ACTUAL_SHA1="$(keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android | awk -F': ' '/SHA1:/{print $2; exit}')"
          test -n "$ACTUAL_SHA1"

          if [ "$EXPECTED_SHA1" != "UNSET" ] && [ -n "$EXPECTED_SHA1" ] && [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::MyTube signing SHA-1 mismatch. Refusing to publish a rotated OAuth identity."
            echo "::error::Expected: $EXPECTED_SHA1"
            echo "::error::Actual:   $ACTUAL_SHA1"
            exit 1
          fi

          if [ "$EXPECTED_SHA1" = "UNSET" ] || [ -z "$EXPECTED_SHA1" ]; then
            echo "MYTUBE_SIGNING_PINNED=false" >> "$GITHUB_ENV"
            echo "::notice::First signing identity SHA-1: $ACTUAL_SHA1"
          else
            echo "MYTUBE_SIGNING_PINNED=true" >> "$GITHUB_ENV"
          fi
          echo "MYTUBE_SIGNING_SHA1=$ACTUAL_SHA1" >> "$GITHUB_ENV"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Provision multilingual Whisper Tiny Q5_1 model
        shell: bash
        run: |
          set -euo pipefail
          MODEL="$GITHUB_WORKSPACE/source/app/src/main/assets/models/ggml-tiny-q5_1.bin"
          EXPECTED_SHA1=2827a03e495b1ed3048ef28a6a4620537db4ee51
          mkdir -p "$(dirname "$MODEL")"
          if [ ! -s "$MODEL" ]; then
            curl -fL --retry 3 --retry-delay 3 \
              https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin \
              -o "$MODEL"
          fi
          echo "$EXPECTED_SHA1  $MODEL" | sha1sum -c -
          ls -lh "$MODEL"

      - name: Run unit tests for both editions
        run: gradle -p source testArm64DebugUnitTest testUniversalDebugUnitTest --stacktrace

      - name: Run Android lint for both editions
        shell: bash
        run: |
          set +e
          gradle -p source lintArm64Debug lintUniversalDebug --continue --stacktrace
          STATUS=$?
          echo "===== FULL ANDROID LINT REPORTS ====="
          find source/app/build -type f -name 'lint-results-*.txt' -print -exec cat {} \; 2>/dev/null || true
          exit "$STATUS"

      - name: Build ARM64 and Universal debug APKs
        run: gradle -p source assembleArm64Debug assembleUniversalDebug --stacktrace

      - name: Verify APK ABI coverage
        shell: bash
        run: |
          set -euo pipefail
          ARM64="$GITHUB_WORKSPACE/source/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk"
          UNIVERSAL="$GITHUB_WORKSPACE/source/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          test -s "$ARM64"
          test -s "$UNIVERSAL"

          echo "ARM64 native libraries:"
          unzip -l "$ARM64" | grep 'lib/.*\.so' | awk '{print $4}' | head -80
          echo "Universal native libraries:"
          unzip -l "$UNIVERSAL" | grep 'lib/.*\.so' | awk '{print $4}' | head -160

          unzip -l "$ARM64" | grep -q 'lib/arm64-v8a/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/arm64-v8a/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/armeabi-v7a/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/x86_64/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/x86/'

      - name: Report OAuth registration identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          KEYSTORE="$HOME/.android/debug.keystore"
          test -s "$KEYSTORE"
          SHA1="$MYTUBE_SIGNING_SHA1"
          test -n "$SHA1"
          {
            echo "MyTube Google / YouTube OAuth registration identity"
            echo "Application ID: com.aistudio.tubedeck.kxmvd"
            echo "Signing SHA-1: $SHA1"
            echo "Required scope: https://www.googleapis.com/auth/youtube.readonly"
            echo "Google Cloud requirement: register an Android OAuth client with this exact package + SHA-1 and enable YouTube Data API v3."
          } | tee "$GITHUB_WORKSPACE/dist/MyTube-v1.3.13-OAuth-Registration.txt"
          echo "### MyTube OAuth registration" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: `com.aistudio.tubedeck.kxmvd`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-1: `$SHA1`" >> "$GITHUB_STEP_SUMMARY"

      - name: Stage both APKs and complete source
        shell: bash
        run: |
          set -euo pipefail
          ARM64="$GITHUB_WORKSPACE/source/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk"
          UNIVERSAL="$GITHUB_WORKSPACE/source/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          mkdir -p "$GITHUB_WORKSPACE/dist"

          cp "$ARM64" "$GITHUB_WORKSPACE/dist/MyTube-v1.3.13-ARM64-Whisper-DownloadEngine-debug.apk"
          cp "$UNIVERSAL" "$GITHUB_WORKSPACE/dist/MyTube-v1.3.13-Universal-Older-Rooted-debug.apk"

          SOURCE_ZIP="$GITHUB_WORKSPACE/dist/MyTube-r6.5-LiveDub-v1.3.13-Complete-AndroidStudio-Source.zip"
          (
            cd "$GITHUB_WORKSPACE/source"
            zip -qr "$SOURCE_ZIP" . \
              -x '.gradle/*' \
              -x '*/build/*' \
              -x 'local.properties'
          )

          cd "$GITHUB_WORKSPACE"
          sha256sum dist/MyTube-v1.3.13-ARM64-Whisper-DownloadEngine-debug.apk > dist/MyTube-v1.3.13-ARM64-Whisper-DownloadEngine-debug.apk.sha256
          sha256sum dist/MyTube-v1.3.13-Universal-Older-Rooted-debug.apk > dist/MyTube-v1.3.13-Universal-Older-Rooted-debug.apk.sha256
          sha256sum dist/MyTube-r6.5-LiveDub-v1.3.13-Complete-AndroidStudio-Source.zip > dist/MyTube-r6.5-LiveDub-v1.3.13-Complete-AndroidStudio-Source.zip.sha256
          test -s dist/MyTube-v1.3.13-OAuth-Registration.txt
          ls -lh dist/
          cat dist/*.sha256

      - name: Publish v1.3.13 dual APK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if [ "${MYTUBE_SIGNING_PINNED:-false}" != "true" ]; then
            echo "::notice::Signing identity bootstrap complete; release publication is intentionally skipped until the reported SHA-1 is pinned in .github/mytube-signing-sha1.txt."
            exit 0
          fi
          TAG="v1.3.13-dual-arm64-universal-debug"
          NOTES="MyTube r6.5 LiveDub v1.3.13.

          360-degree lifecycle / playback audit:
          - Central PlaybackHostRouter is now authoritative for Web versus Native playback across home/history, browser interception, deep links, related videos and restored sessions.
          - Saved Web mode can no longer be bypassed by a stale NativePlayerActivity session.
          - Native playback pauses whenever it is neither foreground nor genuinely in PiP; dismissed PiP can no longer masquerade as unintended audio-only playback.
          - WebView playback follows the same rule and pauses when the task leaves foreground outside PiP.
          - PiP return refreshes YouTube signed stream URLs only after the Activity genuinely resumes, preserving position and avoiding background extractor work.
          - Explicit audio-only keeps the original watch URL plus a live position snapshot; foreground replay invalidates the temporary CDN URL, resolves fresh media and resumes near the same position.
          - Close remains a hard teardown of foreground playback plus background audio service/session.
          - Playback session ownership blocks stale Android task/history restoration from resurrecting old videos.

          Back / PiP:
          - Back never selects Close or Audio on the user's behalf.
          - The explicit Close / Audio / PiP chooser remains the only terminal playback decision surface.
          - PiP Options returns to the existing player; subsequent foreground Back reaches the chooser.
          - Extra Back callbacks while the chooser is visible are ignored rather than interpreted as a playback choice.

          Performance / resource use:
          - Auto-load Episodes and Auto-load Up Next remain independently configurable and default OFF.
          - Companion shelves wait until after first frame before loading even when enabled.
          - Browser URL polling is suspended while the app is not RESUMED.
          - Recommendation extraction respects the Up Next setting.
          - Download queue remains unrestricted while device-aware admission protects RAM, CPU, thermals and metered networks.
          - Stale retained download ranges restart cleanly and deterministic media-format failures no longer retry forever.

          Appearance:
          - Ten built-in themes: Glass Midnight, Glass Slate, Neon Cyan, Neon Purple, Neon Lime, Ocean Deep, Ocean Teal, HD Graphite, HD Crimson and AMOLED Black.
          - Custom font scaling from 80% to 135%.
          - Custom RGB adjusters for accent/controls, overall background/theme and primary text.
          - Runtime theme colors now propagate across shared app UI instead of leaving major surfaces hard-coded white.

          YouTube account authorization:
          - Profile-only fake sign-in is not treated as a YouTube session.
          - Connected state requires Google AuthorizationClient youtube.readonly consent plus a successful authenticated YouTube Data API request.
          - OAuth errors show the exact package and signing SHA-1 expected by Google Cloud.
          - The release includes MyTube-v1.3.13-OAuth-Registration.txt with the exact package/SHA-1 from the built APK signing key.
          - Google Cloud must register that Android OAuth client and enable YouTube Data API v3; code cannot bypass Google's registration requirement.

          Build gates:
          - ARM64 + Universal unit tests.
          - Android lint for both editions.
          - ARM64 + Universal APK assembly.
          - ABI verification.
          - OAuth signing identity verification before release publication."

          ASSETS=(
            dist/MyTube-v1.3.13-ARM64-Whisper-DownloadEngine-debug.apk
            dist/MyTube-v1.3.13-ARM64-Whisper-DownloadEngine-debug.apk.sha256
            dist/MyTube-v1.3.13-Universal-Older-Rooted-debug.apk
            dist/MyTube-v1.3.13-Universal-Older-Rooted-debug.apk.sha256
            dist/MyTube-r6.5-LiveDub-v1.3.13-Complete-AndroidStudio-Source.zip
            dist/MyTube-r6.5-LiveDub-v1.3.13-Complete-AndroidStudio-Source.zip.sha256
            dist/MyTube-v1.3.13-OAuth-Registration.txt
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "MyTube v1.3.13 ARM64 + Universal Debug" \
              --notes "$NOTES"
          fi
          gh release view "$TAG"
