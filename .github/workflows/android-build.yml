name: Build MyTube Android APKs

on:
  push:
    branches: [ main ]
    paths:
      - 'source/**'
      - '.github/workflows/android-build.yml'
      - '.github/mytube-signing-sha1.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mytube-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify v1.5.0 dual-APK source
        shell: bash
        run: |
          set -euo pipefail
          test -f source/settings.gradle.kts
          grep -q 'versionName = "1.5.0"' source/app/build.gradle.kts
          grep -q 'create("arm64")' source/app/build.gradle.kts
          grep -q 'create("universal")' source/app/build.gradle.kts
          grep -q 'armeabi-v7a' source/app/build.gradle.kts
          grep -q 'nativeWhisperSupported' source/app/src/main/java/com/drivedeck/tubedeck/player/WhisperAudioAsr.kt
          echo "Building MyTube v1.5.0 ARM64 + Universal source tree."

      - name: Verify OAuth + navigation release-critical source
        shell: bash
        run: |
          set -euo pipefail
          AUTH=source/app/src/main/java/com/drivedeck/tubedeck/auth/GoogleAccountSession.kt
          MAIN=source/app/src/main/java/com/drivedeck/tubedeck/MainActivity.kt
          NATIVE=source/app/src/main/java/com/drivedeck/tubedeck/NativePlayerActivity.kt
          BRIDGE=source/app/src/main/java/com/drivedeck/tubedeck/player/NativePipSessionBridge.kt
          BACKSEQ=source/app/src/main/java/com/drivedeck/tubedeck/player/PlaybackBackSequenceTracker.kt
          grep -Fq 'signInGoogleIdentity(activity, clientId)' "$AUTH"
          ! grep -Fq 'googleWebClientId' "$AUTH"
          ! grep -Fq 'LEGACY_SETTINGS_PREFS' "$AUTH"
          ! grep -Fq 'LEGACY_IDENTITY_PREFS' "$AUTH"
          ! grep -Fq 'google_account_session' "$AUTH"
          ! grep -Fq 'tubedeck_prefs' "$AUTH"
          ! grep -Fq 'googleWebClientId' source/app/src/main/java/com/drivedeck/tubedeck/data/model/TubeDeckModels.kt
          ! grep -Fq 'googleWebClientId' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/TubeDeckRepository.kt
          ! grep -Fq 'Google OAuth client' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/SettingsScreen.kt
          grep -Fq 'AuthorizationRequest.Prompt.SELECT_ACCOUNT' "$AUTH"
          grep -Fq 'googleAccountChooserIntent' "$AUTH"
          grep -Fq 'AccountManager.newChooseAccountIntent' "$AUTH"
          grep -Fq 'googleAddAccountIntent' "$AUTH"
          grep -Fq 'Settings.ACTION_ADD_ACCOUNT' "$AUTH"
          grep -Fq 'mytube_account_session_v2' "$AUTH"
          test -f source/app/src/main/java/com/drivedeck/tubedeck/auth/GoogleDeviceCodeOAuth.kt
          grep -Fq 'https://oauth2.googleapis.com/device/code' source/app/src/main/java/com/drivedeck/tubedeck/auth/GoogleDeviceCodeOAuth.kt
          grep -Fq 'urn:ietf:params:oauth:grant-type:device_code' source/app/src/main/java/com/drivedeck/tubedeck/auth/GoogleDeviceCodeOAuth.kt
          grep -Fq 'mytube_google_device_refresh_v1' source/app/src/main/java/com/drivedeck/tubedeck/auth/GoogleDeviceCodeOAuth.kt
          grep -Fq 'AndroidKeyStore' source/app/src/main/java/com/drivedeck/tubedeck/auth/GoogleDeviceCodeOAuth.kt
          grep -Fq 'startDeviceCodeAuthorization' "$AUTH"
          grep -Fq 'completeDeviceTokenSet' "$AUTH"
          grep -Fq 'isDeviceCodeConfigured' "$AUTH"
          grep -Fq 'GoogleDeviceCodeDialog' "$MAIN"
          grep -Fq 'GoogleDeviceCodeDialog' "$NATIVE"
          ! grep -Fq 'authorizeWithGoogleAuthUtil' "$AUTH"
          ! grep -Fq 'GoogleAuthUtil.getToken' "$AUTH"
          ! grep -Fq 'UserRecoverableAuthException' "$AUTH"
          grep -Fq 'youtubeAuthorized: Boolean = false' "$AUTH"
          ! grep -Fq 'GoogleSignIn' "$AUTH"
          grep -Fq 'Fresh-install invariant' "$AUTH"
          grep -Fq 'googleAccountChooserIntent' "$MAIN"
          grep -Fq 'googleAccountChooserIntent' "$NATIVE"
          grep -Fq 'googleid:googleid:1.1.1' source/app/build.gradle.kts
          grep -Fq 'parseGoogleIdTokenClaims' "$AUTH"
          grep -Fq 'setAccount(Account(identity.email, "com.google"))' "$AUTH"
          grep -Fq 'https://www.googleapis.com/auth/youtube.readonly' "$AUTH"
          grep -Fq 'channels?part=snippet&mine=true' "$AUTH"
          grep -Fq 'subscriptions?part=id&mine=true' "$AUTH"
          grep -Fq 'NativePipSessionBridge' "$MAIN"
          grep -Fq 'NativePipSessionBridge' "$NATIVE"
          grep -Fq 'Keep PiP' "$NATIVE"
          grep -Fq 'PlaybackBackAction.CLOSE_PLAYBACK' "$MAIN"
          grep -Fq 'PlaybackBackAction.CLOSE_PLAYBACK' "$NATIVE"
          grep -Fq 'NativePipSessionBridge.Action.SHOW_CHOOSER' "$MAIN"
          grep -Fq 'NativePipSessionBridge.Action.SHOW_CHOOSER' "$NATIVE"
          grep -Fq 'NativePipSessionBridge.Action.PAUSE' "$NATIVE"
          grep -Fq 'NativePipSessionBridge.Action.PAUSE' "$MAIN"
          grep -Fq 'PlaybackBackSequenceTracker.record' "$MAIN"
          grep -Fq 'PlaybackBackSequenceTracker.record' "$NATIVE"
          grep -Fq 'RAPID_GAP_MS = 550L' "$BACKSEQ"
          grep -Fq 'moveTaskToBack(true)' "$MAIN"
          grep -Fq 'activityClass = NativePlayerActivity::class.java' "$NATIVE"
          grep -Fq 'pipExitPendingStop' "$NATIVE"
          grep -Fq 'BackgroundAudioController.stop(applicationContext)' "$NATIVE"
          if grep -Fq 'showParentBehindPip' "$NATIVE"; then
            echo "::error::NativePlayerActivity must not launch/reorder MainActivity for the native PiP chooser."
            exit 1
          fi
          grep -Fq 'Retry sign-in' source/app/src/main/java/com/drivedeck/tubedeck/ui/components/GoogleAccountUi.kt
          grep -Fq 'withGoogleAuthorizationTimeout' "$AUTH"
          grep -Fq 'cancelYoutubeAuthorization' "$MAIN"
          grep -Fq 'cancelYoutubeAuthorization' "$NATIVE"
          grep -Fq 'Cancel sign-in' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/SettingsScreen.kt
          echo "Release-critical Google OAuth and Back/PiP source checks passed."

      - name: Verify MyTube Android OAuth configuration
        shell: bash
        run: |
          set -euo pipefail
          CLIENT_ID="$(sed -n 's/^GOOGLE_WEB_CLIENT_ID=//p' source/gradle.properties | tr -d '\r')"
          test "$CLIENT_ID" = "452637572013-j7n0rvi7bkgtei3c979tr004h4da31nh.apps.googleusercontent.com"
          echo "MYTUBE_WEB_CLIENT_ID=$CLIENT_ID" >> "$GITHUB_ENV"
          echo "MyTube Web client configured for Credential Manager."

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore stable debug signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mytube-debug-signing-v1

      # Signing identity pinned in .github/mytube-signing-sha1.txt
      - name: Ensure stable debug signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$HOME/.android/debug.keystore"
          EXPECTED_FILE="$GITHUB_WORKSPACE/.github/mytube-signing-sha1.txt"
          EXPECTED_SHA1="$(tr -d '\r\n ' < "$EXPECTED_FILE")"
          mkdir -p "$(dirname "$KEYSTORE")"

          if [ ! -s "$KEYSTORE" ]; then
            if [ "$EXPECTED_SHA1" != "UNSET" ] && [ -n "$EXPECTED_SHA1" ]; then
              echo "::error::Pinned MyTube signing key is missing. Refusing to rotate OAuth identity."
              echo "::error::Expected SHA-1: $EXPECTED_SHA1"
              exit 1
            fi
            echo "::notice::Generating the one-time MyTube debug signing identity."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=MyTube Debug,O=MyTube,C=PK"
          fi

          keytool -list -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android >/dev/null
          ACTUAL_SHA1="$(keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android | awk -F': ' '/SHA1:/{print $2; exit}')"
          test -n "$ACTUAL_SHA1"

          if [ "$EXPECTED_SHA1" != "UNSET" ] && [ -n "$EXPECTED_SHA1" ] && [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::MyTube signing SHA-1 mismatch. Refusing to publish a rotated OAuth identity."
            echo "::error::Expected: $EXPECTED_SHA1"
            echo "::error::Actual:   $ACTUAL_SHA1"
            exit 1
          fi

          if [ "$EXPECTED_SHA1" = "UNSET" ] || [ -z "$EXPECTED_SHA1" ]; then
            echo "MYTUBE_SIGNING_PINNED=false" >> "$GITHUB_ENV"
            echo "::notice::First signing identity SHA-1: $ACTUAL_SHA1"
          else
            echo "MYTUBE_SIGNING_PINNED=true" >> "$GITHUB_ENV"
          fi
          echo "MYTUBE_SIGNING_SHA1=$ACTUAL_SHA1" >> "$GITHUB_ENV"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Provision multilingual Whisper Tiny Q5_1 model
        shell: bash
        run: |
          set -euo pipefail
          MODEL="$GITHUB_WORKSPACE/source/app/src/main/assets/models/ggml-tiny-q5_1.bin"
          EXPECTED_SHA1=2827a03e495b1ed3048ef28a6a4620537db4ee51
          mkdir -p "$(dirname "$MODEL")"
          if [ ! -s "$MODEL" ]; then
            curl -fL --retry 3 --retry-delay 3 \
              https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin \
              -o "$MODEL"
          fi
          echo "$EXPECTED_SHA1  $MODEL" | sha1sum -c -
          ls -lh "$MODEL"

      - name: Run unit tests for both editions
        run: gradle -p source testArm64DebugUnitTest testUniversalDebugUnitTest --stacktrace

      - name: Run Android lint for both editions
        shell: bash
        run: |
          set +e
          gradle -p source lintArm64Debug lintUniversalDebug --continue --stacktrace
          STATUS=$?
          echo "===== FULL ANDROID LINT REPORTS ====="
          find source/app/build -type f -name 'lint-results-*.txt' -print -exec cat {} \; 2>/dev/null || true
          exit "$STATUS"

      - name: Build ARM64 and Universal debug APKs
        run: gradle -p source assembleArm64Debug assembleUniversalDebug --stacktrace

      - name: Verify compiled Android OAuth configuration
        shell: bash
        run: |
          set -euo pipefail
          for EDITION in arm64 universal; do
            CONFIG="source/app/build/generated/source/buildConfig/$EDITION/debug/com/drivedeck/tubedeck/BuildConfig.java"
            test -s "$CONFIG"
            grep -Fq "GOOGLE_WEB_CLIENT_ID = \"$MYTUBE_WEB_CLIENT_ID\"" "$CONFIG"
            grep -Fq 'GOOGLE_DEVICE_CLIENT_ID = ""' "$CONFIG"
            grep -Fq 'GOOGLE_DEVICE_CLIENT_SECRET = ""' "$CONFIG"
          done
          echo "Both APK variants embed the MyTube Web client; TV credentials are disabled."

      - name: Verify visible refinements are inside compiled APKs
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="$GITHUB_WORKSPACE/source/app/build/outputs/apk"
          for APK in             "$APK_DIR/arm64/debug/app-arm64-debug.apk"             "$APK_DIR/universal/debug/app-universal-debug.apk"; do
            test -s "$APK"
            DEX_STRINGS="$(mktemp)"
            unzip -p "$APK" 'classes*.dex' | strings > "$DEX_STRINGS"
            grep -Fq "$MYTUBE_WEB_CLIENT_ID" "$DEX_STRINGS"
            grep -Fq 'Cancel sign-in' "$DEX_STRINGS"
            grep -Fq 'Sign in with Google' "$DEX_STRINGS"
            grep -Fq 'Local trending' "$DEX_STRINGS"
            grep -Fq 'Seek interval' "$DEX_STRINGS"
            grep -Fq 'Video actions' "$DEX_STRINGS"
            grep -Fq 'Audio only' "$DEX_STRINGS"
            grep -Fq 'Picture in Picture' "$DEX_STRINGS"
            grep -Fq 'Keep PiP' "$DEX_STRINGS"
            grep -Fq 'Retry sign-in' "$DEX_STRINGS"
            grep -Fq 'youtube.readonly' "$DEX_STRINGS"
            grep -Fq 'Signed in with Google' "$DEX_STRINGS"
            grep -Fq 'Google signed in' "$DEX_STRINGS"
            grep -Fq 'Google + YouTube connected' "$DEX_STRINGS"
            grep -Fq 'android.settings.ADD_ACCOUNT_SETTINGS' "$DEX_STRINGS"
            grep -Fq 'mytube_account_session_v2' "$DEX_STRINGS"
            grep -Fq 'Sign in with code' "$DEX_STRINGS"
            grep -Fq 'https://oauth2.googleapis.com/device/code' "$DEX_STRINGS"
            grep -Fq 'Waiting for Google approval' "$DEX_STRINGS"
            rm -f "$DEX_STRINGS"
          done
          echo "Compiled APKs contain the v1.5.0 visible refinement surfaces."

      - name: Verify APK ABI coverage
        shell: bash
        run: |
          set -euo pipefail
          ARM64="$GITHUB_WORKSPACE/source/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk"
          UNIVERSAL="$GITHUB_WORKSPACE/source/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          test -s "$ARM64"
          test -s "$UNIVERSAL"

          echo "ARM64 native libraries:"
          unzip -l "$ARM64" | grep 'lib/.*\.so' | awk '{print $4}' | head -80
          echo "Universal native libraries:"
          unzip -l "$UNIVERSAL" | grep 'lib/.*\.so' | awk '{print $4}' | head -160

          unzip -l "$ARM64" | grep -q 'lib/arm64-v8a/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/arm64-v8a/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/armeabi-v7a/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/x86_64/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/x86/'

      - name: Verify actual APK signing and report install compatibility
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          PREVIOUS_DIR="$(mktemp -d)"
          gh release download v1.4.9-dual-arm64-universal-debug --repo "$GITHUB_REPOSITORY" --pattern 'MyTube-v1.4.9-ARM64-Whisper-DownloadEngine-debug.apk' --dir "$PREVIOUS_DIR"
          PREVIOUS_APK="$PREVIOUS_DIR/MyTube-v1.4.9-ARM64-Whisper-DownloadEngine-debug.apk"
          PREVIOUS_SHA1="$("$APKSIGNER" verify --print-certs "$PREVIOUS_APK" | sed -n 's/.*certificate SHA-1 digest: //p' | head -n 1)"
          test -n "$PREVIOUS_SHA1"
          PINNED_SHA1="$(printf '%s' "$MYTUBE_SIGNING_SHA1" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          for EDITION in arm64 universal; do
            APK="source/app/build/outputs/apk/$EDITION/debug/app-$EDITION-debug.apk"
            ACTUAL_SHA1="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-1 digest: //p' | head -n 1)"
            if [ "$ACTUAL_SHA1" != "$PINNED_SHA1" ]; then
              echo "::error::Actual APK signing certificate differs from the saved, pinned key."
              exit 1
            fi
          done
          echo "MYTUBE_SIGNING_SHA1=$ACTUAL_SHA1" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          {
            echo "Previous v1.4.9 signing certificate: $PREVIOUS_SHA1"
            echo "Saved stable signing certificate used by v1.5.0: $ACTUAL_SHA1"
            test "$ACTUAL_SHA1" = "$PREVIOUS_SHA1"
            echo "The APK is compatible with an update over v1.4.9."
          } | tee "$GITHUB_WORKSPACE/dist/MyTube-v1.5.0-Install-Compatibility.txt"

      - name: Report OAuth registration identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          KEYSTORE="$HOME/.android/debug.keystore"
          test -s "$KEYSTORE"
          SHA1="$MYTUBE_SIGNING_SHA1"
          test -n "$SHA1"
          {
            echo "MyTube Google / YouTube OAuth registration identity"
            echo "Application ID: com.aistudio.tubedeck.kxmvd"
            echo "Signing SHA-1: $SHA1"
            echo "Required scope: https://www.googleapis.com/auth/youtube.readonly"
            echo "Google Cloud requirement: register an Android OAuth client with this exact package + SHA-1 and enable YouTube Data API v3."
          } | tee "$GITHUB_WORKSPACE/dist/MyTube-v1.5.0-OAuth-Registration.txt"
          echo "### MyTube OAuth registration" >> "$GITHUB_STEP_SUMMARY"
          echo '- Package: com.aistudio.tubedeck.kxmvd' >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-1: $SHA1" >> "$GITHUB_STEP_SUMMARY"

      - name: Stage both APKs and complete source
        shell: bash
        run: |
          set -euo pipefail
          ARM64="$GITHUB_WORKSPACE/source/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk"
          UNIVERSAL="$GITHUB_WORKSPACE/source/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          mkdir -p "$GITHUB_WORKSPACE/dist"

          cp "$ARM64" "$GITHUB_WORKSPACE/dist/MyTube-v1.5.0-ARM64-Whisper-DownloadEngine-debug.apk"
          cp "$UNIVERSAL" "$GITHUB_WORKSPACE/dist/MyTube-v1.5.0-Universal-Older-Rooted-debug.apk"

          SOURCE_ZIP="$GITHUB_WORKSPACE/dist/MyTube-r6.5-LiveDub-v1.5.0-Complete-AndroidStudio-Source.zip"
          (
            cd "$GITHUB_WORKSPACE/source"
            zip -qr "$SOURCE_ZIP" . \
              -x '.gradle/*' \
              -x '*/build/*' \
              -x 'local.properties'
          )

          cd "$GITHUB_WORKSPACE"
          sha256sum dist/MyTube-v1.5.0-ARM64-Whisper-DownloadEngine-debug.apk > dist/MyTube-v1.5.0-ARM64-Whisper-DownloadEngine-debug.apk.sha256
          sha256sum dist/MyTube-v1.5.0-Universal-Older-Rooted-debug.apk > dist/MyTube-v1.5.0-Universal-Older-Rooted-debug.apk.sha256
          sha256sum dist/MyTube-r6.5-LiveDub-v1.5.0-Complete-AndroidStudio-Source.zip > dist/MyTube-r6.5-LiveDub-v1.5.0-Complete-AndroidStudio-Source.zip.sha256
          test -s dist/MyTube-v1.5.0-OAuth-Registration.txt
          ls -lh dist/
          cat dist/*.sha256

      - name: Upload verified v1.5.0 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyTube-v1.5.0-verified-build
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publish v1.5.0 dual APK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if [ "${MYTUBE_SIGNING_PINNED:-false}" != "true" ]; then
            echo "::notice::Signing identity bootstrap complete; release publication is intentionally skipped until the reported SHA-1 is pinned in .github/mytube-signing-sha1.txt."
            exit 0
          fi
          TAG="v1.5.0-dual-arm64-universal-debug"
          NOTES="MyTube v1.5.0: player navigation, gestures, buffering UI and interest suggestions.
          - Slow isolated Back while PiP is active keeps PiP small and exits the app instead of maximizing the video.
          - A deliberate quick second Back opens Close / Audio / Keep PiP; rapid triple Back pauses playback.
          - Restore a centered animated buffering/loading indicator during stream resolution, prepare, rebuffer and recovery.
          - Center double-tap toggles fullscreen; edge double-tap keeps seek.
          - Center swipe up enters fullscreen; swipe down returns to the mini player, then can enter PiP.
          - Side vertical gestures remain brightness and volume controls.
          - Suggested now blends related videos from the three most recent watched interests.
          - Suggested falls back to the parsed related shelf when YouTube Watch Next is empty or changes shape.
          - Empty suggestion results no longer poison the 30-minute cache; a short retry backoff is used.
          - Both APKs retain the v1.4.9 signing certificate and must pass unit tests, lint and build checks.
          - Device testing remains necessary for OEM PiP gesture/lifecycle behavior."



          ASSETS=(
            dist/MyTube-v1.5.0-ARM64-Whisper-DownloadEngine-debug.apk
            dist/MyTube-v1.5.0-ARM64-Whisper-DownloadEngine-debug.apk.sha256
            dist/MyTube-v1.5.0-Universal-Older-Rooted-debug.apk
            dist/MyTube-v1.5.0-Universal-Older-Rooted-debug.apk.sha256
            dist/MyTube-r6.5-LiveDub-v1.5.0-Complete-AndroidStudio-Source.zip
            dist/MyTube-r6.5-LiveDub-v1.5.0-Complete-AndroidStudio-Source.zip.sha256
            dist/MyTube-v1.5.0-OAuth-Registration.txt
            dist/MyTube-v1.5.0-Install-Compatibility.txt
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "MyTube v1.5.0 ARM64 + Universal Debug" \
              --notes "$NOTES"
          fi
          gh release view "$TAG"


