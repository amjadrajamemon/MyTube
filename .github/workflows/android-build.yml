name: Build MyTube Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.bootstrap/**'
      - '.ci-patches/**'
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name 'MyTube-*-AndroidStudio-Source.zip' -print -quit)"
          test -n "$ZIP"
          rm -rf "$GITHUB_WORKSPACE/.ci-src"
          mkdir -p "$GITHUB_WORKSPACE/.ci-src"
          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/.ci-src"
          SETTINGS="$(find "$GITHUB_WORKSPACE/.ci-src" -type f -name settings.gradle.kts -print -quit)"
          test -n "$SETTINGS"
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Detected project: $PROJECT_DIR"

      - name: Apply consolidated v1.2.3 stability patch
        shell: bash
        run: |
          set -euo pipefail
          cat "$GITHUB_WORKSPACE"/.ci-patches/v1.2.3.patch.gz.b64.part*             | base64 -d             | gzip -d > /tmp/v1.2.3.patch
          cd "$PROJECT_DIR"
          patch --dry-run -p1 < /tmp/v1.2.3.patch
          patch -p1 < /tmp/v1.2.3.patch
          for HOTFIX in "$GITHUB_WORKSPACE"/.ci-patches/v1.2.3-hotfix*.patch; do
            [ -e "$HOTFIX" ] || continue
            echo "Applying $(basename "$HOTFIX")"
            patch --dry-run -p1 < "$HOTFIX"
            patch -p1 < "$HOTFIX"
          done
          grep -q 'versionName = "1.2.3"' app/build.gradle.kts
          grep -q 'MODEL_NAME = "ggml-tiny-q5_1.bin"' app/src/main/java/com/drivedeck/tubedeck/player/WhisperAudioAsr.kt
          echo "v1.2.3 consolidated patch applied."

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Provision multilingual Whisper Tiny Q5_1 model
        shell: bash
        run: |
          set -euo pipefail
          MODEL="$PROJECT_DIR/app/src/main/assets/models/ggml-tiny-q5_1.bin"
          EXPECTED_SHA1=2827a03e495b1ed3048ef28a6a4620537db4ee51
          mkdir -p "$(dirname "$MODEL")"
          if [ ! -s "$MODEL" ]; then
            curl -fL --retry 3 --retry-delay 3               https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin               -o "$MODEL"
          fi
          echo "$EXPECTED_SHA1  $MODEL" | sha1sum -c -
          ls -lh "$MODEL"

      - name: Run unit tests
        run: gradle -p "$PROJECT_DIR" testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Stage APK and complete source
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/MyTube-v1.2.3-Stable-Whisper-debug.apk"

          SOURCE_ZIP="$GITHUB_WORKSPACE/dist/MyTube-r6.5-LiveDub-v1.2.3-Stable-AndroidStudio-Source.zip"
          (
            cd "$PROJECT_DIR"
            zip -qr "$SOURCE_ZIP" .               -x '.gradle/*'               -x '*/build/*'               -x 'local.properties'
          )

          cd "$GITHUB_WORKSPACE"
          sha256sum dist/MyTube-v1.2.3-Stable-Whisper-debug.apk > dist/MyTube-v1.2.3-Stable-Whisper-debug.apk.sha256
          sha256sum dist/MyTube-r6.5-LiveDub-v1.2.3-Stable-AndroidStudio-Source.zip > dist/MyTube-r6.5-LiveDub-v1.2.3-Stable-AndroidStudio-Source.zip.sha256
          ls -lh dist/
          cat dist/*.sha256

      - name: Publish v1.2.3 APK and source as GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          TAG="v1.2.3-stable-whisper-debug"
          NOTES="MyTube r6.5 LiveDub v1.2.3 stability build.

          Highlights:
          - Native Whisper lifecycle/inference hardening for the reported Android 15 libwhisper/ggml crash.
          - Multilingual Tiny Q5_1 model to reduce native RAM/CPU pressure.
          - Playback-safe PCM tap and larger/recovery-oriented ExoPlayer buffering.
          - Taller portrait video viewport with Zoom default.
          - Caption language dropdown.
          - Dubbing method selector: Auto (prefer captions), Captions, Audio (Whisper).
          - Left/right press-and-hold continuous rewind/fast-forward.
          - YouTube-style Home with topic chips, persisted History, real related-video recommendations and Up next.
          - Unit tests and assembleDebug must pass before this release is published."

          ASSETS=(
            dist/MyTube-v1.2.3-Stable-Whisper-debug.apk
            dist/MyTube-v1.2.3-Stable-Whisper-debug.apk.sha256
            dist/MyTube-r6.5-LiveDub-v1.2.3-Stable-AndroidStudio-Source.zip
            dist/MyTube-r6.5-LiveDub-v1.2.3-Stable-AndroidStudio-Source.zip.sha256
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}"               --target "$GITHUB_SHA"               --title "MyTube v1.2.3 Stable Whisper Debug"               --notes "$NOTES"
          fi
          gh release view "$TAG"
