name: Build MyTube Android APKs

on:
  push:
    branches: [ main ]
    paths:
      - 'source/**'
      - '.github/workflows/android-build.yml'
      - '.github/mytube-signing-sha1.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mytube-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      GOOGLE_DEVICE_CLIENT_ID: ${{ secrets.GOOGLE_DEVICE_CLIENT_ID }}
      GOOGLE_DEVICE_CLIENT_SECRET: ${{ secrets.GOOGLE_DEVICE_CLIENT_SECRET }}
    timeout-minutes: 65

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify v1.4.3 dual-APK source
        shell: bash
        run: |
          set -euo pipefail
          test -f source/settings.gradle.kts
          grep -q 'versionName = "1.4.3"' source/app/build.gradle.kts
          grep -q 'create("arm64")' source/app/build.gradle.kts
          grep -q 'create("universal")' source/app/build.gradle.kts
          grep -q 'armeabi-v7a' source/app/build.gradle.kts
          grep -q 'nativeWhisperSupported' source/app/src/main/java/com/drivedeck/tubedeck/player/WhisperAudioAsr.kt
          echo "Building MyTube v1.4.3 ARM64 + Universal source tree."

      - name: Verify OAuth + navigation release-critical source
        shell: bash
        run: |
          set -euo pipefail
          AUTH=source/app/src/main/java/com/drivedeck/tubedeck/auth/GoogleAccountSession.kt
          MAIN=source/app/src/main/java/com/drivedeck/tubedeck/MainActivity.kt
          NATIVE=source/app/src/main/java/com/drivedeck/tubedeck/NativePlayerActivity.kt
          BRIDGE=source/app/src/main/java/com/drivedeck/tubedeck/player/NativePipSessionBridge.kt
          BACKSEQ=source/app/src/main/java/com/drivedeck/tubedeck/player/PlaybackBackSequenceTracker.kt
          grep -Fq 'signInGoogleIdentity(activity, clientId)' "$AUTH"
          ! grep -Fq 'googleWebClientId' "$AUTH"
          ! grep -Fq 'LEGACY_SETTINGS_PREFS' "$AUTH"
          ! grep -Fq 'LEGACY_IDENTITY_PREFS' "$AUTH"
          ! grep -Fq 'google_account_session' "$AUTH"
          ! grep -Fq 'tubedeck_prefs' "$AUTH"
          ! grep -Fq 'googleWebClientId' source/app/src/main/java/com/drivedeck/tubedeck/data/model/TubeDeckModels.kt
          ! grep -Fq 'googleWebClientId' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/TubeDeckRepository.kt
          ! grep -Fq 'Google OAuth client' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/SettingsScreen.kt
          grep -Fq 'AuthorizationRequest.Prompt.SELECT_ACCOUNT' "$AUTH"
          grep -Fq 'googleAccountChooserIntent' "$AUTH"
          grep -Fq 'AccountManager.newChooseAccountIntent' "$AUTH"
          grep -Fq 'googleAddAccountIntent' "$AUTH"
          grep -Fq 'Settings.ACTION_ADD_ACCOUNT' "$AUTH"
          grep -Fq 'mytube_account_session_v2' "$AUTH"
          grep -Fq 'authorizeWithGoogleAuthUtil' "$AUTH"
          grep -Fq 'GoogleAuthUtil.getToken' "$AUTH"
          grep -Fq 'UserRecoverableAuthException' "$AUTH"
          grep -Fq 'youtubeAuthorized: Boolean = false' "$AUTH"
          ! grep -Fq 'GoogleSignIn' "$AUTH"
          grep -Fq 'Fresh-install invariant' "$AUTH"
          grep -Fq 'googleAccountChooserIntent' "$MAIN"
          grep -Fq 'googleAccountChooserIntent' "$NATIVE"
          grep -Fq 'googleid:googleid:1.1.1' source/app/build.gradle.kts
          grep -Fq 'parseGoogleIdTokenClaims' "$AUTH"
          grep -Fq 'setAccount(Account(identity.email, "com.google"))' "$AUTH"
          grep -Fq 'https://www.googleapis.com/auth/youtube.readonly' "$AUTH"
          grep -Fq 'channels?part=snippet&mine=true' "$AUTH"
          grep -Fq 'subscriptions?part=id&mine=true' "$AUTH"
          grep -Fq 'NativePipSessionBridge' "$MAIN"
          grep -Fq 'NativePipSessionBridge' "$NATIVE"
          grep -Fq 'Keep PiP' "$NATIVE"
          grep -Fq 'PlaybackBackAction.CLOSE_PLAYBACK' "$MAIN"
          grep -Fq 'PlaybackBackAction.CLOSE_PLAYBACK' "$NATIVE"
          grep -Fq 'NativePipSessionBridge.Action.SHOW_CHOOSER' "$MAIN"
          grep -Fq 'NativePipSessionBridge.Action.SHOW_CHOOSER' "$NATIVE"
          grep -Fq 'NativePipSessionBridge.Action.PAUSE' "$NATIVE"
          grep -Fq 'NativePipSessionBridge.Action.PAUSE' "$MAIN"
          grep -Fq 'PlaybackBackSequenceTracker.record' "$MAIN"
          grep -Fq 'PlaybackBackSequenceTracker.record' "$NATIVE"
          grep -Fq 'RAPID_GAP_MS = 550L' "$BACKSEQ"
          grep -Fq 'moveTaskToBack(true)' "$MAIN"
          grep -Fq 'activityClass = NativePlayerActivity::class.java' "$NATIVE"
          grep -Fq 'pipExitPendingStop' "$NATIVE"
          grep -Fq 'BackgroundAudioController.stop(applicationContext)' "$NATIVE"
          if grep -Fq 'showParentBehindPip' "$NATIVE"; then
            echo "::error::NativePlayerActivity must not launch/reorder MainActivity for the native PiP chooser."
            exit 1
          fi
          grep -Fq 'Retry sign-in' source/app/src/main/java/com/drivedeck/tubedeck/ui/components/GoogleAccountUi.kt
          echo "Release-critical Google OAuth and Back/PiP source checks passed."

      - name: Verify clean-install Google sign-in paths
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_WEB_CLIENT_ID:-}" ]; then
            case "$GOOGLE_WEB_CLIENT_ID" in
              *.apps.googleusercontent.com) echo "Optional build-time Google identity configuration present." ;;
              *) echo "::error::Google identity configuration is malformed."; exit 1 ;;
            esac
          else
            echo "::notice::No Web client embedded. Clean installs use Android Google account picker/Add Account plus AuthorizationClient/GoogleAuthUtil fallbacks."
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore stable debug signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mytube-debug-signing-v1

      # Signing identity pinned in .github/mytube-signing-sha1.txt
      - name: Ensure stable debug signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$HOME/.android/debug.keystore"
          EXPECTED_FILE="$GITHUB_WORKSPACE/.github/mytube-signing-sha1.txt"
          EXPECTED_SHA1="$(tr -d '\r\n ' < "$EXPECTED_FILE")"
          mkdir -p "$(dirname "$KEYSTORE")"

          if [ ! -s "$KEYSTORE" ]; then
            if [ "$EXPECTED_SHA1" != "UNSET" ] && [ -n "$EXPECTED_SHA1" ]; then
              echo "::error::Pinned MyTube signing key is missing. Refusing to rotate OAuth identity."
              echo "::error::Expected SHA-1: $EXPECTED_SHA1"
              exit 1
            fi
            echo "::notice::Generating the one-time MyTube debug signing identity."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=MyTube Debug,O=MyTube,C=PK"
          fi

          keytool -list -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android >/dev/null
          ACTUAL_SHA1="$(keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android | awk -F': ' '/SHA1:/{print $2; exit}')"
          test -n "$ACTUAL_SHA1"

          if [ "$EXPECTED_SHA1" != "UNSET" ] && [ -n "$EXPECTED_SHA1" ] && [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::MyTube signing SHA-1 mismatch. Refusing to publish a rotated OAuth identity."
            echo "::error::Expected: $EXPECTED_SHA1"
            echo "::error::Actual:   $ACTUAL_SHA1"
            exit 1
          fi

          if [ "$EXPECTED_SHA1" = "UNSET" ] || [ -z "$EXPECTED_SHA1" ]; then
            echo "MYTUBE_SIGNING_PINNED=false" >> "$GITHUB_ENV"
            echo "::notice::First signing identity SHA-1: $ACTUAL_SHA1"
          else
            echo "MYTUBE_SIGNING_PINNED=true" >> "$GITHUB_ENV"
          fi
          echo "MYTUBE_SIGNING_SHA1=$ACTUAL_SHA1" >> "$GITHUB_ENV"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Provision multilingual Whisper Tiny Q5_1 model
        shell: bash
        run: |
          set -euo pipefail
          MODEL="$GITHUB_WORKSPACE/source/app/src/main/assets/models/ggml-tiny-q5_1.bin"
          EXPECTED_SHA1=2827a03e495b1ed3048ef28a6a4620537db4ee51
          mkdir -p "$(dirname "$MODEL")"
          if [ ! -s "$MODEL" ]; then
            curl -fL --retry 3 --retry-delay 3 \
              https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin \
              -o "$MODEL"
          fi
          echo "$EXPECTED_SHA1  $MODEL" | sha1sum -c -
          ls -lh "$MODEL"

      - name: Run unit tests for both editions
        run: gradle -p source testArm64DebugUnitTest testUniversalDebugUnitTest --stacktrace

      - name: Run Android lint for both editions
        shell: bash
        run: |
          set +e
          gradle -p source lintArm64Debug lintUniversalDebug --continue --stacktrace
          STATUS=$?
          echo "===== FULL ANDROID LINT REPORTS ====="
          find source/app/build -type f -name 'lint-results-*.txt' -print -exec cat {} \; 2>/dev/null || true
          exit "$STATUS"

      - name: Build ARM64 and Universal debug APKs
        run: gradle -p source assembleArm64Debug assembleUniversalDebug --stacktrace

      - name: Verify visible refinements are inside compiled APKs
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="$GITHUB_WORKSPACE/source/app/build/outputs/apk"
          for APK in             "$APK_DIR/arm64/debug/app-arm64-debug.apk"             "$APK_DIR/universal/debug/app-universal-debug.apk"; do
            test -s "$APK"
            DEX_STRINGS="$(mktemp)"
            unzip -p "$APK" 'classes*.dex' | strings > "$DEX_STRINGS"
            grep -Fq 'Sign in with Google' "$DEX_STRINGS"
            grep -Fq 'Enhanced Player' "$DEX_STRINGS"
            grep -Fq 'Seek interval' "$DEX_STRINGS"
            grep -Fq 'Video actions' "$DEX_STRINGS"
            grep -Fq 'Audio only' "$DEX_STRINGS"
            grep -Fq 'Picture in Picture' "$DEX_STRINGS"
            grep -Fq 'Keep PiP' "$DEX_STRINGS"
            grep -Fq 'Retry sign-in' "$DEX_STRINGS"
            grep -Fq 'youtube.readonly' "$DEX_STRINGS"
            grep -Fq 'Signed in with Google' "$DEX_STRINGS"
            grep -Fq 'Google signed in' "$DEX_STRINGS"
            grep -Fq 'Google + YouTube connected' "$DEX_STRINGS"
            grep -Fq 'android.settings.ADD_ACCOUNT_SETTINGS' "$DEX_STRINGS"
            grep -Fq 'mytube_account_session_v2' "$DEX_STRINGS"
            rm -f "$DEX_STRINGS"
          done
          echo "Compiled APKs contain the v1.4.3 visible refinement surfaces."

      - name: Verify APK ABI coverage
        shell: bash
        run: |
          set -euo pipefail
          ARM64="$GITHUB_WORKSPACE/source/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk"
          UNIVERSAL="$GITHUB_WORKSPACE/source/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          test -s "$ARM64"
          test -s "$UNIVERSAL"

          echo "ARM64 native libraries:"
          unzip -l "$ARM64" | grep 'lib/.*\.so' | awk '{print $4}' | head -80
          echo "Universal native libraries:"
          unzip -l "$UNIVERSAL" | grep 'lib/.*\.so' | awk '{print $4}' | head -160

          unzip -l "$ARM64" | grep -q 'lib/arm64-v8a/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/arm64-v8a/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/armeabi-v7a/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/x86_64/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/x86/'

      - name: Report OAuth registration identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          KEYSTORE="$HOME/.android/debug.keystore"
          test -s "$KEYSTORE"
          SHA1="$MYTUBE_SIGNING_SHA1"
          test -n "$SHA1"
          {
            echo "MyTube Google / YouTube OAuth registration identity"
            echo "Application ID: com.aistudio.tubedeck.kxmvd"
            echo "Signing SHA-1: $SHA1"
            echo "Required scope: https://www.googleapis.com/auth/youtube.readonly"
            echo "Google Cloud requirement: register an Android OAuth client with this exact package + SHA-1 and enable YouTube Data API v3."
          } | tee "$GITHUB_WORKSPACE/dist/MyTube-v1.4.3-OAuth-Registration.txt"
          echo "### MyTube OAuth registration" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: `com.aistudio.tubedeck.kxmvd`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-1: `$SHA1`" >> "$GITHUB_STEP_SUMMARY"

      - name: Stage both APKs and complete source
        shell: bash
        run: |
          set -euo pipefail
          ARM64="$GITHUB_WORKSPACE/source/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk"
          UNIVERSAL="$GITHUB_WORKSPACE/source/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          mkdir -p "$GITHUB_WORKSPACE/dist"

          cp "$ARM64" "$GITHUB_WORKSPACE/dist/MyTube-v1.4.3-ARM64-Whisper-DownloadEngine-debug.apk"
          cp "$UNIVERSAL" "$GITHUB_WORKSPACE/dist/MyTube-v1.4.3-Universal-Older-Rooted-debug.apk"

          SOURCE_ZIP="$GITHUB_WORKSPACE/dist/MyTube-r6.5-LiveDub-v1.4.3-Complete-AndroidStudio-Source.zip"
          (
            cd "$GITHUB_WORKSPACE/source"
            zip -qr "$SOURCE_ZIP" . \
              -x '.gradle/*' \
              -x '*/build/*' \
              -x 'local.properties'
          )

          cd "$GITHUB_WORKSPACE"
          sha256sum dist/MyTube-v1.4.3-ARM64-Whisper-DownloadEngine-debug.apk > dist/MyTube-v1.4.3-ARM64-Whisper-DownloadEngine-debug.apk.sha256
          sha256sum dist/MyTube-v1.4.3-Universal-Older-Rooted-debug.apk > dist/MyTube-v1.4.3-Universal-Older-Rooted-debug.apk.sha256
          sha256sum dist/MyTube-r6.5-LiveDub-v1.4.3-Complete-AndroidStudio-Source.zip > dist/MyTube-r6.5-LiveDub-v1.4.3-Complete-AndroidStudio-Source.zip.sha256
          test -s dist/MyTube-v1.4.3-OAuth-Registration.txt
          ls -lh dist/
          cat dist/*.sha256

      - name: Upload verified v1.4.3 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyTube-v1.4.3-verified-build
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publish v1.4.3 dual APK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if [ "${MYTUBE_SIGNING_PINNED:-false}" != "true" ]; then
            echo "::notice::Signing identity bootstrap complete; release publication is intentionally skipped until the reported SHA-1 is pinned in .github/mytube-signing-sha1.txt."
            exit 0
          fi
          TAG="v1.4.3-dual-arm64-universal-debug"
          NOTES="MyTube r6.5 LiveDub v1.4.3.

          v1.4.3 professional Back gesture behavior:
          - First Back from active native playback enters PiP.
          - A normal/slow Back while native PiP is active sends the MyTube task to the background and keeps PiP alive.
          - Slow additional Back navigation never tears down the PiP session.
          - Three rapid consecutive Back presses are a deliberate media gesture: pause the existing native PiP/ExoPlayer session without converting it to audio-only.
          - The rapid sequence is process-wide so the gesture survives the NativePlayerActivity -> MainActivity handoff.
          - The three-option Keep PiP / Audio-only / Close overlay remains available from the player/PiP Options action rather than being forced into ordinary Back navigation.

          v1.4.3 clean-install self-contained account baseline:
          - No authentication path reads credentials, client IDs or account profiles from older MyTube builds.
          - Removed legacy googleWebClientId setting, tubedeck_prefs recovery and google_account_session migration.
          - A clean install starts with Android's real Google account picker; if no account is available/selected, MyTube explicitly launches Android's Add Google account screen and retries the picker.
          - The account session uses a new mytube_account_session_v2 store created only by v1.4.3+.
          - Stored identity from the current installation is restored only after Google returns a live usable token; cached text alone never authenticates the UI.
          - Web and Exo modes continue to share the same single app-wide GoogleAccountSession.

          v1.4.3 session-ownership and universal account fix:
          - NativePlayerActivity is the sole owner of native PiP, the three-option chooser, Close, Audio-only and Keep PiP.
          - The chooser is rendered centered over the foreground video window; MainActivity only relays the second Back when native PiP is active.
          - A further Back while the chooser is visible closes playback instead of being ignored.
          - The third chooser action re-enters/retains PiP using the same ExoPlayer session.
          - Dismissing system PiP with its X is treated as a hard stop unless Audio-only was explicitly selected.
          - Native teardown also stops any background-audio service to prevent audio surviving a closed PiP.
          - One app-wide GoogleAccountSession is shared by Web and Exo modes.
          - Identity path is fresh-install safe: Credential Manager when a valid embedded Web client exists; otherwise Android's real Google-account chooser, with Settings.ACTION_ADD_ACCOUNT as the explicit no-account fallback.
          - YouTube authorization fallback chain: AuthorizationClient -> direct GoogleAuthUtil access token with recoverable Google consent intent.
          - Google identity and full YouTube authorization are reported separately; a selected/cached profile never masquerades as YouTube-connected.

          Root-cause navigation and Google sign-in fix:
          - First Back enters PiP without launching/reordering MainActivity from onPictureInPictureModeChanged.
          - MainActivity is revealed by Android naturally underneath the PiP activity, removing the minimize/maximize race.
          - Cached Google profiles are migration data only and never create an authenticated UI state.
          - Credential Manager remains preferred when a real Web client ID exists.
          - Without that client, MyTube uses Android's system Google-account chooser/Add Account flow rather than the deprecated GoogleSignInClient.
          - The Kotlin-compatible Google ID SDK 1.1.1 is retained; MyTube parses the signed ID token's standard sub/email claims directly to avoid deprecated/ambiguous identity fields.
          - YouTube Data API authorization is attempted only after a real Google identity is established.

          Fresh v1.4.3 baseline:
          - Rebased from the hardened v1.3.22 code with a clean version line and fresh release artifacts.
          - Google sign-in and SmartTube-parity Back/PiP navigation remain release-critical gates.
          - Same application ID and pinned signing identity are deliberately preserved for OAuth and update compatibility, but no prior app data is required.

          Adaptive playback / weak networks:
          - Auto quality now continuously re-evaluates sustainable bandwidth during playback.
          - Low buffer or active rebuffering triggers a fast quality downshift instead of waiting for a hard playback error.
          - Quality upgrades require repeated stable samples and a healthy forward buffer to prevent resolution ping-pong.
          - Startup/rebuffer thresholds are shortened while the forward buffer ceiling is increased to 90 seconds.
          - Manual quality selections remain fixed and are never overridden by the adaptive controller.
          - Companion Up Next / episode work remains deferred until after the first rendered frame.

          Release-critical hardening:
          - Google sign-in never becomes a dead-end after a previous configuration or API error; explicit user taps always retry a fresh authorization attempt.
          - OAuth failure UI now exposes exact package/signing registration diagnostics and a Retry sign-in action.
          - CI statically verifies the YouTube OAuth scope/account checks and the native PiP session bridge before tests.
          - CI also scans the compiled APKs for Google retry/auth and Keep PiP surfaces before publication.

          SmartTube-parity Back / PiP cycle:
          - Native ExoPlayer stays owned by NativePlayerActivity for foreground playback and system PiP.
          - MainActivity only relays Back to the active native session; it never draws the native chooser.
          - The native player expands itself and shows Keep PiP, Audio only, or Close directly over the video.
          - PiP remote actions target NativePlayerActivity itself and therefore operate on the existing ExoPlayer session.
          - Closing or switching to audio-only finishes only the player activity instead of removing the whole MyTube task.
          - System PiP X is a hard playback stop unless Audio-only was explicitly selected.

          Playback / PiP:
          - Active video playback keeps the screen awake in foreground and PiP.
          - PiP exit no longer relaunches an Activity while Android is restoring the existing one; the three-way chooser is deferred until normal onResume.
          - Close / Audio / PiP choices fade after about 4.5 seconds without selecting any action.
          - Extra Back callbacks never silently choose Close or Audio.
          - PiP retains direct Options, Audio and Close actions as a device-level fallback.
          - Foreground, PiP, audio-only and closed sessions remain explicitly separated.
          - Web versus Native playback continues through the centralized PlaybackHostRouter.

          UI cleanup:
          - Persistent guides, explanatory paragraphs and redundant narration are removed from Settings and player surfaces.
          - Theme cards, playback settings, Google status, request shield and download confirmations are compact and action-oriented.
          - Functional labels, concise status values and real error messages remain.
          - Ten built-in themes and temporary Theme Preview remain available; the removed theme sliders stay removed.

          Playback performance:
          - Auto-load Episodes and Auto-load Up Next remain independent and default OFF.
          - Enabled companion shelves still wait until after first frame.
          - Adaptive download admission remains automatic with no user-facing parallel-download limit.

          Visible refinement verification:
          - Signed-out users now see a labeled Sign in with Google control in the top bar and Settings.
          - Player quick actions are available from a visible overflow button as well as long-press.
          - Current chapter is surfaced next to the seek controls.
          - Settings exposes the Enhanced Player capabilities directly.
          - CI scans the compiled APK DEX payload and refuses publication if the required v1.4.3 feature surfaces are absent.

          SmartTube-style player refinements:
          - Real YouTube storyboard seek previews with chapter labels.
          - Chapter markers and SponsorBlock segment marks on the seek timeline.
          - Remembered speed and quality preferences across videos and restarts.
          - Configurable 5/10/15/30/60-second seek intervals.
          - Long-press video quick actions for PiP, audio-only, downloads and settings.
          - Double-tap/pinch seeking now respects the configured seek interval.
          - Return YouTube Dislike and DeArrow are intentionally not included.

          Google / YouTube authorization:
          - One GoogleAccountSession is shared by Web and Native/Exo playback modes.
          - No legacy MyTube profile/client data is read. Current-install cached identity is accepted only after a live Google token check succeeds.
          - Credential Manager is preferred when a valid Web client ID is available.
          - If Credential Manager fails or no Web client ID exists, MyTube opens Android's real Google-account chooser directly; if no usable account is returned, it opens the system Add Google account screen and retries.
          - After a real identity is selected, MyTube requests youtube.readonly using AuthorizationClient and falls back to direct GoogleAuthUtil token acquisition with Google's recoverable consent intent.
          - Full YouTube-connected state is published only after an access token succeeds against both channels?mine=true and subscriptions?mine=true.
          - Google Cloud Android OAuth registration may still be required by Google for full YouTube authorization; the APK reports its exact package and signing SHA-1 for diagnosis.
          - The release includes MyTube-v1.4.3-OAuth-Registration.txt with the exact built APK identity.

          Build gates:
          - ARM64 + Universal unit tests.
          - Android lint for both editions.
          - ARM64 + Universal APK assembly.
          - ABI verification.
          - OAuth signing identity verification before release publication."

          ASSETS=(
            dist/MyTube-v1.4.3-ARM64-Whisper-DownloadEngine-debug.apk
            dist/MyTube-v1.4.3-ARM64-Whisper-DownloadEngine-debug.apk.sha256
            dist/MyTube-v1.4.3-Universal-Older-Rooted-debug.apk
            dist/MyTube-v1.4.3-Universal-Older-Rooted-debug.apk.sha256
            dist/MyTube-r6.5-LiveDub-v1.4.3-Complete-AndroidStudio-Source.zip
            dist/MyTube-r6.5-LiveDub-v1.4.3-Complete-AndroidStudio-Source.zip.sha256
            dist/MyTube-v1.4.3-OAuth-Registration.txt
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "MyTube v1.4.3 ARM64 + Universal Debug" \
              --notes "$NOTES"
          fi
          gh release view "$TAG"
