name: Build MyTube Android APKs

on:
  push:
    branches: [ main ]
    paths:
      - 'source/**'
      - '.github/workflows/android-build.yml'
      - '.github/mytube-signing-sha1.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mytube-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
    timeout-minutes: 65

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify v1.4.0 dual-APK source
        shell: bash
        run: |
          set -euo pipefail
          test -f source/settings.gradle.kts
          grep -q 'versionName = "1.4.0"' source/app/build.gradle.kts
          grep -q 'create("arm64")' source/app/build.gradle.kts
          grep -q 'create("universal")' source/app/build.gradle.kts
          grep -q 'armeabi-v7a' source/app/build.gradle.kts
          grep -q 'nativeWhisperSupported' source/app/src/main/java/com/drivedeck/tubedeck/player/WhisperAudioAsr.kt
          echo "Building MyTube v1.4.0 ARM64 + Universal source tree."

      - name: Verify OAuth + navigation release-critical source
        shell: bash
        run: |
          set -euo pipefail
          AUTH=source/app/src/main/java/com/drivedeck/tubedeck/auth/GoogleAccountSession.kt
          MAIN=source/app/src/main/java/com/drivedeck/tubedeck/MainActivity.kt
          NATIVE=source/app/src/main/java/com/drivedeck/tubedeck/NativePlayerActivity.kt
          BRIDGE=source/app/src/main/java/com/drivedeck/tubedeck/player/NativePipSessionBridge.kt
          grep -Fq 'require(isIdentityConfigured())' "$AUTH"
          grep -Fq 'GetSignInWithGoogleOption.Builder(BuildConfig.GOOGLE_WEB_CLIENT_ID)' "$AUTH"
          grep -Fq 'https://www.googleapis.com/auth/youtube.readonly' "$AUTH"
          grep -Fq 'channels?part=snippet&mine=true' "$AUTH"
          grep -Fq 'subscriptions?part=id&mine=true' "$AUTH"
          grep -Fq 'NativePipSessionBridge' "$MAIN"
          grep -Fq 'NativePipSessionBridge' "$NATIVE"
          grep -Fq 'Keep PiP' "$MAIN"
          grep -Fq 'showParentBehindPip' "$NATIVE"
          grep -Fq 'Retry sign-in' source/app/src/main/java/com/drivedeck/tubedeck/ui/components/GoogleAccountUi.kt
          echo "Release-critical Google OAuth and Back/PiP source checks passed."

      - name: Verify Google sign-in configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_WEB_CLIENT_ID:-}" || { echo "::error::GOOGLE_WEB_CLIENT_ID is required for the v1.4.0 Google sign-in build."; exit 1; }
          case "$GOOGLE_WEB_CLIENT_ID" in
            *.apps.googleusercontent.com) echo "Google OAuth client ID configured." ;;
            *) echo "::error::GOOGLE_WEB_CLIENT_ID is malformed."; exit 1 ;;
          esac

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore stable debug signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mytube-debug-signing-v1

      # Signing identity pinned in .github/mytube-signing-sha1.txt
      - name: Ensure stable debug signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$HOME/.android/debug.keystore"
          EXPECTED_FILE="$GITHUB_WORKSPACE/.github/mytube-signing-sha1.txt"
          EXPECTED_SHA1="$(tr -d '\r\n ' < "$EXPECTED_FILE")"
          mkdir -p "$(dirname "$KEYSTORE")"

          if [ ! -s "$KEYSTORE" ]; then
            if [ "$EXPECTED_SHA1" != "UNSET" ] && [ -n "$EXPECTED_SHA1" ]; then
              echo "::error::Pinned MyTube signing key is missing. Refusing to rotate OAuth identity."
              echo "::error::Expected SHA-1: $EXPECTED_SHA1"
              exit 1
            fi
            echo "::notice::Generating the one-time MyTube debug signing identity."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=MyTube Debug,O=MyTube,C=PK"
          fi

          keytool -list -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android >/dev/null
          ACTUAL_SHA1="$(keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android | awk -F': ' '/SHA1:/{print $2; exit}')"
          test -n "$ACTUAL_SHA1"

          if [ "$EXPECTED_SHA1" != "UNSET" ] && [ -n "$EXPECTED_SHA1" ] && [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::MyTube signing SHA-1 mismatch. Refusing to publish a rotated OAuth identity."
            echo "::error::Expected: $EXPECTED_SHA1"
            echo "::error::Actual:   $ACTUAL_SHA1"
            exit 1
          fi

          if [ "$EXPECTED_SHA1" = "UNSET" ] || [ -z "$EXPECTED_SHA1" ]; then
            echo "MYTUBE_SIGNING_PINNED=false" >> "$GITHUB_ENV"
            echo "::notice::First signing identity SHA-1: $ACTUAL_SHA1"
          else
            echo "MYTUBE_SIGNING_PINNED=true" >> "$GITHUB_ENV"
          fi
          echo "MYTUBE_SIGNING_SHA1=$ACTUAL_SHA1" >> "$GITHUB_ENV"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Provision multilingual Whisper Tiny Q5_1 model
        shell: bash
        run: |
          set -euo pipefail
          MODEL="$GITHUB_WORKSPACE/source/app/src/main/assets/models/ggml-tiny-q5_1.bin"
          EXPECTED_SHA1=2827a03e495b1ed3048ef28a6a4620537db4ee51
          mkdir -p "$(dirname "$MODEL")"
          if [ ! -s "$MODEL" ]; then
            curl -fL --retry 3 --retry-delay 3 \
              https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin \
              -o "$MODEL"
          fi
          echo "$EXPECTED_SHA1  $MODEL" | sha1sum -c -
          ls -lh "$MODEL"

      - name: Run unit tests for both editions
        run: gradle -p source testArm64DebugUnitTest testUniversalDebugUnitTest --stacktrace

      - name: Run Android lint for both editions
        shell: bash
        run: |
          set +e
          gradle -p source lintArm64Debug lintUniversalDebug --continue --stacktrace
          STATUS=$?
          echo "===== FULL ANDROID LINT REPORTS ====="
          find source/app/build -type f -name 'lint-results-*.txt' -print -exec cat {} \; 2>/dev/null || true
          exit "$STATUS"

      - name: Build ARM64 and Universal debug APKs
        run: gradle -p source assembleArm64Debug assembleUniversalDebug --stacktrace

      - name: Verify visible refinements are inside compiled APKs
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="$GITHUB_WORKSPACE/source/app/build/outputs/apk"
          for APK in             "$APK_DIR/arm64/debug/app-arm64-debug.apk"             "$APK_DIR/universal/debug/app-universal-debug.apk"; do
            test -s "$APK"
            DEX_STRINGS="$(mktemp)"
            unzip -p "$APK" 'classes*.dex' | strings > "$DEX_STRINGS"
            grep -Fq 'Sign in with Google' "$DEX_STRINGS"
            grep -Fq 'Enhanced Player' "$DEX_STRINGS"
            grep -Fq 'Seek interval' "$DEX_STRINGS"
            grep -Fq 'Video actions' "$DEX_STRINGS"
            grep -Fq 'Audio only' "$DEX_STRINGS"
            grep -Fq 'Picture in Picture' "$DEX_STRINGS"
            grep -Fq 'Keep PiP' "$DEX_STRINGS"
            grep -Fq 'Retry sign-in' "$DEX_STRINGS"
            grep -Fq 'youtube.readonly' "$DEX_STRINGS"
            rm -f "$DEX_STRINGS"
          done
          echo "Compiled APKs contain the v1.4.0 visible refinement surfaces."

      - name: Verify APK ABI coverage
        shell: bash
        run: |
          set -euo pipefail
          ARM64="$GITHUB_WORKSPACE/source/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk"
          UNIVERSAL="$GITHUB_WORKSPACE/source/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          test -s "$ARM64"
          test -s "$UNIVERSAL"

          echo "ARM64 native libraries:"
          unzip -l "$ARM64" | grep 'lib/.*\.so' | awk '{print $4}' | head -80
          echo "Universal native libraries:"
          unzip -l "$UNIVERSAL" | grep 'lib/.*\.so' | awk '{print $4}' | head -160

          unzip -l "$ARM64" | grep -q 'lib/arm64-v8a/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/arm64-v8a/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/armeabi-v7a/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/x86_64/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/x86/'

      - name: Report OAuth registration identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          KEYSTORE="$HOME/.android/debug.keystore"
          test -s "$KEYSTORE"
          SHA1="$MYTUBE_SIGNING_SHA1"
          test -n "$SHA1"
          {
            echo "MyTube Google / YouTube OAuth registration identity"
            echo "Application ID: com.aistudio.tubedeck.kxmvd"
            echo "Signing SHA-1: $SHA1"
            echo "Required scope: https://www.googleapis.com/auth/youtube.readonly"
            echo "Google Cloud requirement: register an Android OAuth client with this exact package + SHA-1 and enable YouTube Data API v3."
          } | tee "$GITHUB_WORKSPACE/dist/MyTube-v1.4.0-OAuth-Registration.txt"
          echo "### MyTube OAuth registration" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: `com.aistudio.tubedeck.kxmvd`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-1: `$SHA1`" >> "$GITHUB_STEP_SUMMARY"

      - name: Stage both APKs and complete source
        shell: bash
        run: |
          set -euo pipefail
          ARM64="$GITHUB_WORKSPACE/source/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk"
          UNIVERSAL="$GITHUB_WORKSPACE/source/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          mkdir -p "$GITHUB_WORKSPACE/dist"

          cp "$ARM64" "$GITHUB_WORKSPACE/dist/MyTube-v1.4.0-ARM64-Whisper-DownloadEngine-debug.apk"
          cp "$UNIVERSAL" "$GITHUB_WORKSPACE/dist/MyTube-v1.4.0-Universal-Older-Rooted-debug.apk"

          SOURCE_ZIP="$GITHUB_WORKSPACE/dist/MyTube-r6.5-LiveDub-v1.4.0-Complete-AndroidStudio-Source.zip"
          (
            cd "$GITHUB_WORKSPACE/source"
            zip -qr "$SOURCE_ZIP" . \
              -x '.gradle/*' \
              -x '*/build/*' \
              -x 'local.properties'
          )

          cd "$GITHUB_WORKSPACE"
          sha256sum dist/MyTube-v1.4.0-ARM64-Whisper-DownloadEngine-debug.apk > dist/MyTube-v1.4.0-ARM64-Whisper-DownloadEngine-debug.apk.sha256
          sha256sum dist/MyTube-v1.4.0-Universal-Older-Rooted-debug.apk > dist/MyTube-v1.4.0-Universal-Older-Rooted-debug.apk.sha256
          sha256sum dist/MyTube-r6.5-LiveDub-v1.4.0-Complete-AndroidStudio-Source.zip > dist/MyTube-r6.5-LiveDub-v1.4.0-Complete-AndroidStudio-Source.zip.sha256
          test -s dist/MyTube-v1.4.0-OAuth-Registration.txt
          ls -lh dist/
          cat dist/*.sha256

      - name: Upload verified v1.4.0 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyTube-v1.4.0-verified-build
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publish v1.4.0 dual APK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if [ "${MYTUBE_SIGNING_PINNED:-false}" != "true" ]; then
            echo "::notice::Signing identity bootstrap complete; release publication is intentionally skipped until the reported SHA-1 is pinned in .github/mytube-signing-sha1.txt."
            exit 0
          fi
          TAG="v1.4.0-dual-arm64-universal-debug"
          NOTES="MyTube r6.5 LiveDub v1.4.0.

          Fresh v1.4.0 baseline:
          - Rebased from the hardened v1.3.22 code with a clean version line and fresh release artifacts.
          - Google sign-in and SmartTube-parity Back/PiP navigation remain release-critical gates.
          - Same application ID and pinned signing identity are deliberately preserved for OAuth and update compatibility.

          Adaptive playback / weak networks:
          - Auto quality now continuously re-evaluates sustainable bandwidth during playback.
          - Low buffer or active rebuffering triggers a fast quality downshift instead of waiting for a hard playback error.
          - Quality upgrades require repeated stable samples and a healthy forward buffer to prevent resolution ping-pong.
          - Startup/rebuffer thresholds are shortened while the forward buffer ceiling is increased to 90 seconds.
          - Manual quality selections remain fixed and are never overridden by the adaptive controller.
          - Companion Up Next / episode work remains deferred until after the first rendered frame.

          Release-critical hardening:
          - Google sign-in never becomes a dead-end after a previous configuration or API error; explicit user taps always retry a fresh authorization attempt.
          - OAuth failure UI now exposes exact package/signing registration diagnostics and a Retry sign-in action.
          - CI statically verifies the YouTube OAuth scope/account checks and the native PiP session bridge before tests.
          - CI also scans the compiled APKs for Google retry/auth and Keep PiP surfaces before publication.

          SmartTube-parity Back / PiP cycle:
          - Native ExoPlayer stays owned by NativePlayerActivity while system PiP is active.
          - MainActivity is restored underneath PiP and owns the next Back press.
          - The second Back consistently offers Keep PiP, Audio only, or Close without recreating ExoPlayer.
          - PiP remote actions target the parent UI and command the existing native session through an in-process bridge.
          - Closing or switching to audio-only finishes only the player activity instead of removing the whole MyTube task.
          - Tapping the PiP window to expand resumes the same player without automatically forcing the exit chooser.

          Playback / PiP:
          - Active video playback keeps the screen awake in foreground and PiP.
          - PiP exit no longer relaunches an Activity while Android is restoring the existing one; the three-way chooser is deferred until normal onResume.
          - Close / Audio / PiP choices fade after about 4.5 seconds without selecting any action.
          - Extra Back callbacks never silently choose Close or Audio.
          - PiP retains direct Options, Audio and Close actions as a device-level fallback.
          - Foreground, PiP, audio-only and closed sessions remain explicitly separated.
          - Web versus Native playback continues through the centralized PlaybackHostRouter.

          UI cleanup:
          - Persistent guides, explanatory paragraphs and redundant narration are removed from Settings and player surfaces.
          - Theme cards, playback settings, Google status, request shield and download confirmations are compact and action-oriented.
          - Functional labels, concise status values and real error messages remain.
          - Ten built-in themes and temporary Theme Preview remain available; the removed theme sliders stay removed.

          Playback performance:
          - Auto-load Episodes and Auto-load Up Next remain independent and default OFF.
          - Enabled companion shelves still wait until after first frame.
          - Adaptive download admission remains automatic with no user-facing parallel-download limit.

          Visible refinement verification:
          - Signed-out users now see a labeled Sign in with Google control in the top bar and Settings.
          - Player quick actions are available from a visible overflow button as well as long-press.
          - Current chapter is surfaced next to the seek controls.
          - Settings exposes the Enhanced Player capabilities directly.
          - CI scans the compiled APK DEX payload and refuses publication if the required v1.4.0 feature surfaces are absent.

          SmartTube-style player refinements:
          - Real YouTube storyboard seek previews with chapter labels.
          - Chapter markers and SponsorBlock segment marks on the seek timeline.
          - Remembered speed and quality preferences across videos and restarts.
          - Configurable 5/10/15/30/60-second seek intervals.
          - Long-press video quick actions for PiP, audio-only, downloads and settings.
          - Double-tap/pinch seeking now respects the configured seek interval.
          - Return YouTube Dislike and DeArrow are intentionally not included.

          Google / YouTube authorization:
          - Profile selection alone is never treated as a connected YouTube account.
          - When GOOGLE_WEB_CLIENT_ID is configured, Credential Manager supplies the selected Google identity before YouTube authorization.
          - Without that optional Web client ID, the app falls back to Android AuthorizationClient rather than blocking the APK build.
          - Authorization requests youtube.readonly and is tied to the selected account when identity is known.
          - Connected state is published only after an access token succeeds against both channels?mine=true and subscriptions?mine=true.
          - The Android OAuth client is still mandatory: Google Cloud must register applicationId com.aistudio.tubedeck.kxmvd with the pinned signing SHA-1 and enable YouTube Data API v3.
          - The release includes MyTube-v1.4.0-OAuth-Registration.txt with the exact built APK identity.

          Build gates:
          - ARM64 + Universal unit tests.
          - Android lint for both editions.
          - ARM64 + Universal APK assembly.
          - ABI verification.
          - OAuth signing identity verification before release publication."

          ASSETS=(
            dist/MyTube-v1.4.0-ARM64-Whisper-DownloadEngine-debug.apk
            dist/MyTube-v1.4.0-ARM64-Whisper-DownloadEngine-debug.apk.sha256
            dist/MyTube-v1.4.0-Universal-Older-Rooted-debug.apk
            dist/MyTube-v1.4.0-Universal-Older-Rooted-debug.apk.sha256
            dist/MyTube-r6.5-LiveDub-v1.4.0-Complete-AndroidStudio-Source.zip
            dist/MyTube-r6.5-LiveDub-v1.4.0-Complete-AndroidStudio-Source.zip.sha256
            dist/MyTube-v1.4.0-OAuth-Registration.txt
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "MyTube v1.4.0 ARM64 + Universal Debug" \
              --notes "$NOTES"
          fi
          gh release view "$TAG"
