name: Build MyTube Android APKs

on:
  push:
    branches: [ main ]
    paths:
      - 'source/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mytube-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
    timeout-minutes: 65

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify v1.3.12 dual-APK source
        shell: bash
        run: |
          set -euo pipefail
          test -f source/settings.gradle.kts
          grep -q 'versionName = "1.3.12"' source/app/build.gradle.kts
          grep -q 'create("arm64")' source/app/build.gradle.kts
          grep -q 'create("universal")' source/app/build.gradle.kts
          grep -q 'armeabi-v7a' source/app/build.gradle.kts
          grep -q 'nativeWhisperSupported' source/app/src/main/java/com/drivedeck/tubedeck/player/WhisperAudioAsr.kt
          echo "Building MyTube v1.3.12 ARM64 + Universal source tree."

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mytube-debug-signing-v1

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Provision multilingual Whisper Tiny Q5_1 model
        shell: bash
        run: |
          set -euo pipefail
          MODEL="$GITHUB_WORKSPACE/source/app/src/main/assets/models/ggml-tiny-q5_1.bin"
          EXPECTED_SHA1=2827a03e495b1ed3048ef28a6a4620537db4ee51
          mkdir -p "$(dirname "$MODEL")"
          if [ ! -s "$MODEL" ]; then
            curl -fL --retry 3 --retry-delay 3 \
              https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin \
              -o "$MODEL"
          fi
          echo "$EXPECTED_SHA1  $MODEL" | sha1sum -c -
          ls -lh "$MODEL"

      - name: Run unit tests for both editions
        run: gradle -p source testArm64DebugUnitTest testUniversalDebugUnitTest --stacktrace

      - name: Run Android lint for both editions
        shell: bash
        run: |
          set +e
          gradle -p source lintArm64Debug lintUniversalDebug --continue --stacktrace
          STATUS=$?
          echo "===== FULL ANDROID LINT REPORTS ====="
          find source/app/build -type f -name 'lint-results-*.txt' -print -exec cat {} \; 2>/dev/null || true
          exit "$STATUS"

      - name: Build ARM64 and Universal debug APKs
        run: gradle -p source assembleArm64Debug assembleUniversalDebug --stacktrace

      - name: Verify APK ABI coverage
        shell: bash
        run: |
          set -euo pipefail
          ARM64="$GITHUB_WORKSPACE/source/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk"
          UNIVERSAL="$GITHUB_WORKSPACE/source/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          test -s "$ARM64"
          test -s "$UNIVERSAL"

          echo "ARM64 native libraries:"
          unzip -l "$ARM64" | grep 'lib/.*\.so' | awk '{print $4}' | head -80
          echo "Universal native libraries:"
          unzip -l "$UNIVERSAL" | grep 'lib/.*\.so' | awk '{print $4}' | head -160

          unzip -l "$ARM64" | grep -q 'lib/arm64-v8a/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/arm64-v8a/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/armeabi-v7a/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/x86_64/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/x86/'

      - name: Stage both APKs and complete source
        shell: bash
        run: |
          set -euo pipefail
          ARM64="$GITHUB_WORKSPACE/source/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk"
          UNIVERSAL="$GITHUB_WORKSPACE/source/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          mkdir -p "$GITHUB_WORKSPACE/dist"

          cp "$ARM64" "$GITHUB_WORKSPACE/dist/MyTube-v1.3.12-ARM64-Whisper-DownloadEngine-debug.apk"
          cp "$UNIVERSAL" "$GITHUB_WORKSPACE/dist/MyTube-v1.3.12-Universal-Older-Rooted-debug.apk"

          SOURCE_ZIP="$GITHUB_WORKSPACE/dist/MyTube-r6.5-LiveDub-v1.3.12-Complete-AndroidStudio-Source.zip"
          (
            cd "$GITHUB_WORKSPACE/source"
            zip -qr "$SOURCE_ZIP" . \
              -x '.gradle/*' \
              -x '*/build/*' \
              -x 'local.properties'
          )

          cd "$GITHUB_WORKSPACE"
          sha256sum dist/MyTube-v1.3.12-ARM64-Whisper-DownloadEngine-debug.apk > dist/MyTube-v1.3.12-ARM64-Whisper-DownloadEngine-debug.apk.sha256
          sha256sum dist/MyTube-v1.3.12-Universal-Older-Rooted-debug.apk > dist/MyTube-v1.3.12-Universal-Older-Rooted-debug.apk.sha256
          sha256sum dist/MyTube-r6.5-LiveDub-v1.3.12-Complete-AndroidStudio-Source.zip > dist/MyTube-r6.5-LiveDub-v1.3.12-Complete-AndroidStudio-Source.zip.sha256
          ls -lh dist/
          cat dist/*.sha256

      - name: Publish v1.3.12 dual APK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          TAG="v1.3.12-dual-arm64-universal-debug"
          NOTES="MyTube r6.5 LiveDub v1.3.12.

          Lifecycle / navigation corrections:
          - Playback Back is deterministic and never silently decides the final playback mode.
          - First Back enters PiP; returning from PiP arms the explicit Close / Audio / PiP chooser.
          - The chooser does not auto-dismiss, and later Back callbacks cannot silently close the app or switch to audio-only.
          - PiP now exposes an Options action that returns to the existing player instead of invoking Close/Audio directly.
          - Leaving the in-app Player route is a hard ExoPlayer boundary: the player state is cleared instead of remaining attached behind the previous page.
          - Explicit Close stops the foreground player plus any prior background-audio MediaSession before removing the task.
          - Audio-only is the only action allowed to intentionally keep playback alive after the UI task closes.
          - Native playback sessions carry a process-lifetime ownership ID so Android task/history restoration cannot resurrect an old recent-video Intent after a real close.
          - Manual onUserLeaveHint auto-PiP has been removed so task dismissal cannot be mistaken for an intentional PiP transition.

          Performance controls:
          - Main Settings adds Auto-load Episodes and Auto-load Up Next.
          - Both switches default OFF for faster startup and lower extractor/network/CPU contention.
          - With Auto-load Episodes off, episode/playlist discovery is not started.
          - With Auto-load Up Next off, related-video presentation and post-first-frame related prefetch are suppressed.
          - Existing playback resolver prewarm, in-flight sharing, short-lived cache and fast progressive startup remain enabled.
          - Download queue remains unrestricted while adaptive resource admission protects RAM/CPU/thermal/network resources.

          YouTube account authorization:
          - Removed the old profile-only Google fallback that could look signed in without YouTube authorization.
          - Account state is now set only after Google AuthorizationClient grants youtube.readonly and an authenticated YouTube Data API request succeeds.
          - Prior authorization is restored silently when Google can do so without user interaction.
          - If OAuth/YouTube API configuration is missing, MyTube reports the real configuration error instead of showing a dummy signed-in state.
          - Google Cloud must contain an Android OAuth client matching this app package/signing SHA-1 and have YouTube Data API enabled.

          Build gates:
          - Unit tests for ARM64 and Universal editions.
          - Android lint for both editions.
          - ARM64 and Universal APK assembly.
          - ABI verification before release publication."

          ASSETS=(
            dist/MyTube-v1.3.12-ARM64-Whisper-DownloadEngine-debug.apk
            dist/MyTube-v1.3.12-ARM64-Whisper-DownloadEngine-debug.apk.sha256
            dist/MyTube-v1.3.12-Universal-Older-Rooted-debug.apk
            dist/MyTube-v1.3.12-Universal-Older-Rooted-debug.apk.sha256
            dist/MyTube-r6.5-LiveDub-v1.3.12-Complete-AndroidStudio-Source.zip
            dist/MyTube-r6.5-LiveDub-v1.3.12-Complete-AndroidStudio-Source.zip.sha256
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "MyTube v1.3.12 ARM64 + Universal Debug" \
              --notes "$NOTES"
          fi
          gh release view "$TAG"
