name: Build MyTube Android APKs

on:
  push:
    branches: [ main, stabilization-v1.7.0 ]
    paths:
      - 'source/**'
      - '.github/workflows/android-build.yml'
      - '.github/mytube-signing-sha1.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mytube-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify v1.7.0 dual-APK source
        shell: bash
        run: |
          set -euo pipefail
          test -f source/settings.gradle.kts
          grep -q 'versionName = "1.7.0"' source/app/build.gradle.kts
          grep -q 'versionCode = 72' source/app/build.gradle.kts
          grep -q 'create("arm64")' source/app/build.gradle.kts
          grep -q 'create("universal")' source/app/build.gradle.kts
          grep -q 'armeabi-v7a' source/app/build.gradle.kts
          grep -q 'nativeWhisperSupported' source/app/src/main/java/com/drivedeck/tubedeck/player/WhisperAudioAsr.kt
          echo "Building MyTube v1.7.0 ARM64 + Universal source tree."

      - name: Verify OAuth + navigation release-critical source
        shell: bash
        run: |
          set -euo pipefail
          AUTH=source/app/src/main/java/com/drivedeck/tubedeck/auth/GoogleAccountSession.kt
          MAIN=source/app/src/main/java/com/drivedeck/tubedeck/MainActivity.kt
          NATIVE=source/app/src/main/java/com/drivedeck/tubedeck/NativePlayerActivity.kt
          BRIDGE=source/app/src/main/java/com/drivedeck/tubedeck/player/NativePipSessionBridge.kt
          BACKSEQ=source/app/src/main/java/com/drivedeck/tubedeck/player/PlaybackBackSequenceTracker.kt
          grep -Fq 'signInGoogleIdentity(activity, clientId)' "$AUTH"
          ! grep -Fq 'googleWebClientId' "$AUTH"
          ! grep -Fq 'LEGACY_SETTINGS_PREFS' "$AUTH"
          ! grep -Fq 'LEGACY_IDENTITY_PREFS' "$AUTH"
          ! grep -Fq 'google_account_session' "$AUTH"
          ! grep -Fq 'tubedeck_prefs' "$AUTH"
          ! grep -Fq 'googleWebClientId' source/app/src/main/java/com/drivedeck/tubedeck/data/model/TubeDeckModels.kt
          ! grep -Fq 'googleWebClientId' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/TubeDeckRepository.kt
          ! grep -Fq 'Google OAuth client' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/SettingsScreen.kt
          grep -Fq 'AuthorizationRequest.Prompt.SELECT_ACCOUNT' "$AUTH"
          grep -Fq 'googleAccountChooserIntent' "$AUTH"
          grep -Fq 'AccountManager.newChooseAccountIntent' "$AUTH"
          grep -Fq 'googleAddAccountIntent' "$AUTH"
          grep -Fq 'Settings.ACTION_ADD_ACCOUNT' "$AUTH"
          grep -Fq 'mytube_account_session_v2' "$AUTH"
          test -f source/app/src/main/java/com/drivedeck/tubedeck/auth/GoogleDeviceCodeOAuth.kt
          grep -Fq 'https://oauth2.googleapis.com/device/code' source/app/src/main/java/com/drivedeck/tubedeck/auth/GoogleDeviceCodeOAuth.kt
          grep -Fq 'urn:ietf:params:oauth:grant-type:device_code' source/app/src/main/java/com/drivedeck/tubedeck/auth/GoogleDeviceCodeOAuth.kt
          grep -Fq 'mytube_google_device_refresh_v1' source/app/src/main/java/com/drivedeck/tubedeck/auth/GoogleDeviceCodeOAuth.kt
          grep -Fq 'AndroidKeyStore' source/app/src/main/java/com/drivedeck/tubedeck/auth/GoogleDeviceCodeOAuth.kt
          grep -Fq 'startDeviceCodeAuthorization' "$AUTH"
          grep -Fq 'completeDeviceTokenSet' "$AUTH"
          grep -Fq 'isDeviceCodeConfigured' "$AUTH"
          grep -Fq 'GoogleDeviceCodeDialog' "$MAIN"
          grep -Fq 'GoogleDeviceCodeDialog' "$NATIVE"
          ! grep -Fq 'authorizeWithGoogleAuthUtil' "$AUTH"
          ! grep -Fq 'GoogleAuthUtil.getToken' "$AUTH"
          ! grep -Fq 'UserRecoverableAuthException' "$AUTH"
          grep -Fq 'youtubeAuthorized: Boolean = false' "$AUTH"
          ! grep -Fq 'GoogleSignIn' "$AUTH"
          grep -Fq 'Fresh-install invariant' "$AUTH"
          grep -Fq 'googleAccountChooserIntent' "$MAIN"
          grep -Fq 'googleAccountChooserIntent' "$NATIVE"
          grep -Fq 'googleid:googleid:1.1.1' source/app/build.gradle.kts
          grep -Fq 'parseGoogleIdTokenClaims' "$AUTH"
          grep -Fq 'setAccount(Account(identity.email, "com.google"))' "$AUTH"
          grep -Fq 'https://www.googleapis.com/auth/youtube.readonly' "$AUTH"
          grep -Fq 'channels?part=snippet&mine=true' "$AUTH"
          grep -Fq 'subscriptions?part=id&mine=true' "$AUTH"
          grep -Fq 'NativePipSessionBridge' "$MAIN"
          grep -Fq 'NativePipSessionBridge' "$NATIVE"
          grep -Fq 'Keep PiP' "$NATIVE"
          grep -Fq 'PlaybackBackAction.CLOSE_PLAYBACK' "$MAIN"
          grep -Fq 'PlaybackBackAction.CLOSE_PLAYBACK' "$NATIVE"
          grep -Fq 'NativePipSessionBridge.Action.SHOW_CHOOSER' "$MAIN"
          grep -Fq 'NativePipSessionBridge.Action.SHOW_CHOOSER' "$NATIVE"
          grep -Fq 'NativePipSessionBridge.Action.PAUSE' "$NATIVE"
          grep -Fq 'NativePipSessionBridge.Action.PAUSE' "$MAIN"
          grep -Fq 'PlaybackBackSequenceTracker.record' "$MAIN"
          grep -Fq 'PlaybackBackSequenceTracker.record' "$NATIVE"
          grep -Fq 'RAPID_GAP_MS = 550L' "$BACKSEQ"
          grep -Fq 'moveTaskToBack(true)' "$MAIN"
          grep -Fq 'activityClass = NativePlayerActivity::class.java' "$NATIVE"
          grep -Fq 'pipExitPendingStop' "$NATIVE"
          grep -Fq 'BackgroundAudioController.stop(applicationContext)' "$NATIVE"
          grep -Fq 'setCloseAction(closeAction)' source/app/src/main/java/com/drivedeck/tubedeck/player/PlaybackPipActions.kt
          grep -Fq '.setActions(listOf(keepAction, audioAction))' source/app/src/main/java/com/drivedeck/tubedeck/player/PlaybackPipActions.kt
          ! grep -Fq '.setActions(listOf(keepAction, audioAction, closeAction))' source/app/src/main/java/com/drivedeck/tubedeck/player/PlaybackPipActions.kt
          grep -Fq 'pipExitResolutionJob' "$NATIVE"
          grep -Fq 'delay(850L)' "$NATIVE"
          grep -Fq 'foregroundPlaybackAllowed = false' "$NATIVE"
          grep -Fq 'pauseGeneration += 1' "$NATIVE"
          grep -Fq 'ACTION_KEEP_PIP' source/app/src/main/java/com/drivedeck/tubedeck/player/PlaybackPipActions.kt
          grep -Fq 'PlaybackPipActionReceiver' source/app/src/main/AndroidManifest.xml
          grep -Fq 'resolveForDownload' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/MediaDownloader.kt
          grep -Fq 'resolveWithDownloadEngine' source/app/src/main/java/com/drivedeck/tubedeck/player/YoutubeStreamResolver.kt
          grep -Fq 'youtubedl-android:ffmpeg:0.18.1' source/app/build.gradle.kts
          grep -Fq 'FFmpeg.init(app)' source/app/src/main/java/com/drivedeck/tubedeck/player/YtDlpUpdateManager.kt
          grep -Fq 'YoutubeDL.execute(' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/MediaDownloader.kt
          ! grep -Fq 'MediaExtractor' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/MediaDownloader.kt
          grep -Fq 'latestVersion' source/app/src/main/java/com/drivedeck/tubedeck/player/YtDlpUpdateManager.kt
          grep -Fq 'pipExitPendingStop' "$MAIN"
          grep -Fq 'PiP exit alone is not a request to show the 3-option chooser' "$MAIN"
          grep -Fq 'Cancel the close watchdog and clear the bridge only after expansion is confirmed' "$NATIVE"
          grep -Fq 'cancelPending' source/app/src/main/java/com/drivedeck/tubedeck/player/AudioHandoffStartup.kt
          grep -Fq 'centerControlDiameter = if (compactPortrait) 52.dp else 60.dp' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'ERROR_CODE_DECODER_INIT_FAILED' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq '!youtubeVideo || inPictureInPicture' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt || grep -Fq '!youtubeVideo || inPictureInPicture)' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'vaultListView' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/DownloadsScreen.kt
          grep -Fq 'GridView' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/DownloadsScreen.kt
          grep -Fq 'chooseFileDestination(request)' "$MAIN"
          grep -Fq 'append("Q").append(currentQueue)' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/DownloadQueueNotifier.kt
          grep -Fq 'append("  ✓").append(finished)' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/DownloadQueueNotifier.kt
          grep -Fq 'append("  F").append(failed)' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/DownloadQueueNotifier.kt
          grep -Fq 'append("  R").append(retriedTasks)' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/DownloadQueueNotifier.kt
          grep -Fq '!firstFrameRendered' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'onRenderedFirstFrame' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          ! grep -Fq 'listOf("All", "Music", "Gaming", "News", "Live", "Technology", "Sports", "Movies", "Learning")' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/DriveDeckScreen.kt
