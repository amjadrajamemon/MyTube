          grep -Fq 'Pending/Queue' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/DownloadsScreen.kt
          ! grep -Fq 'Copy files' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/DownloadsScreen.kt
          grep -Fq 'canonicalVideoUrl' source/app/src/main/java/com/drivedeck/tubedeck/player/YoutubeUrls.kt
          grep -Fq 'canonicalVideoUrl(url)' source/app/src/main/java/com/drivedeck/tubedeck/player/YoutubeStreamResolver.kt
          grep -Fq 'resolvePlaybackWithFallback' source/app/src/main/java/com/drivedeck/tubedeck/player/YoutubeStreamResolver.kt
          grep -Fq 'resolveWithDownloadEngine(context, canonicalUrl)' source/app/src/main/java/com/drivedeck/tubedeck/player/YoutubeStreamResolver.kt
          grep -Fq 'DownloadQueuePolicy.pendingTasks' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/DownloadsScreen.kt
          grep -Fq 'MAX_AUTO_RETRIES = 7' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/DownloadRetryPolicy.kt
          grep -Fq 'Activity/History' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/DownloadsScreen.kt
          grep -Fq 'recent_searches_json' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/TubeDeckRepository.kt
          grep -Fq 'subscriptionTitles' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/YoutubeHomeFeedClient.kt
          grep -Fq 'publicTrending(region)' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/TubeDeckRepository.kt
          grep -Fq 'autoUpgradeCount < 1' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'MYTUBE_RELEASE_STORE_FILE' source/app/build.gradle.kts
          grep -Fq 'ACTION_RETURN_TO_VIDEO' source/app/src/main/java/com/drivedeck/tubedeck/player/BackgroundAudioPlaybackService.kt
          grep -Fq 'setSessionActivity(returnToVideoPendingIntent())' source/app/src/main/java/com/drivedeck/tubedeck/player/BackgroundAudioPlaybackService.kt
          grep -Fq 'Return to video' source/app/src/main/java/com/drivedeck/tubedeck/player/BackgroundAudioPlaybackService.kt
          grep -Fq 'BackgroundAudioPlaybackService.ACTION_RETURN_TO_VIDEO' "$MAIN"
          grep -Fq 'Icons.Default.SkipPrevious' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'Icons.Default.SkipNext' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          ! grep -Fq 'HoldSeekButton(Icons.Default.FastRewind, "Reverse"' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          ! grep -Fq 'HoldSeekButton(Icons.Default.FastForward, "Fast forward"' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'if (firstFrameRendered) {' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'playbackBackStack' "$NATIVE"
          grep -Fq 'playbackForwardStack' "$NATIVE"
          if grep -Fq 'showParentBehindPip' "$NATIVE"; then
            echo "::error::NativePlayerActivity must not launch/reorder MainActivity for the native PiP chooser."
            exit 1
          fi
          grep -Fq 'Retry sign-in' source/app/src/main/java/com/drivedeck/tubedeck/ui/components/GoogleAccountUi.kt
          grep -Fq 'withGoogleAuthorizationTimeout' "$AUTH"
          grep -Fq 'cancelYoutubeAuthorization' "$MAIN"
          grep -Fq 'cancelYoutubeAuthorization' "$NATIVE"
          grep -Fq 'Cancel sign-in' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/SettingsScreen.kt
          grep -Fq 'searchLiveVideos' source/app/src/main/java/com/drivedeck/tubedeck/player/YoutubeStreamResolver.kt
          grep -Fq 'repository.searchLive(query, googleSession.currentYoutubeAccessToken())' "$MAIN"
          grep -Fq 'Live now' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/DriveDeckScreen.kt
          grep -Fq 'eventType=live' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/YoutubeHomeFeedClient.kt
          grep -Fq 'viewStateKey = currentScreen.name' "$MAIN"
          grep -Fq 'ContentViewModeBar' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/DriveDeckScreen.kt
          grep -Fq 'Text size ·' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/SettingsScreen.kt
          grep -Fq 'viewCount' source/app/src/main/java/com/drivedeck/tubedeck/data/model/TubeDeckModels.kt
          grep -Fq 'playlistVideoUrl' source/app/src/main/java/com/drivedeck/tubedeck/player/YoutubeUrls.kt
          grep -Fq 'activePlaylistItems' "$NATIVE"
          grep -Fq 'onPlaybackEnded' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'playlistEntriesWithDownloadEngine' source/app/src/main/java/com/drivedeck/tubedeck/player/YoutubeStreamResolver.kt
          grep -Fq 'PlaylistQueuePolicy.preferContextualWatchNext' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/TubeDeckRepository.kt
          test -f source/app/src/test/java/com/drivedeck/tubedeck/player/PlaylistQueuePolicyTest.kt
          grep -Fq 'rememberUpdatedState(onPlaybackEnded)' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'playlistItems = activePlaylistItems' "$NATIVE"
          grep -Fq 'AtomicJsonStore' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/TubeDeckRepository.kt
          grep -Fq 'MediaDownloader.cancel(it.id)' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/TubeDeckRepository.kt
          grep -Fq 'LanguageIdentification.getClient()' source/app/src/main/java/com/drivedeck/tubedeck/player/WhisperAudioAsr.kt
          grep -Fq 'clipChannel.send' source/app/src/main/java/com/drivedeck/tubedeck/player/WhisperAudioAsr.kt
          grep -Fq 'youtubeAccessTokenExpiresAt' "$AUTH"
          grep -Fq 'validateGoogleIdTokenClaims' "$AUTH"
          grep -Fq 'onRenderProcessGone' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/BrowserScreen.kt
          grep -Fq 'onNativePlaylist' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/BrowserScreen.kt
          grep -Fq 'No playable videos were found in this playlist or Mix.' source/app/src/main/java/com/drivedeck/tubedeck/ui/components/DownloadModal.kt
          grep -Fq 'repository.enqueuePlaylist(items, mode, quality)' "$MAIN"
          grep -Fq 'repository.enqueuePlaylist(items, mode, quality)' "$NATIVE"
          ! grep -Fq 'canonicalVideoUrl(media.mediaUri)' "$MAIN"
          grep -Fq 'YoutubeSearchPolicy.buildSearchUrl' "$MAIN"
          grep -Fq 'androidx-media3-exoplayer-hls' source/gradle/libs.versions.toml
          grep -Fq 'info.hlsUrl' source/app/src/main/java/com/drivedeck/tubedeck/player/YoutubeStreamResolver.kt
          grep -Fq 'MimeTypes.APPLICATION_M3U8' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'peekForHandoff' source/app/src/main/java/com/drivedeck/tubedeck/player/YoutubeStreamResolver.kt
          grep -Fq 'promoteForHandoffResume' source/app/src/main/java/com/drivedeck/tubedeck/player/YoutubeStreamResolver.kt
          grep -Fq '.setLoadControl(fastAudioLoadControl)' source/app/src/main/java/com/drivedeck/tubedeck/player/BackgroundAudioPlaybackService.kt
          grep -Fq 'player.setMediaItem(item, positionMs.coerceAtLeast(0L))' source/app/src/main/java/com/drivedeck/tubedeck/player/BackgroundAudioPlaybackService.kt
          grep -Fq 'YoutubeStreamResolver.prefetch(applicationContext, warmUrl)' "$MAIN"
          grep -Fq 'browserSessionCreated by rememberSaveable' "$MAIN"
          grep -Fq 'screenStateHolder.SaveableStateProvider(currentScreen.name)' "$MAIN"
          grep -Fq 'navigationGeneration = browserNavigationGeneration' "$MAIN"
          grep -Fq 'historyResetGeneration = browserHistoryResetGeneration' "$MAIN"
          ! grep -Fq 'webViewInstance?.loadUrl(destination)' "$MAIN"
          grep -Fq 'if (web?.canGoBack() == true)' "$MAIN"
          grep -Fq 'persistentWebView.onPause()' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/BrowserScreen.kt
          grep -Fq 'pendingHistoryReset' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/BrowserScreen.kt
          grep -Fq 'LaunchedEffect(navigationGeneration, persistentWebView)' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/BrowserScreen.kt
          grep -Fq 'persistentWebView.clearHistory()' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/BrowserScreen.kt
          ! grep -Fq 'YoutubeStreamResolver.invalidate(url)' "$NATIVE"
          ! grep -Fq 'YoutubeStreamResolver.invalidate(media.mediaUri)' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
