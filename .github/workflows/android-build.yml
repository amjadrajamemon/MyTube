name: Build MyTube Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.bootstrap/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name 'MyTube-*-AndroidStudio-Source.zip' -print -quit)"
          test -n "$ZIP"
          rm -rf "$GITHUB_WORKSPACE/.ci-src"
          mkdir -p "$GITHUB_WORKSPACE/.ci-src"
          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/.ci-src"
          SETTINGS="$(find "$GITHUB_WORKSPACE/.ci-src" -type f -name settings.gradle.kts -print -quit)"
          test -n "$SETTINGS"
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Detected project: $PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 2 -type f \( -name 'settings.gradle.kts' -o -name 'build.gradle.kts' -o -name 'gradle.properties' \) -print

      - name: Apply Media3 PCM tap compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt"
          s = p.read_text(encoding="utf-8")

          if "import androidx.media3.exoplayer.DefaultRenderersFactory" not in s:
              s = s.replace(
                  "import androidx.media3.exoplayer.ExoPlayer\n",
                  "import androidx.media3.exoplayer.ExoPlayer\nimport androidx.media3.exoplayer.DefaultRenderersFactory\n"
              )
          if "import androidx.media3.exoplayer.audio.AudioSink" not in s:
              s = s.replace(
                  "import androidx.media3.exoplayer.audio.DefaultAudioSink\n",
                  "import androidx.media3.exoplayer.audio.DefaultAudioSink\nimport androidx.media3.exoplayer.audio.AudioSink\n"
              )

          old = """    val exoPlayer = remember(media.id) {
                  val audioSink = DefaultAudioSink.Builder(context)
                      .setAudioProcessors(arrayOf(pcmTap))
                      .build()
                  ExoPlayer.Builder(context)
                      .setAudioSink(audioSink)
                      .setTrackSelector(trackSelector)
                      .setBandwidthMeter(bandwidthMeter)
                      .build()
              }"""
          new = """    val exoPlayer = remember(media.id) {
                  val renderersFactory = object : DefaultRenderersFactory(context) {
                      override fun buildAudioSink(
                          context: Context,
                          enableFloatOutput: Boolean,
                          enableAudioTrackPlaybackParams: Boolean
                      ): AudioSink {
                          return DefaultAudioSink.Builder(context)
                              .setEnableFloatOutput(enableFloatOutput)
                              .setEnableAudioTrackPlaybackParams(enableAudioTrackPlaybackParams)
                              .setAudioProcessors(arrayOf(pcmTap))
                              .build()
                      }
                  }
                  ExoPlayer.Builder(context, renderersFactory)
                      .setTrackSelector(trackSelector)
                      .setBandwidthMeter(bandwidthMeter)
                      .build()
              }"""
          if old not in s:
              raise SystemExit("Expected ExoPlayer audio-sink block not found")
          p.write_text(s.replace(old, new), encoding="utf-8")
          print("Patched", p)
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Provision multilingual Whisper Tiny model
        shell: bash
        run: |
          set -euo pipefail
          MODEL="$PROJECT_DIR/app/src/main/assets/models/ggml-tiny.bin"
          EXPECTED_SHA1=bd577a113a864445d4c299885e0cb97d4ba92b5f
          mkdir -p "$(dirname "$MODEL")"
          if [ ! -s "$MODEL" ]; then
            curl -fL --retry 3 --retry-delay 3 \
              https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin \
              -o "$MODEL"
          fi
          echo "$EXPECTED_SHA1  $MODEL" | sha1sum -c -
          ls -lh "$MODEL"

      - name: Run unit tests
        run: gradle -p "$PROJECT_DIR" testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/MyTube-v1.2.2-Whisper-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/dist/MyTube-v1.2.2-Whisper-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyTube-v1.2.2-Whisper-debug
          path: dist/MyTube-v1.2.2-Whisper-debug.apk
          if-no-files-found: error
          retention-days: 30
