name: Build MyTube Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'source/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify v1.2.4 source
        shell: bash
        run: |
          set -euo pipefail
          test -f source/settings.gradle.kts
          grep -q 'versionName = "1.2.4"' source/app/build.gradle.kts
          grep -q 'MODEL_NAME = "ggml-tiny-q5_1.bin"' source/app/src/main/java/com/drivedeck/tubedeck/player/WhisperAudioAsr.kt
          grep -q 'GoogleAccountSession' source/app/src/main/java/com/drivedeck/tubedeck/auth/GoogleAccountSession.kt
          echo "Building materialized MyTube v1.2.4 source tree."

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Provision multilingual Whisper Tiny Q5_1 model
        shell: bash
        run: |
          set -euo pipefail
          MODEL="$GITHUB_WORKSPACE/source/app/src/main/assets/models/ggml-tiny-q5_1.bin"
          EXPECTED_SHA1=2827a03e495b1ed3048ef28a6a4620537db4ee51
          mkdir -p "$(dirname "$MODEL")"
          if [ ! -s "$MODEL" ]; then
            curl -fL --retry 3 --retry-delay 3               https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin               -o "$MODEL"
          fi
          echo "$EXPECTED_SHA1  $MODEL" | sha1sum -c -
          ls -lh "$MODEL"

      - name: Run unit tests
        run: gradle -p source testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle -p source assembleDebug --stacktrace

      - name: Stage APK and complete source
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/source/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/MyTube-v1.2.4-UI-Google-Whisper-debug.apk"

          SOURCE_ZIP="$GITHUB_WORKSPACE/dist/MyTube-r6.5-LiveDub-v1.2.4-Complete-AndroidStudio-Source.zip"
          (
            cd "$GITHUB_WORKSPACE/source"
            zip -qr "$SOURCE_ZIP" .               -x '.gradle/*'               -x '*/build/*'               -x 'local.properties'
          )

          cd "$GITHUB_WORKSPACE"
          sha256sum dist/MyTube-v1.2.4-UI-Google-Whisper-debug.apk > dist/MyTube-v1.2.4-UI-Google-Whisper-debug.apk.sha256
          sha256sum dist/MyTube-r6.5-LiveDub-v1.2.4-Complete-AndroidStudio-Source.zip > dist/MyTube-r6.5-LiveDub-v1.2.4-Complete-AndroidStudio-Source.zip.sha256
          ls -lh dist/
          cat dist/*.sha256

      - name: Publish v1.2.4 APK and source as GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          TAG="v1.2.4-ui-google-whisper-debug"
          NOTES="MyTube r6.5 LiveDub v1.2.4.

          - Direct source-tree build; no transient CI patching.
          - Redmi/Android 15 Whisper hardening with Tiny Q5_1, single-flight inference, bounded PCM capture and capture pause during native inference.
          - Fresh YouTube stream re-resolution on retryable Media3 failures.
          - Taller portrait ExoPlayer viewport and reduced companion-panel share.
          - Smaller/lower transport controls and compact thin seek bar based on supplied marked screenshots.
          - Fullscreen moved from the top-right strip into the lower Zoom/aspect control group.
          - Caption language dropdown and dubbing method selector retained.
          - Left/right press-and-hold rewind/fast-forward retained.
          - YouTube-style Home recommendations, history and Up next retained.
          - Google Credential Manager account session shared by Home, Browser and ExoPlayer.
          - Google Web OAuth client ID can be entered in Settings or supplied as GOOGLE_WEB_CLIENT_ID GitHub secret.
          - Unit tests and assembleDebug must pass before release publication."

          ASSETS=(
            dist/MyTube-v1.2.4-UI-Google-Whisper-debug.apk
            dist/MyTube-v1.2.4-UI-Google-Whisper-debug.apk.sha256
            dist/MyTube-r6.5-LiveDub-v1.2.4-Complete-AndroidStudio-Source.zip
            dist/MyTube-r6.5-LiveDub-v1.2.4-Complete-AndroidStudio-Source.zip.sha256
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}"               --target "$GITHUB_SHA"               --title "MyTube v1.2.4 UI + Google + Whisper Debug"               --notes "$NOTES"
          fi
          gh release view "$TAG"
