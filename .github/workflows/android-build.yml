          done
          echo "Compiled APKs contain the v1.8.12 visible refinement surfaces."

      - name: Verify APK ABI coverage
        shell: bash
        run: |
          set -euo pipefail
          ARM64="$GITHUB_WORKSPACE/source/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk"
          UNIVERSAL="$GITHUB_WORKSPACE/source/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          test -s "$ARM64"
          test -s "$UNIVERSAL"

          echo "ARM64 native libraries:"
          unzip -l "$ARM64" | grep 'lib/.*\.so' | awk '{print $4}' | head -80
          echo "Universal native libraries:"
          unzip -l "$UNIVERSAL" | grep 'lib/.*\.so' | awk '{print $4}' | head -160

          unzip -l "$ARM64" | grep -q 'lib/arm64-v8a/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/arm64-v8a/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/armeabi-v7a/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/x86_64/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/x86/'

      - name: Verify 16 KB ELF load alignment
        shell: bash
        run: |
          set -euo pipefail
          command -v readelf >/dev/null
          TMP="$(mktemp -d)"
          APK="source/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk"
          unzip -q "$APK" 'lib/arm64-v8a/*.so' -d "$TMP"
          COUNT=0
          while IFS= read -r -d '' SO; do
            COUNT=$((COUNT + 1))
            while read -r ALIGN; do
              [ -n "$ALIGN" ] || continue
              VALUE=$((ALIGN))
              if [ "$VALUE" -lt 16384 ]; then
                echo "::error::$SO has LOAD alignment $ALIGN; Android 16 KB devices require >= 0x4000."
                readelf -lW "$SO"
                exit 1
              fi
            done < <(readelf -lW "$SO" | awk '$1 == "LOAD" { print $NF }')
          done < <(find "$TMP/lib/arm64-v8a" -type f -name '*.so' -print0)
          test "$COUNT" -gt 0
          echo "Verified $COUNT ARM64 native libraries with >=16 KB ELF LOAD alignment."

      - name: Verify installable APK container metadata
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          for EDITION in arm64 universal; do
            APK="source/app/build/outputs/apk/$EDITION/debug/app-$EDITION-debug.apk"
            test -s "$APK"
            unzip -t "$APK" >/dev/null
            "$APKSIGNER" verify --verbose --print-certs "$APK" >/dev/null
            "$ZIPALIGN" -c -P 16 -v 4 "$APK" >/dev/null
            BADGING="$("$AAPT2" dump badging "$APK")"
            printf '%s\n' "$BADGING" | grep -Fq "package: name='com.aistudio.tubedeck.kxmvd'"
            printf '%s\n' "$BADGING" | grep -Fq "versionCode='94'"
            printf '%s\n' "$BADGING" | grep -Fq "versionName='1.8.12'"
            if printf '%s\n' "$BADGING" | grep -Fq 'application-debuggable'; then
              echo "::error::$EDITION APK is unexpectedly debuggable."
              exit 1
            fi
          done
          unzip -l source/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk | grep -q 'lib/arm64-v8a/'
          ! unzip -l source/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk | grep -q 'lib/armeabi-v7a/'
          echo "APK ZIP, signature, alignment, package metadata and ARM64 ABI checks passed."

      - name: Verify actual APK signing and report install compatibility
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          PREVIOUS_DIR="$(mktemp -d)"
          gh release download v1.6.7-dual-arm64-universal-debug --repo "$GITHUB_REPOSITORY" --pattern 'MyTube-v1.6.7-ARM64-Whisper-DownloadEngine-debug.apk' --dir "$PREVIOUS_DIR"
          PREVIOUS_APK="$PREVIOUS_DIR/MyTube-v1.6.7-ARM64-Whisper-DownloadEngine-debug.apk"
          PREVIOUS_SHA1="$("$APKSIGNER" verify --print-certs "$PREVIOUS_APK" | sed -n 's/.*certificate SHA-1 digest: //p' | head -n 1)"
          test -n "$PREVIOUS_SHA1"
          PINNED_SHA1="$(printf '%s' "$MYTUBE_SIGNING_SHA1" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          for EDITION in arm64 universal; do
            APK="source/app/build/outputs/apk/$EDITION/debug/app-$EDITION-debug.apk"
            ACTUAL_SHA1="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-1 digest: //p' | head -n 1)"
            if [ "$ACTUAL_SHA1" != "$PINNED_SHA1" ]; then
              echo "::error::Actual APK signing certificate differs from the saved, pinned key."
              exit 1
            fi
          done
          echo "MYTUBE_SIGNING_SHA1=$ACTUAL_SHA1" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          {
            echo "Previous v1.6.7 signing certificate: $PREVIOUS_SHA1"
            echo "Saved stable signing certificate used by v1.8.12: $ACTUAL_SHA1"
            test "$ACTUAL_SHA1" = "$PREVIOUS_SHA1"
            echo "The APK is compatible with an update over v1.6.7."
          } | tee "$GITHUB_WORKSPACE/dist/MyTube-v1.8.12-Install-Compatibility.txt"

      - name: Preserve verified APK compilation
        if: steps.apk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.apk-cache.outputs.cache-primary-key }}
          path: |
            source/app/build/outputs/apk/arm64/debug/
            source/app/build/outputs/apk/universal/debug/

      - name: Report OAuth registration identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          KEYSTORE="$HOME/.android/debug.keystore"
          test -s "$KEYSTORE"
          SHA1="$MYTUBE_SIGNING_SHA1"
          test -n "$SHA1"
          {
            echo "MyTube Google / YouTube OAuth registration identity"
            echo "Application ID: com.aistudio.tubedeck.kxmvd"
            echo "Signing SHA-1: $SHA1"
            echo "Required scope: https://www.googleapis.com/auth/youtube.readonly"
            echo "Google Cloud requirement: register an Android OAuth client with this exact package + SHA-1 and enable YouTube Data API v3."
          } | tee "$GITHUB_WORKSPACE/dist/MyTube-v1.8.12-OAuth-Registration.txt"
          echo "### MyTube OAuth registration" >> "$GITHUB_STEP_SUMMARY"
          echo '- Package: com.aistudio.tubedeck.kxmvd' >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-1: $SHA1" >> "$GITHUB_STEP_SUMMARY"

      - name: Stage both APKs and complete source
        shell: bash
        run: |
          set -euo pipefail
          ARM64="$GITHUB_WORKSPACE/source/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk"
          UNIVERSAL="$GITHUB_WORKSPACE/source/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          mkdir -p "$GITHUB_WORKSPACE/dist"

          cp "$ARM64" "$GITHUB_WORKSPACE/dist/MyTube-v1.8.12-XYAUTO-ARM64.apk"
          cp "$UNIVERSAL" "$GITHUB_WORKSPACE/dist/MyTube-v1.8.12-XYAUTO-UNIVERSAL.apk"

          if [ -s "$GITHUB_WORKSPACE/source/app/build/outputs/apk/arm64/release/app-arm64-release.apk" ]; then
            cp "$GITHUB_WORKSPACE/source/app/build/outputs/apk/arm64/release/app-arm64-release.apk"               "$GITHUB_WORKSPACE/dist/MyTube-v1.8.12-ARM64-production.apk"
            cp "$GITHUB_WORKSPACE/source/app/build/outputs/apk/universal/release/app-universal-release.apk"               "$GITHUB_WORKSPACE/dist/MyTube-v1.8.12-Universal-production.apk"
          fi

          SOURCE_ZIP="$GITHUB_WORKSPACE/dist/MyTube-v1.8.12-XYAUTO-Source.zip"
          EXPORT_DIR="$RUNNER_TEMP/mytube-source-export"
          mkdir -p "$EXPORT_DIR/source/app/src/main/assets/models"
          git archive HEAD source .github ci README.md | tar -x -C "$EXPORT_DIR"
          cp source/app/src/main/assets/models/ggml-tiny-q5_1.bin "$EXPORT_DIR/source/app/src/main/assets/models/"
          printf 'Repository: %s\nCommit: %s\nOpen source/ in Android Studio. Private signing keys are not included.\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" > "$EXPORT_DIR/BUNDLE-INFO.txt"
          (cd "$EXPORT_DIR" && find . -type f ! -name SOURCE-SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SOURCE-SHA256SUMS.txt)
          (cd "$EXPORT_DIR" && zip -qr "$SOURCE_ZIP" .)
          unzip -t "$SOURCE_ZIP" >/dev/null

          cd "$GITHUB_WORKSPACE"
          sha256sum dist/MyTube-v1.8.12-XYAUTO-ARM64.apk > dist/MyTube-v1.8.12-XYAUTO-ARM64.apk.sha256
          sha256sum dist/MyTube-v1.8.12-XYAUTO-UNIVERSAL.apk > dist/MyTube-v1.8.12-XYAUTO-UNIVERSAL.apk.sha256
          sha256sum dist/MyTube-v1.8.12-XYAUTO-Source.zip > dist/MyTube-v1.8.12-XYAUTO-Source.zip.sha256
          if [ -s dist/MyTube-v1.8.12-ARM64-production.apk ]; then
            sha256sum dist/MyTube-v1.8.12-ARM64-production.apk > dist/MyTube-v1.8.12-ARM64-production.apk.sha256
            sha256sum dist/MyTube-v1.8.12-Universal-production.apk > dist/MyTube-v1.8.12-Universal-production.apk.sha256
          fi
          test -s dist/MyTube-v1.8.12-OAuth-Registration.txt
          ls -lh dist/
          cat dist/*.sha256

      - name: Free temporary build space before emulator
        run: |
          gradle --stop
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk
          df -h .

      - name: Prepare Android emulator
        timeout-minutes: 8
        run: |
          set -euo pipefail
          trap 'tail -200 emulator.log 2>/dev/null || true' EXIT
          sudo chmod 666 /dev/kvm
          sdkmanager 'emulator' 'system-images;android-34;google_apis;x86_64'
          export ANDROID_AVD_HOME="$RUNNER_TEMP/integration-avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force -n integration --path "$ANDROID_AVD_HOME/integration.avd" -k 'system-images;android-34;google_apis;x86_64' -d pixel_2
          avdmanager list avd
          test -s "$ANDROID_AVD_HOME/integration.avd/config.ini"
          sed -i '/^disk.dataPartition.size=/d' "$ANDROID_AVD_HOME/integration.avd/config.ini"
          echo 'disk.dataPartition.size=2048M' >> "$ANDROID_AVD_HOME/integration.avd/config.ini"
          "$ANDROID_HOME/emulator/emulator" -avd integration -memory 4096 -cores 2 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > emulator.log 2>&1 &
          timeout 120 adb wait-for-device
          timeout 240 bash -c 'until adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" | grep -q 1; do sleep 3; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          # Android's OS-owned first-use immersive confirmation window sits ABOVE
          # app windows (including our opaque video-blackout overlay) and captures
          # taps. Treat the ephemeral CI emulator as an already-onboarded Android
          # device so the visual test measures the app instead of the OS tutorial.
          # This changes emulator settings only; no device permissions or app
          # settings are modified in production.
          adb shell settings put secure immersive_mode_confirmations confirmed
          test "$(adb shell settings get secure immersive_mode_confirmations | tr -d '\r')" = "confirmed"
          # Fail early if Android's OS tutorial still owns input focus.
          if adb shell dumpsys window windows | grep -F 'mCurrentFocus=' | grep -Fq 'ImmersiveModeConfirmation'; then
            echo "::error::The OS immersive tutorial is still intercepting the emulator display"
            exit 1
          fi
          sleep 25

      - name: Verify Home audio, search and XY AUTO playback
        timeout-minutes: 10
        run: bash ci/native-playback-smoke.sh

      - name: Verify persistent blackout across manual and automatic next video
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE=com.aistudio.tubedeck.kxmvd
          adb install -t --no-incremental "$RUNNER_TEMP/blackout-tests.apk"
          adb shell am instrument -w -e phase transitions "$PACKAGE.test/com.drivedeck.tubedeck.BlackoutInstrumentation" | tee dist/Blackout-transitions-test.txt
          grep -q 'BLACKOUT_TESTS_PASSED: transitions' dist/Blackout-transitions-test.txt
          adb shell am force-stop "$PACKAGE"
          adb shell am instrument -w -e phase restart "$PACKAGE.test/com.drivedeck.tubedeck.BlackoutInstrumentation" | tee dist/Blackout-restart-test.txt
          grep -q 'BLACKOUT_TESTS_PASSED: restart' dist/Blackout-restart-test.txt

      # Large APKs are published directly as Release assets below. Uploading
      # them to Actions artifact storage is redundant and can exceed the
      # repository's Actions storage quota.

      - name: Publish v1.8.12 dual APK release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if [ "${MYTUBE_SIGNING_PINNED:-false}" != "true" ]; then
            echo "::notice::Signing identity bootstrap complete; release publication is intentionally skipped until the reported SHA-1 is pinned in .github/mytube-signing-sha1.txt."
            exit 0
          fi
          TAG="v1.8.12-tv-airmouse-keyboard"
          NOTES="$(cat <<'NOTES'
          MyTube v1.8.12 adds Android TV launcher visibility and pointer-remote support, keyboard/D-pad focus and hover indication on navigation, search suggestions, media cards, settings and downloads, and hardware remote controls in native playback. The original phone, car-unit, Home/PiP, blackout, audio and existing video features remain in place.

          MyTube v1.8.12 keeps the display blank across automatic next-video playback, manual video selection, player replacement, and Web/native changes. Only a deliberate double-tap on the blank screen restores the picture; single taps and long presses are consumed. Blackout is stored independently of any video ID and survives process recreation. Audio playback is retained.

          MyTube v1.8.12 continues playing in background audio when Home is pressed during active playback. A foreground MediaSession service starts during the user-visible transition, before any slow stream resolution. Paused videos stay paused; PiP, explicit Close and replacement playback retain their existing actions. Native video resumes from the service position when MyTube is reopened.

          Recent searches are visible on Home and in the browser search field, persist across app restarts, and support removing individual terms or clearing the list. Search assistance combines matching history with debounced YouTube suggestions while typing, retains history when offline, and does not open the keyboard on launch.

          Existing XY AUTO compatibility, blackout, sign-in, captions, downloads, themes and low-resource settings are retained. Both ABI editions undergo unit tests, Android lint, signature/package/alignment checks and Android emulator tests. The emulator checks actual Home-to-background audio progress and return to video in standard and XY AUTO profiles, and recent-search/suggestion UI behavior. Physical car firmware and live YouTube delivery require device testing.

          Application ID and the pinned signing certificate are preserved. Source ZIP includes the editable Android Studio project, verified Whisper model, workflows and regression tests; private signing keys are excluded.
          NOTES
          )"


          ASSETS=(
            dist/MyTube-v1.8.12-XYAUTO-ARM64.apk
            dist/MyTube-v1.8.12-XYAUTO-ARM64.apk.sha256
            dist/MyTube-v1.8.12-XYAUTO-UNIVERSAL.apk
            dist/MyTube-v1.8.12-XYAUTO-UNIVERSAL.apk.sha256
            dist/MyTube-v1.8.12-XYAUTO-Source.zip
            dist/MyTube-v1.8.12-XYAUTO-Source.zip.sha256
            dist/MyTube-v1.8.12-OAuth-Registration.txt
            dist/MyTube-v1.8.12-Install-Compatibility.txt
            dist/Emulator-smoke-test.txt
            dist/XY-AUTO-playback-report.txt
            dist/Background-audio-search-test.txt
            dist/Blackout-transitions-test.txt
            dist/Blackout-restart-test.txt
          )
          if [ -s dist/MyTube-v1.8.12-ARM64-production.apk ]; then
            ASSETS+=(
              dist/MyTube-v1.8.12-ARM64-production.apk
              dist/MyTube-v1.8.12-ARM64-production.apk.sha256
              dist/MyTube-v1.8.12-Universal-production.apk
              dist/MyTube-v1.8.12-Universal-production.apk.sha256
            )
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "MyTube v1.8.12 ARM64 + Universal" \
              --notes "$NOTES"
          fi
          gh release view "$TAG"




