name: Build MyTube Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'source/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write


jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify v1.2.5 source
        shell: bash
        run: |
          set -euo pipefail
          test -f source/settings.gradle.kts
          grep -q 'versionName = "1.2.5"' source/app/build.gradle.kts
          grep -q 'MODEL_NAME = "ggml-tiny-q5_1.bin"' source/app/src/main/java/com/drivedeck/tubedeck/player/WhisperAudioAsr.kt
          grep -q 'GoogleAccountSession' source/app/src/main/java/com/drivedeck/tubedeck/auth/GoogleAccountSession.kt
          echo "Building materialized MyTube v1.2.5 source tree."

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Provision multilingual Whisper Tiny Q5_1 model
        shell: bash
        run: |
          set -euo pipefail
          MODEL="$GITHUB_WORKSPACE/source/app/src/main/assets/models/ggml-tiny-q5_1.bin"
          EXPECTED_SHA1=2827a03e495b1ed3048ef28a6a4620537db4ee51
          mkdir -p "$(dirname "$MODEL")"
          if [ ! -s "$MODEL" ]; then
            curl -fL --retry 3 --retry-delay 3               https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin               -o "$MODEL"
          fi
          echo "$EXPECTED_SHA1  $MODEL" | sha1sum -c -
          ls -lh "$MODEL"

      - name: Run unit tests
        run: gradle -p source testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle -p source assembleDebug --stacktrace

      - name: Stage APK and complete source
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/source/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/MyTube-v1.2.5-Refined-Whisper-YtDlp-debug.apk"

          SOURCE_ZIP="$GITHUB_WORKSPACE/dist/MyTube-r6.5-LiveDub-v1.2.5-Complete-AndroidStudio-Source.zip"
          (
            cd "$GITHUB_WORKSPACE/source"
            zip -qr "$SOURCE_ZIP" .               -x '.gradle/*'               -x '*/build/*'               -x 'local.properties'
          )

          cd "$GITHUB_WORKSPACE"
          sha256sum dist/MyTube-v1.2.5-Refined-Whisper-YtDlp-debug.apk > dist/MyTube-v1.2.5-Refined-Whisper-YtDlp-debug.apk.sha256
          sha256sum dist/MyTube-r6.5-LiveDub-v1.2.5-Complete-AndroidStudio-Source.zip > dist/MyTube-r6.5-LiveDub-v1.2.5-Complete-AndroidStudio-Source.zip.sha256
          ls -lh dist/
          cat dist/*.sha256

      - name: Publish v1.2.5 APK and source as GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          TAG="v1.2.5-refined-whisper-ytdlp-debug"
          NOTES="MyTube r6.5 LiveDub v1.2.5.

          - Android Back now routes active video playback to Picture-in-Picture when PiP is enabled.
          - ExoPlayer quality control now opens a dedicated Auto/all-qualities chooser instead of full player settings.
          - Native comments now paginate NewPipe results and fall back to yt-dlp public comments when needed.
          - Google account selection uses the Android device Google-account chooser; no client-ID textbox is required.
          - yt-dlp Android runtime 0.18.1 is included for comments fallback and updater support.
          - Stable yt-dlp is scheduled for an automatic update every 7 days when connected.
          - Settings includes a manual Check/update yt-dlp now action with version/status/last-check display.
          - Redmi/Android 15 Whisper hardening, taller player, compact controls, caption language selector, dubbing mode selector and hold-seek gestures remain.
          - Unit tests and assembleDebug must pass before release publication."

          ASSETS=(
            dist/MyTube-v1.2.5-Refined-Whisper-YtDlp-debug.apk
            dist/MyTube-v1.2.5-Refined-Whisper-YtDlp-debug.apk.sha256
            dist/MyTube-r6.5-LiveDub-v1.2.5-Complete-AndroidStudio-Source.zip
            dist/MyTube-r6.5-LiveDub-v1.2.5-Complete-AndroidStudio-Source.zip.sha256
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}"               --target "$GITHUB_SHA"               --title "MyTube v1.2.5 Refined + Whisper + yt-dlp Debug"               --notes "$NOTES"
          fi
          gh release view "$TAG"
