          echo "Release-critical OAuth, Back/PiP, Live playback, fast handoff and retained-navigation source checks passed."

      - name: Verify MyTube Android OAuth configuration
        shell: bash
        run: |
          set -euo pipefail
          CLIENT_ID="$(sed -n 's/^GOOGLE_WEB_CLIENT_ID=//p' source/gradle.properties | tr -d '\r')"
          test "$CLIENT_ID" = "452637572013-j7n0rvi7bkgtei3c979tr004h4da31nh.apps.googleusercontent.com"
          echo "MYTUBE_WEB_CLIENT_ID=$CLIENT_ID" >> "$GITHUB_ENV"
          echo "MyTube Web client configured for Credential Manager."

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore stable debug signing key
        id: signing-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.android/debug.keystore
          key: mytube-debug-signing-v1

      # Signing identity pinned in .github/mytube-signing-sha1.txt
      - name: Ensure stable debug signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$HOME/.android/debug.keystore"
          EXPECTED_FILE="$GITHUB_WORKSPACE/.github/mytube-signing-sha1.txt"
          EXPECTED_SHA1="$(tr -d '\r\n ' < "$EXPECTED_FILE")"
          mkdir -p "$(dirname "$KEYSTORE")"

          if [ ! -s "$KEYSTORE" ]; then
            if [ "$EXPECTED_SHA1" != "UNSET" ] && [ -n "$EXPECTED_SHA1" ]; then
              echo "::error::Pinned MyTube signing key is missing. Refusing to rotate OAuth identity."
              echo "::error::Expected SHA-1: $EXPECTED_SHA1"
              exit 1
            fi
            echo "::notice::Generating the one-time MyTube debug signing identity."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=MyTube Debug,O=MyTube,C=PK"
          fi

          keytool -list -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android >/dev/null
          ACTUAL_SHA1="$(keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android | awk -F': ' '/SHA1:/{print $2; exit}')"
          test -n "$ACTUAL_SHA1"

          if [ "$EXPECTED_SHA1" != "UNSET" ] && [ -n "$EXPECTED_SHA1" ] && [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::MyTube signing SHA-1 mismatch. Refusing to publish a rotated OAuth identity."
            echo "::error::Expected: $EXPECTED_SHA1"
            echo "::error::Actual:   $ACTUAL_SHA1"
            exit 1
          fi

          if [ "$EXPECTED_SHA1" = "UNSET" ] || [ -z "$EXPECTED_SHA1" ]; then
            echo "MYTUBE_SIGNING_PINNED=false" >> "$GITHUB_ENV"
            echo "::notice::First signing identity SHA-1: $ACTUAL_SHA1"
          else
            echo "MYTUBE_SIGNING_PINNED=true" >> "$GITHUB_ENV"
          fi
          echo "MYTUBE_SIGNING_SHA1=$ACTUAL_SHA1" >> "$GITHUB_ENV"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.11.1'

      - name: Provision multilingual Whisper Tiny Q5_1 model
        shell: bash
        run: |
          set -euo pipefail
          MODEL="$GITHUB_WORKSPACE/source/app/src/main/assets/models/ggml-tiny-q5_1.bin"
          EXPECTED_SHA1=2827a03e495b1ed3048ef28a6a4620537db4ee51
          mkdir -p "$(dirname "$MODEL")"
          if [ ! -s "$MODEL" ]; then
            curl -fL --retry 3 --retry-delay 3 \
              https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin \
              -o "$MODEL"
          fi
          echo "$EXPECTED_SHA1  $MODEL" | sha1sum -c -
          ls -lh "$MODEL"

      - name: Run unit tests for both editions
        run: gradle -p source testArm64DebugUnitTest testUniversalDebugUnitTest --stacktrace

      - name: Run Android lint for both editions
        shell: bash
        run: |
          set +e
          gradle -p source lintArm64Debug lintUniversalDebug --continue --stacktrace
          STATUS=$?
          echo "===== FULL ANDROID LINT REPORTS ====="
          find source/app/build -type f -name 'lint-results-*.txt' -print -exec cat {} \; 2>/dev/null || true
          exit "$STATUS"

      - name: Build ARM64 and Universal debug APKs
        run: gradle -p source assembleArm64Debug assembleUniversalDebug --stacktrace

      - name: Build optional production-signed APKs
        shell: bash
        env:
          MYTUBE_RELEASE_KEYSTORE_B64: ${{ secrets.MYTUBE_RELEASE_KEYSTORE_B64 }}
          MYTUBE_RELEASE_STORE_PASSWORD: ${{ secrets.MYTUBE_RELEASE_STORE_PASSWORD }}
          MYTUBE_RELEASE_KEY_ALIAS: ${{ secrets.MYTUBE_RELEASE_KEY_ALIAS }}
          MYTUBE_RELEASE_KEY_PASSWORD: ${{ secrets.MYTUBE_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MYTUBE_RELEASE_KEYSTORE_B64:-}" ] ||              [ -z "${MYTUBE_RELEASE_STORE_PASSWORD:-}" ] ||              [ -z "${MYTUBE_RELEASE_KEY_ALIAS:-}" ] ||              [ -z "${MYTUBE_RELEASE_KEY_PASSWORD:-}" ]; then
            echo "::notice::Secure production signing secrets are not configured; keeping the update-compatible debug channel only."
            exit 0
          fi
          export MYTUBE_RELEASE_STORE_FILE="$RUNNER_TEMP/mytube-production.jks"
          printf '%s' "$MYTUBE_RELEASE_KEYSTORE_B64" | base64 -d > "$MYTUBE_RELEASE_STORE_FILE"
          test -s "$MYTUBE_RELEASE_STORE_FILE"
          gradle -p source assembleArm64Release assembleUniversalRelease --stacktrace
          test -s source/app/build/outputs/apk/arm64/release/app-arm64-release.apk
          test -s source/app/build/outputs/apk/universal/release/app-universal-release.apk
          echo "MYTUBE_PRODUCTION_SIGNED=true" >> "$GITHUB_ENV"

      - name: Verify compiled Android OAuth configuration
        shell: bash
        run: |
          set -euo pipefail
          for EDITION in arm64 universal; do
            CONFIG="source/app/build/generated/source/buildConfig/$EDITION/debug/com/drivedeck/tubedeck/BuildConfig.java"
            test -s "$CONFIG"
            grep -Fq "GOOGLE_WEB_CLIENT_ID = \"$MYTUBE_WEB_CLIENT_ID\"" "$CONFIG"
            grep -Fq 'GOOGLE_DEVICE_CLIENT_ID = ""' "$CONFIG"
            grep -Fq 'GOOGLE_DEVICE_CLIENT_SECRET = ""' "$CONFIG"
          done
          echo "Both APK variants embed the MyTube Web client; TV credentials are disabled."

      - name: Verify visible refinements are inside compiled APKs
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="$GITHUB_WORKSPACE/source/app/build/outputs/apk"
          for APK in             "$APK_DIR/arm64/debug/app-arm64-debug.apk"             "$APK_DIR/universal/debug/app-universal-debug.apk"; do
            test -s "$APK"
            DEX_STRINGS="$(mktemp)"
            unzip -p "$APK" 'classes*.dex' | strings > "$DEX_STRINGS"
            grep -Fq "$MYTUBE_WEB_CLIENT_ID" "$DEX_STRINGS"
            grep -Fq 'Cancel sign-in' "$DEX_STRINGS"
            grep -Fq 'Sign in with Google' "$DEX_STRINGS"
            grep -Fq 'Local trending' "$DEX_STRINGS"
            grep -Fq 'Seek interval' "$DEX_STRINGS"
            grep -Fq 'Video actions' "$DEX_STRINGS"
            grep -Fq 'Audio only' "$DEX_STRINGS"
            grep -Fq 'Picture in Picture' "$DEX_STRINGS"
            grep -Fq 'Keep PiP' "$DEX_STRINGS"
            grep -Fq 'Stop playback completely' "$DEX_STRINGS"
            grep -Fq 'Keep picture-in-picture playing' "$DEX_STRINGS"
            grep -Fq 'Retry sign-in' "$DEX_STRINGS"
            grep -Fq 'youtube.readonly' "$DEX_STRINGS"
            grep -Fq 'Signed in with Google' "$DEX_STRINGS"
            grep -Fq 'Google signed in' "$DEX_STRINGS"
            grep -Fq 'Google + YouTube connected' "$DEX_STRINGS"
            grep -Fq 'android.settings.ADD_ACCOUNT_SETTINGS' "$DEX_STRINGS"
            grep -Fq 'mytube_account_session_v2' "$DEX_STRINGS"
            grep -Fq 'Sign in with code' "$DEX_STRINGS"
            grep -Fq 'https://oauth2.googleapis.com/device/code' "$DEX_STRINGS"
            grep -Fq 'Waiting for Google approval' "$DEX_STRINGS"
            grep -Fq 'Finished/Completed' "$DEX_STRINGS"
            grep -Fq 'Pending/Queue' "$DEX_STRINGS"
            grep -Fq 'Manage' "$DEX_STRINGS"
            grep -Fq 'Activity/History' "$DEX_STRINGS"
            grep -Fq 'New download' "$DEX_STRINGS"
            grep -Fq 'Retry limit reached' "$DEX_STRINGS"
            grep -Fq 'Return to video' "$DEX_STRINGS"
            grep -Fq 'LIVE' "$DEX_STRINGS"
            grep -Fq 'Live now' "$DEX_STRINGS"
            grep -Fq 'No active live streams' "$DEX_STRINGS"
            grep -Fq 'eventType=live' "$DEX_STRINGS"
            grep -Fq 'Text size' "$DEX_STRINGS"
            grep -Fq 'List view' "$DEX_STRINGS"
            grep -Fq 'Card view' "$DEX_STRINGS"
            grep -Fq 'Select Tracks' "$DEX_STRINGS"
            grep -Fq 'No playable videos were found in this playlist or Mix.' "$DEX_STRINGS"
            grep -Fq 'Playlist or Mix could not be loaded' "$DEX_STRINGS"
            grep -Fq 'playlist items queued' "$DEX_STRINGS"
            grep -Fq 'Finished/Completed' "$DEX_STRINGS"
            grep -Fq 'Activity/History' "$DEX_STRINGS"
            rm -f "$DEX_STRINGS"
          done
          echo "Compiled APKs contain the v1.7.0 visible refinement surfaces."

      - name: Verify APK ABI coverage
        shell: bash
        run: |
          set -euo pipefail
          ARM64="$GITHUB_WORKSPACE/source/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk"
          UNIVERSAL="$GITHUB_WORKSPACE/source/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          test -s "$ARM64"
          test -s "$UNIVERSAL"

          echo "ARM64 native libraries:"
          unzip -l "$ARM64" | grep 'lib/.*\.so' | awk '{print $4}' | head -80
          echo "Universal native libraries:"
          unzip -l "$UNIVERSAL" | grep 'lib/.*\.so' | awk '{print $4}' | head -160

          unzip -l "$ARM64" | grep -q 'lib/arm64-v8a/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/arm64-v8a/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/armeabi-v7a/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/x86_64/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/x86/'

      - name: Verify 16 KB ELF load alignment
        shell: bash
        run: |
          set -euo pipefail
          command -v readelf >/dev/null
          TMP="$(mktemp -d)"
          APK="source/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk"
          unzip -q "$APK" 'lib/arm64-v8a/*.so' -d "$TMP"
          COUNT=0
          while IFS= read -r -d '' SO; do
            COUNT=$((COUNT + 1))
            while read -r ALIGN; do
              [ -n "$ALIGN" ] || continue
              VALUE=$((ALIGN))
              if [ "$VALUE" -lt 16384 ]; then
                echo "::error::$SO has LOAD alignment $ALIGN; Android 16 KB devices require >= 0x4000."
                readelf -lW "$SO"
                exit 1
              fi
            done < <(readelf -lW "$SO" | awk '$1 == "LOAD" { print $NF }')
          done < <(find "$TMP/lib/arm64-v8a" -type f -name '*.so' -print0)
          test "$COUNT" -gt 0
          echo "Verified $COUNT ARM64 native libraries with >=16 KB ELF LOAD alignment."

      - name: Verify installable APK container metadata
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          for EDITION in arm64 universal; do
            APK="source/app/build/outputs/apk/$EDITION/debug/app-$EDITION-debug.apk"
            test -s "$APK"
            unzip -t "$APK" >/dev/null
            "$APKSIGNER" verify --verbose --print-certs "$APK" >/dev/null
            "$ZIPALIGN" -c -P 16 -v 4 "$APK" >/dev/null
            BADGING="$("$AAPT2" dump badging "$APK")"
            printf '%s\n' "$BADGING" | grep -Fq "package: name='com.aistudio.tubedeck.kxmvd'"
            printf '%s\n' "$BADGING" | grep -Fq "versionCode='72'"
            printf '%s\n' "$BADGING" | grep -Fq "versionName='1.7.0'"
          done
          unzip -l source/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk | grep -q 'lib/arm64-v8a/'
          ! unzip -l source/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk | grep -q 'lib/armeabi-v7a/'
          echo "APK ZIP, signature, alignment, package metadata and ARM64 ABI checks passed."

      - name: Verify actual APK signing and report install compatibility
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          PREVIOUS_DIR="$(mktemp -d)"
          gh release download v1.6.7-dual-arm64-universal-debug --repo "$GITHUB_REPOSITORY" --pattern 'MyTube-v1.6.7-ARM64-Whisper-DownloadEngine-debug.apk' --dir "$PREVIOUS_DIR"
          PREVIOUS_APK="$PREVIOUS_DIR/MyTube-v1.6.7-ARM64-Whisper-DownloadEngine-debug.apk"
          PREVIOUS_SHA1="$("$APKSIGNER" verify --print-certs "$PREVIOUS_APK" | sed -n 's/.*certificate SHA-1 digest: //p' | head -n 1)"
          test -n "$PREVIOUS_SHA1"
          PINNED_SHA1="$(printf '%s' "$MYTUBE_SIGNING_SHA1" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          for EDITION in arm64 universal; do
            APK="source/app/build/outputs/apk/$EDITION/debug/app-$EDITION-debug.apk"
            ACTUAL_SHA1="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-1 digest: //p' | head -n 1)"
            if [ "$ACTUAL_SHA1" != "$PINNED_SHA1" ]; then
              echo "::error::Actual APK signing certificate differs from the saved, pinned key."
              exit 1
            fi
          done
          echo "MYTUBE_SIGNING_SHA1=$ACTUAL_SHA1" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          {
            echo "Previous v1.6.7 signing certificate: $PREVIOUS_SHA1"
            echo "Saved stable signing certificate used by v1.7.0: $ACTUAL_SHA1"
            test "$ACTUAL_SHA1" = "$PREVIOUS_SHA1"
            echo "The APK is compatible with an update over v1.6.7."
          } | tee "$GITHUB_WORKSPACE/dist/MyTube-v1.7.0-Install-Compatibility.txt"

      - name: Report OAuth registration identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          KEYSTORE="$HOME/.android/debug.keystore"
          test -s "$KEYSTORE"
          SHA1="$MYTUBE_SIGNING_SHA1"
          test -n "$SHA1"
          {
            echo "MyTube Google / YouTube OAuth registration identity"
            echo "Application ID: com.aistudio.tubedeck.kxmvd"
            echo "Signing SHA-1: $SHA1"
            echo "Required scope: https://www.googleapis.com/auth/youtube.readonly"
            echo "Google Cloud requirement: register an Android OAuth client with this exact package + SHA-1 and enable YouTube Data API v3."
          } | tee "$GITHUB_WORKSPACE/dist/MyTube-v1.7.0-OAuth-Registration.txt"
          echo "### MyTube OAuth registration" >> "$GITHUB_STEP_SUMMARY"
          echo '- Package: com.aistudio.tubedeck.kxmvd' >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-1: $SHA1" >> "$GITHUB_STEP_SUMMARY"

      - name: Stage both APKs and complete source
        shell: bash
        run: |
          set -euo pipefail
          ARM64="$GITHUB_WORKSPACE/source/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk"
          UNIVERSAL="$GITHUB_WORKSPACE/source/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          mkdir -p "$GITHUB_WORKSPACE/dist"

          cp "$ARM64" "$GITHUB_WORKSPACE/dist/MyTube-v1.7.0-ARM64-Whisper-DownloadEngine-debug.apk"
          cp "$UNIVERSAL" "$GITHUB_WORKSPACE/dist/MyTube-v1.7.0-Universal-Older-Rooted-debug.apk"

          if [ -s "$GITHUB_WORKSPACE/source/app/build/outputs/apk/arm64/release/app-arm64-release.apk" ]; then
            cp "$GITHUB_WORKSPACE/source/app/build/outputs/apk/arm64/release/app-arm64-release.apk"               "$GITHUB_WORKSPACE/dist/MyTube-v1.7.0-ARM64-production.apk"
            cp "$GITHUB_WORKSPACE/source/app/build/outputs/apk/universal/release/app-universal-release.apk"               "$GITHUB_WORKSPACE/dist/MyTube-v1.7.0-Universal-production.apk"
          fi

          SOURCE_ZIP="$GITHUB_WORKSPACE/dist/MyTube-r6.5-LiveDub-v1.7.0-Complete-AndroidStudio-Source.zip"
          (
            cd "$GITHUB_WORKSPACE/source"
            zip -qr "$SOURCE_ZIP" . \
              -x '.gradle/*' \
              -x '*/build/*' \
              -x 'local.properties'
          )

          cd "$GITHUB_WORKSPACE"
          sha256sum dist/MyTube-v1.7.0-ARM64-Whisper-DownloadEngine-debug.apk > dist/MyTube-v1.7.0-ARM64-Whisper-DownloadEngine-debug.apk.sha256
          sha256sum dist/MyTube-v1.7.0-Universal-Older-Rooted-debug.apk > dist/MyTube-v1.7.0-Universal-Older-Rooted-debug.apk.sha256
          sha256sum dist/MyTube-r6.5-LiveDub-v1.7.0-Complete-AndroidStudio-Source.zip > dist/MyTube-r6.5-LiveDub-v1.7.0-Complete-AndroidStudio-Source.zip.sha256
          if [ -s dist/MyTube-v1.7.0-ARM64-production.apk ]; then
            sha256sum dist/MyTube-v1.7.0-ARM64-production.apk > dist/MyTube-v1.7.0-ARM64-production.apk.sha256
            sha256sum dist/MyTube-v1.7.0-Universal-production.apk > dist/MyTube-v1.7.0-Universal-production.apk.sha256
          fi
          test -s dist/MyTube-v1.7.0-OAuth-Registration.txt
          ls -lh dist/
          cat dist/*.sha256

      - name: Upload verified v1.7.0 build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MyTube-v1.7.0-verified-build
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publish v1.7.0 dual APK release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if [ "${MYTUBE_SIGNING_PINNED:-false}" != "true" ]; then
            echo "::notice::Signing identity bootstrap complete; release publication is intentionally skipped until the reported SHA-1 is pinned in .github/mytube-signing-sha1.txt."
            exit 0
          fi
          TAG="v1.7.0-dual-arm64-universal-debug"
          NOTES="MyTube v1.7.0: full stabilization release across playback, playlists, downloads, Live Dub, OAuth and browser recovery.
          - Dynamic YouTube Mix queues prefer Watch Next playlist context instead of being forced through an ordinary playlist page.
          - Static playlists retain NewPipe pagination, with Download Engine flat-playlist metadata as an independent final fallback.
          - Playlist-only search results open directly into the native playlist flow instead of bouncing through repeated YouTube WebView redirects.
          - Playlist downloader discovery and loading are separated so selecting a collection no longer restarts its own loading effect.
          - Playlist download failures are surfaced to the user; successful queueing reports the actual number of items queued.
          - Native playlist playback keeps list=/Mix context, Previous/Next collection order, next-item prefetch and automatic advance.
          - Full titles, view counts, List/Card controls, global text size, live discovery, PiP/audio-only, OAuth and download management remain included.
          - Debug APKs retain the established update-compatible signing certificate."


          ASSETS=(
            dist/MyTube-v1.7.0-ARM64-Whisper-DownloadEngine-debug.apk
            dist/MyTube-v1.7.0-ARM64-Whisper-DownloadEngine-debug.apk.sha256
            dist/MyTube-v1.7.0-Universal-Older-Rooted-debug.apk
            dist/MyTube-v1.7.0-Universal-Older-Rooted-debug.apk.sha256
            dist/MyTube-r6.5-LiveDub-v1.7.0-Complete-AndroidStudio-Source.zip
            dist/MyTube-r6.5-LiveDub-v1.7.0-Complete-AndroidStudio-Source.zip.sha256
            dist/MyTube-v1.7.0-OAuth-Registration.txt
            dist/MyTube-v1.7.0-Install-Compatibility.txt
          )
          if [ -s dist/MyTube-v1.7.0-ARM64-production.apk ]; then
            ASSETS+=(
              dist/MyTube-v1.7.0-ARM64-production.apk
              dist/MyTube-v1.7.0-ARM64-production.apk.sha256
              dist/MyTube-v1.7.0-Universal-production.apk
              dist/MyTube-v1.7.0-Universal-production.apk.sha256
            )
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "MyTube v1.7.0 ARM64 + Universal" \
              --notes "$NOTES"
          fi
          gh release view "$TAG"


