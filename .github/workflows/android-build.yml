name: Build MyTube Android APKs

on:
  push:
    branches: [ main ]
    paths:
      - 'source/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mytube-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
    timeout-minutes: 65

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify v1.3.3 dual-APK source
        shell: bash
        run: |
          set -euo pipefail
          test -f source/settings.gradle.kts
          grep -q 'versionName = "1.3.2"' source/app/build.gradle.kts
          grep -q 'create("arm64")' source/app/build.gradle.kts
          grep -q 'create("universal")' source/app/build.gradle.kts
          grep -q 'armeabi-v7a' source/app/build.gradle.kts
          grep -q 'nativeWhisperSupported' source/app/src/main/java/com/drivedeck/tubedeck/player/WhisperAudioAsr.kt
          echo "Building MyTube v1.3.3 ARM64 + Universal source tree."

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Provision multilingual Whisper Tiny Q5_1 model
        shell: bash
        run: |
          set -euo pipefail
          MODEL="$GITHUB_WORKSPACE/source/app/src/main/assets/models/ggml-tiny-q5_1.bin"
          EXPECTED_SHA1=2827a03e495b1ed3048ef28a6a4620537db4ee51
          mkdir -p "$(dirname "$MODEL")"
          if [ ! -s "$MODEL" ]; then
            curl -fL --retry 3 --retry-delay 3 \
              https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin \
              -o "$MODEL"
          fi
          echo "$EXPECTED_SHA1  $MODEL" | sha1sum -c -
          ls -lh "$MODEL"

      - name: Run unit tests for both editions
        run: gradle -p source testArm64DebugUnitTest testUniversalDebugUnitTest --stacktrace

      - name: Build ARM64 and Universal debug APKs
        run: gradle -p source assembleArm64Debug assembleUniversalDebug --stacktrace

      - name: Verify APK ABI coverage
        shell: bash
        run: |
          set -euo pipefail
          ARM64="$GITHUB_WORKSPACE/source/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk"
          UNIVERSAL="$GITHUB_WORKSPACE/source/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          test -s "$ARM64"
          test -s "$UNIVERSAL"

          echo "ARM64 native libraries:"
          unzip -l "$ARM64" | grep 'lib/.*\.so' | awk '{print $4}' | head -80
          echo "Universal native libraries:"
          unzip -l "$UNIVERSAL" | grep 'lib/.*\.so' | awk '{print $4}' | head -160

          unzip -l "$ARM64" | grep -q 'lib/arm64-v8a/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/arm64-v8a/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/armeabi-v7a/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/x86_64/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/x86/'

      - name: Stage both APKs and complete source
        shell: bash
        run: |
          set -euo pipefail
          ARM64="$GITHUB_WORKSPACE/source/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk"
          UNIVERSAL="$GITHUB_WORKSPACE/source/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          mkdir -p "$GITHUB_WORKSPACE/dist"

          cp "$ARM64" "$GITHUB_WORKSPACE/dist/MyTube-v1.3.3-ARM64-Whisper-YtDlp-debug.apk"
          cp "$UNIVERSAL" "$GITHUB_WORKSPACE/dist/MyTube-v1.3.3-Universal-Older-Rooted-debug.apk"

          SOURCE_ZIP="$GITHUB_WORKSPACE/dist/MyTube-r6.5-LiveDub-v1.3.3-Complete-AndroidStudio-Source.zip"
          (
            cd "$GITHUB_WORKSPACE/source"
            zip -qr "$SOURCE_ZIP" . \
              -x '.gradle/*' \
              -x '*/build/*' \
              -x 'local.properties'
          )

          cd "$GITHUB_WORKSPACE"
          sha256sum dist/MyTube-v1.3.3-ARM64-Whisper-YtDlp-debug.apk > dist/MyTube-v1.3.3-ARM64-Whisper-YtDlp-debug.apk.sha256
          sha256sum dist/MyTube-v1.3.3-Universal-Older-Rooted-debug.apk > dist/MyTube-v1.3.3-Universal-Older-Rooted-debug.apk.sha256
          sha256sum dist/MyTube-r6.5-LiveDub-v1.3.3-Complete-AndroidStudio-Source.zip > dist/MyTube-r6.5-LiveDub-v1.3.3-Complete-AndroidStudio-Source.zip.sha256
          ls -lh dist/
          cat dist/*.sha256

      - name: Publish v1.3.3 dual APK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          TAG="v1.3.3-dual-arm64-universal-debug"
          NOTES="MyTube r6.5 LiveDub v1.3.3.

          Two APK editions are published for every release:
          - ARM64: optimized for arm64-v8a devices with full native Whisper audio ASR and yt-dlp.
          - Universal: includes arm64-v8a, armeabi-v7a, x86 and x86_64 native support from compatible bundled components, intended for broader/older/rooted-device compatibility.
          - On non-ARM64 devices the current Whisper native AAR is not available, so MyTube disables native Whisper safely and retains caption-based dubbing instead of crashing.
          - Minimum Android API is 24 (Android 7.0), matching the maintained yt-dlp runtime requirement.
          - No root-detection or root-blocking logic is used.
          - System Back prioritizes PiP for active video playback in both native and web modes.
          - The ExoPlayer quality control opens its own Auto/all-quality chooser, not Player Settings.
          - Comments use NewPipe pagination with updated yt-dlp fallback.
          - Google account state is only set after a real Google Identity credential succeeds; GOOGLE_WEB_CLIENT_ID can be supplied as a repository Actions secret.
          - Weekly automatic and manual yt-dlp updates remain enabled.
          - The auxiliary speed/quality/Zoom/fullscreen/CC/Dub row is moved down beside the seek bar and away from the center transport controls.
          - Playlist discovery is now YouTube-context-first, modeled on the Watch Next architecture used by clients such as SmartTube.
          - MyTube reads YouTube's current InnerTube key/client version from the watch page and calls /youtubei/v1/next for the active video.
          - Exact server playlist IDs/panels are offered first and downloaded through the canonical playlist URL with full NewPipe pagination.
          - YouTube Watch Next related items are the primary source for adjacent/related episodes.
          - Strict same-channel/title episode matching is only a fallback/expansion source.
          - Generic playlist search is last priority and rejects weak/random/trending matches.
          - Duplicate uploads of the same episode number collapse to the strongest contextual match.
          - If YouTube context and strict matching cannot verify a collection, MyTube shows none rather than substituting a random Mix.
          - Download Queue now supports Select all/none, Pause all, Resume/retry all, Delete all, Pause selected, Resume/retry selected and Delete selected.
          - Recoverable network/CDN/extractor interruptions auto-retry indefinitely with bounded 3/5/10/20/30/60-second backoff until success or explicit user pause/delete.
          - Partial files are retained and HTTP Range resume is used when supported; each retry re-resolves fresh YouTube stream URLs.
          - Interrupted/failed legacy queue entries are re-queued automatically after app/process restart.
          - A live Android notification reports queued/active/finished/paused/failed/retrying counts, retry totals, aggregate progress, elapsed time and ETA when calculable.
          - The old 32-parallel-download ceiling has been removed; the user may choose any positive concurrency value.
          - Android system Back is intercepted at Activity level before WebView/history navigation while video is active.
          - One Back enters PiP after a short 350 ms double-press decision window.
          - Double Back within that window opens compact Close and Audio-only choices instead of entering PiP.
          - Audio-only hands the current video/position to a MediaSession foreground service so playback can continue after the app task is removed.
          - Portrait playback now shows a separate More episodes shelf alongside the existing Up next feed.
          - The episode shelf reuses the downloader's strict YouTube Watch Next/playlist discovery and expands canonical playlists with full pagination when available.
          - Episode cards use a compact horizontal carousel while Up next rows use smaller thumbnails/fonts so both sections remain visible and readable in portrait.
          - Fixed Android system Back regression by removing nested player handlers that paused/closed playback before the Activity PiP/double-Back controller could run.
          - Normal playback Back is now owned by the Activity state machine; transient player UI Back still closes Settings, Comments, Description or fullscreen first.
          - Added a compact Description control beside Comments in portrait playback, showing channel, views/date metadata and the full extracted video description.
          - Unit tests, both APK builds and ABI verification must pass before release publication."

          ASSETS=(
            dist/MyTube-v1.3.3-ARM64-Whisper-YtDlp-debug.apk
            dist/MyTube-v1.3.3-ARM64-Whisper-YtDlp-debug.apk.sha256
            dist/MyTube-v1.3.3-Universal-Older-Rooted-debug.apk
            dist/MyTube-v1.3.3-Universal-Older-Rooted-debug.apk.sha256
            dist/MyTube-r6.5-LiveDub-v1.3.3-Complete-AndroidStudio-Source.zip
            dist/MyTube-r6.5-LiveDub-v1.3.3-Complete-AndroidStudio-Source.zip.sha256
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "MyTube v1.3.3 ARM64 + Universal Debug" \
              --notes "$NOTES"
          fi
          gh release view "$TAG"
