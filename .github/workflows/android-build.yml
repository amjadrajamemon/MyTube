name: Build MyTube Android APKs

on:
  push:
    branches: [ main ]
    paths:
      - 'source/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
    timeout-minutes: 65

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify v1.2.9 dual-APK source
        shell: bash
        run: |
          set -euo pipefail
          test -f source/settings.gradle.kts
          grep -q 'versionName = "1.2.9"' source/app/build.gradle.kts
          grep -q 'create("arm64")' source/app/build.gradle.kts
          grep -q 'create("universal")' source/app/build.gradle.kts
          grep -q 'armeabi-v7a' source/app/build.gradle.kts
          grep -q 'nativeWhisperSupported' source/app/src/main/java/com/drivedeck/tubedeck/player/WhisperAudioAsr.kt
          echo "Building MyTube v1.2.9 ARM64 + Universal source tree."

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Provision multilingual Whisper Tiny Q5_1 model
        shell: bash
        run: |
          set -euo pipefail
          MODEL="$GITHUB_WORKSPACE/source/app/src/main/assets/models/ggml-tiny-q5_1.bin"
          EXPECTED_SHA1=2827a03e495b1ed3048ef28a6a4620537db4ee51
          mkdir -p "$(dirname "$MODEL")"
          if [ ! -s "$MODEL" ]; then
            curl -fL --retry 3 --retry-delay 3 \
              https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin \
              -o "$MODEL"
          fi
          echo "$EXPECTED_SHA1  $MODEL" | sha1sum -c -
          ls -lh "$MODEL"

      - name: Run unit tests for both editions
        run: gradle -p source testArm64DebugUnitTest testUniversalDebugUnitTest --stacktrace

      - name: Build ARM64 and Universal debug APKs
        run: gradle -p source assembleArm64Debug assembleUniversalDebug --stacktrace

      - name: Verify APK ABI coverage
        shell: bash
        run: |
          set -euo pipefail
          ARM64="$GITHUB_WORKSPACE/source/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk"
          UNIVERSAL="$GITHUB_WORKSPACE/source/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          test -s "$ARM64"
          test -s "$UNIVERSAL"

          echo "ARM64 native libraries:"
          unzip -l "$ARM64" | grep 'lib/.*\.so' | awk '{print $4}' | head -80
          echo "Universal native libraries:"
          unzip -l "$UNIVERSAL" | grep 'lib/.*\.so' | awk '{print $4}' | head -160

          unzip -l "$ARM64" | grep -q 'lib/arm64-v8a/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/arm64-v8a/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/armeabi-v7a/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/x86_64/'
          unzip -l "$UNIVERSAL" | grep -q 'lib/x86/'

      - name: Stage both APKs and complete source
        shell: bash
        run: |
          set -euo pipefail
          ARM64="$GITHUB_WORKSPACE/source/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk"
          UNIVERSAL="$GITHUB_WORKSPACE/source/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          mkdir -p "$GITHUB_WORKSPACE/dist"

          cp "$ARM64" "$GITHUB_WORKSPACE/dist/MyTube-v1.2.9-ARM64-Whisper-YtDlp-debug.apk"
          cp "$UNIVERSAL" "$GITHUB_WORKSPACE/dist/MyTube-v1.2.9-Universal-Older-Rooted-debug.apk"

          SOURCE_ZIP="$GITHUB_WORKSPACE/dist/MyTube-r6.5-LiveDub-v1.2.9-Complete-AndroidStudio-Source.zip"
          (
            cd "$GITHUB_WORKSPACE/source"
            zip -qr "$SOURCE_ZIP" . \
              -x '.gradle/*' \
              -x '*/build/*' \
              -x 'local.properties'
          )

          cd "$GITHUB_WORKSPACE"
          sha256sum dist/MyTube-v1.2.9-ARM64-Whisper-YtDlp-debug.apk > dist/MyTube-v1.2.9-ARM64-Whisper-YtDlp-debug.apk.sha256
          sha256sum dist/MyTube-v1.2.9-Universal-Older-Rooted-debug.apk > dist/MyTube-v1.2.9-Universal-Older-Rooted-debug.apk.sha256
          sha256sum dist/MyTube-r6.5-LiveDub-v1.2.9-Complete-AndroidStudio-Source.zip > dist/MyTube-r6.5-LiveDub-v1.2.9-Complete-AndroidStudio-Source.zip.sha256
          ls -lh dist/
          cat dist/*.sha256

      - name: Publish v1.2.9 dual APK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          TAG="v1.2.9-dual-arm64-universal-debug"
          NOTES="MyTube r6.5 LiveDub v1.2.9.

          Two APK editions are published for every release:
          - ARM64: optimized for arm64-v8a devices with full native Whisper audio ASR and yt-dlp.
          - Universal: includes arm64-v8a, armeabi-v7a, x86 and x86_64 native support from compatible bundled components, intended for broader/older/rooted-device compatibility.
          - On non-ARM64 devices the current Whisper native AAR is not available, so MyTube disables native Whisper safely and retains caption-based dubbing instead of crashing.
          - Minimum Android API is 24 (Android 7.0), matching the maintained yt-dlp runtime requirement.
          - No root-detection or root-blocking logic is used.
          - System Back prioritizes PiP for active video playback in both native and web modes.
          - The ExoPlayer quality control opens its own Auto/all-quality chooser, not Player Settings.
          - Comments use NewPipe pagination with updated yt-dlp fallback.
          - Google account state is only set after a real Google Identity credential succeeds; GOOGLE_WEB_CLIENT_ID can be supplied as a repository Actions secret.
          - Weekly automatic and manual yt-dlp updates remain enabled.
          - The auxiliary speed/quality/Zoom/fullscreen/CC/Dub row is moved down beside the seek bar and away from the center transport controls.
          - Whole-playlist download now uses strict relevance scoring against the current video's actual YouTube title and uploader.
          - Same-channel episode results are preferred; weak/random/trending playlist matches are rejected.
          - MyTube builds a verified Related episodes collection even when no official playlist exists.
          - Duplicate uploads of the same episode number are collapsed to the strongest match.
          - Official playlists are shown only when their title/channel strongly matches the current serial/program.
          - If no collection can be verified, MyTube shows no related collection instead of a random YouTube Mix.
          - Unit tests, both APK builds and ABI verification must pass before release publication."

          ASSETS=(
            dist/MyTube-v1.2.9-ARM64-Whisper-YtDlp-debug.apk
            dist/MyTube-v1.2.9-ARM64-Whisper-YtDlp-debug.apk.sha256
            dist/MyTube-v1.2.9-Universal-Older-Rooted-debug.apk
            dist/MyTube-v1.2.9-Universal-Older-Rooted-debug.apk.sha256
            dist/MyTube-r6.5-LiveDub-v1.2.9-Complete-AndroidStudio-Source.zip
            dist/MyTube-r6.5-LiveDub-v1.2.9-Complete-AndroidStudio-Source.zip.sha256
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "MyTube v1.2.9 ARM64 + Universal Debug" \
              --notes "$NOTES"
          fi
          gh release view "$TAG"
