name: Audit Nova IPTV v0.2.0 source pin
on:
  push:
    branches: ['feature/iptv-v016-alignment-20261028']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-v018:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout MyTube integration source
        uses: actions/checkout@v4
      - name: Verify immutable Nova v0.2.0 source pin
        shell: bash
        run: |
          set -euo pipefail
          PIN=dfd4df2cb9aab9909491712674a894f57556fa26
          test "$(cat iptv-vendor/NOVA-V020-PIN.txt)" = "$PIN"
          grep -q 'verifyReachability' source/novaiptv/src/main/java/com/novastream/iptv/core/Xtream.java
          grep -q 'buildEnigmaHome' source/novaiptv/src/main/java/com/novastream/iptv/ui/MainActivity.java
          grep -q 'ThemeColorPicker.show' source/novaiptv/src/main/java/com/novastream/iptv/ui/MainActivity.java
          test -s source/novaiptv/src/main/java/com/novastream/iptv/core/PortalEndpoint.java
          test -s source/novaiptv/src/test/java/com/novastream/iptv/core/PortalEndpointTest.java
          test -s source/novaiptv/src/test/java/com/novastream/iptv/ui/ThemeIdentityTest.java
          ! grep -R -n "versionName '0.1.9'" source/novaiptv/src
          echo "MyTube source pin and v0.2.0 feature invariants passed."
      - name: Checkout pinned Nova IPTV repository commit
        uses: actions/checkout@v4
        with:
          repository: amjadrajamemon/IPTV
          ref: dfd4df2cb9aab9909491712674a894f57556fa26
          path: upstream-iptv
      - name: Verify immutable upstream source commit and v0.2.0 migration inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream-iptv rev-parse HEAD)" = "dfd4df2cb9aab9909491712674a894f57556fa26"
          test -s upstream-iptv/NovaIPTV-Pro-v0.1.6-Source-GitHub-Build.zip
          test -s upstream-iptv/scripts/apply_v017_color_picker.py
          test -s upstream-iptv/scripts/apply_v017x_upgrade.py
          test -s upstream-iptv/scripts/apply_v018_connectivity.py
          grep -q 'verifyReachability' source/novaiptv/src/main/java/com/novastream/iptv/core/Xtream.java
          grep -q 'buildEnigmaHome' source/novaiptv/src/main/java/com/novastream/iptv/ui/MainActivity.java
          grep -q 'ThemeColorPicker.show' source/novaiptv/src/main/java/com/novastream/iptv/ui/MainActivity.java
          test -s source/novaiptv/src/main/java/com/novastream/iptv/core/PortalEndpoint.java
          test -s source/novaiptv/src/test/java/com/novastream/iptv/core/PortalEndpointTest.java
          echo 'Immutable upstream commit and integrated v0.2.0 migration markers verified.'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile and unit test integrated Nova IPTV module
        working-directory: source
        run: gradle --no-daemon --console=plain :novaiptv:testDebugUnitTest :novaiptv:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mytube-nova-iptv-v018-audit
          path: source/novaiptv/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
