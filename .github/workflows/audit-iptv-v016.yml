name: Audit Nova IPTV v0.2.1 source pin
on:
  push:
    branches: ['feature/iptv-v016-alignment-20261028']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-v021:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout MyTube integration source
        uses: actions/checkout@v4
      - name: Verify immutable Nova v0.2.1 source pin
        shell: bash
        run: |
          set -euo pipefail
          PIN=c7550d4da9a73892fb70b35f0b53e1093bd289e3
          test "$(cat iptv-vendor/NOVA-V021-PIN.txt)" = "$PIN"
          grep -q 'verifyReachability' source/novaiptv/src/main/java/com/novastream/iptv/core/Xtream.java
          grep -q 'buildEnigmaHome' source/novaiptv/src/main/java/com/novastream/iptv/ui/MainActivity.java
          grep -q 'ThemeColorPicker.show' source/novaiptv/src/main/java/com/novastream/iptv/ui/MainActivity.java
          test -s source/novaiptv/src/main/java/com/novastream/iptv/core/PortalEndpoint.java
          test -s source/novaiptv/src/test/java/com/novastream/iptv/core/PortalEndpointTest.java
          test -s source/novaiptv/src/test/java/com/novastream/iptv/ui/ThemeIdentityTest.java
          grep -R -q 'MAX_CHANNELS = 250000;' source/novaiptv/src/main/java/com/novastream/iptv/core/M3uParser.java
          grep -R -q 'lines > 1000000' source/novaiptv/src/main/java/com/novastream/iptv/core/M3uParser.java
          grep -R -q 'CONNECT_TIMEOUT_MS = 20000' source/novaiptv/src/main/java/com/novastream/iptv/core/Net.java
          grep -R -q 'READ_TIMEOUT_MS = 180000' source/novaiptv/src/main/java/com/novastream/iptv/core/Net.java
          test -s source/novaiptv/src/test/java/com/novastream/iptv/core/NetTransportTest.java
          if grep -R -n '75000' source/novaiptv/src/main; then echo 'Legacy 75000 ceiling remains'; exit 1; fi
          echo "MyTube source pin and v0.2.1 feature invariants passed."
      - name: Checkout pinned Nova IPTV repository commit
        uses: actions/checkout@v4
        with:
          repository: amjadrajamemon/IPTV
          ref: c7550d4da9a73892fb70b35f0b53e1093bd289e3
          path: upstream-iptv
      - name: Verify immutable upstream source commit and v0.2.1 migration inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream-iptv rev-parse HEAD)" = "c7550d4da9a73892fb70b35f0b53e1093bd289e3"
          test -s upstream-iptv/NovaIPTV-Pro-v0.2.0-Source-GitHub-Build.zip
          test -s upstream-iptv/scripts/apply_v017_color_picker.py
          test -s upstream-iptv/scripts/apply_v017x_upgrade.py
          test -s upstream-iptv/scripts/apply_v018_connectivity.py
          test -s upstream-iptv/scripts/apply_v020_playlist_transport.py
          test -s upstream-iptv/scripts/apply_large_playlist_capacity_fix.py
          test -s upstream-iptv/scripts/apply_v020_playlist_transport.py
          test -s upstream-iptv/scripts/apply_large_playlist_capacity_fix.py
          grep -q 'verifyReachability' source/novaiptv/src/main/java/com/novastream/iptv/core/Xtream.java
          grep -q 'buildEnigmaHome' source/novaiptv/src/main/java/com/novastream/iptv/ui/MainActivity.java
          grep -q 'ThemeColorPicker.show' source/novaiptv/src/main/java/com/novastream/iptv/ui/MainActivity.java
          test -s source/novaiptv/src/main/java/com/novastream/iptv/core/PortalEndpoint.java
          test -s source/novaiptv/src/test/java/com/novastream/iptv/core/PortalEndpointTest.java
          echo 'Immutable upstream commit and integrated v0.2.1 playlist transport/capacity markers verified.'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile and unit test integrated Nova IPTV module
        working-directory: source
        run: gradle --no-daemon --console=plain :novaiptv:testDebugUnitTest :novaiptv:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mytube-nova-iptv-v021-audit
          path: source/novaiptv/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
