name: Audit Nova IPTV v0.1.8 source pin
on:
  push:
    branches: ['feature/iptv-v016-alignment-20261028']
    paths: ['source/novaiptv/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-v018:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout MyTube integration source
        uses: actions/checkout@v4
        with:
          ref: feature/iptv-v016-alignment-20261028
      - name: Verify exact Nova v0.1.8 release pin and integrated features
        shell: bash
        run: |
          set -euo pipefail
          PIN=aba592d868ddd615f4be67af5002d6f01f6751fb
          EXPECTED_SHA=50b19792fbc28314e76956cc25ac987098d9cbb6879ad3d365841ae76a415843
          test "$(cat iptv-vendor/NOVA-V018-PIN.txt)" = "$PIN"
          test "$(awk '{print $1}' iptv-vendor/NOVA-V018-SOURCE-SHA256.txt)" = "$EXPECTED_SHA"
          test ! -e iptv-vendor/NOVA-V021-PIN.txt
          test ! -e iptv-vendor/NOVA-V021-SOURCE-SHA256.txt
          grep -Eq 'MAX_PLAYLIST_BYTES[[:space:]]*=[[:space:]]*96' source/novaiptv/src/main/java/com/novastream/iptv/core/Net.java
          grep -q 'buildEnigmaHome' source/novaiptv/src/main/java/com/novastream/iptv/ui/MainActivity.java
          grep -q 'ThemeColorPicker.show' source/novaiptv/src/main/java/com/novastream/iptv/ui/MainActivity.java
          grep -q 'verifyReachability' source/novaiptv/src/main/java/com/novastream/iptv/core/Xtream.java
          grep -q 'normalizedHost=x.baseAddress()' source/novaiptv/src/main/java/com/novastream/iptv/ui/MainActivity.java
          test -s source/novaiptv/src/main/java/com/novastream/iptv/core/PortalEndpoint.java
          test -s source/novaiptv/src/test/java/com/novastream/iptv/core/PortalEndpointTest.java
          test -s source/novaiptv/src/test/java/com/novastream/iptv/ui/ThemeIdentityTest.java
          ! grep -R -n 'versionName.*0.1.9' iptv-vendor/NOVA-V018-PIN.txt iptv-vendor/NOVA-V018-SOURCE-SHA256.txt
          echo "Pinned v0.1.8 release identity and feature invariants verified."
      - name: Checkout immutable upstream v0.1.8 commit
        uses: actions/checkout@v4
        with:
          repository: amjadrajamemon/IPTV
          ref: aba592d868ddd615f4be67af5002d6f01f6751fb
          path: upstream-iptv
      - name: Verify upstream commit and release source archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream-iptv rev-parse HEAD)" = "aba592d868ddd615f4be67af5002d6f01f6751fb"
          ARCHIVE="$RUNNER_TEMP/NovaIPTV-Pro-v0.1.8-Source-GitHub-Build.zip"
          curl -fLsS --retry 3 --retry-delay 2 "https://github.com/amjadrajamemon/IPTV/releases/download/v0.1.8-preview/NovaIPTV-Pro-v0.1.8-Source-GitHub-Build.zip" -o "$ARCHIVE"
          echo "50b19792fbc28314e76956cc25ac987098d9cbb6879ad3d365841ae76a415843  $ARCHIVE" | sha256sum -c -
          unzip -tq "$ARCHIVE"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile and unit test integrated Nova IPTV v0.1.8 module
        working-directory: source
        run: gradle --no-daemon --console=plain :novaiptv:testDebugUnitTest :novaiptv:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mytube-nova-iptv-v018-audit
          path: source/novaiptv/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
