name: Audit Nova IPTV v0.1.8 source pin
on:
  push:
    branches: ['feature/iptv-v016-alignment-20261028']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-v018:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout MyTube integration source
        uses: actions/checkout@v4
      - name: Verify immutable Nova v0.1.8 source pin
        shell: bash
        run: |
          set -euo pipefail
          PIN=aba592d868ddd615f4be67af5002d6f01f6751fb
          test "$(cat iptv-vendor/NOVA-V018-PIN.txt)" = "$PIN"
          grep -q 'verifyReachability' source/novaiptv/src/main/java/com/novastream/iptv/core/Xtream.java
          grep -q 'buildEnigmaHome' source/novaiptv/src/main/java/com/novastream/iptv/ui/MainActivity.java
          grep -q 'ThemeColorPicker.show' source/novaiptv/src/main/java/com/novastream/iptv/ui/MainActivity.java
          test -s source/novaiptv/src/main/java/com/novastream/iptv/core/PortalEndpoint.java
          test -s source/novaiptv/src/test/java/com/novastream/iptv/core/PortalEndpointTest.java
          test -s source/novaiptv/src/test/java/com/novastream/iptv/ui/ThemeIdentityTest.java
          ! grep -R -n "versionName '0.1.9'" source/novaiptv/src
          echo "MyTube source pin and v0.1.8 feature invariants passed."
      - name: Checkout pinned Nova IPTV repository commit
        uses: actions/checkout@v4
        with:
          repository: amjadrajamemon/IPTV
          ref: aba592d868ddd615f4be67af5002d6f01f6751fb
          path: upstream-iptv
      - name: Verify released v0.1.8 source archive and manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream-iptv rev-parse HEAD)" = "aba592d868ddd615f4be67af5002d6f01f6751fb"
          ARCHIVE="$RUNNER_TEMP/NovaIPTV-Pro-v0.1.8-Source-GitHub-Build.zip"
          curl -fLsS --retry 3 --retry-delay 2 "https://github.com/amjadrajamemon/IPTV/releases/download/v0.1.8-preview/NovaIPTV-Pro-v0.1.8-Source-GitHub-Build.zip" -o "$ARCHIVE"
          echo "50b19792fbc28314e76956dc25ac987098d9cbb6879ad3d365841ae76a415843  $ARCHIVE" | sha256sum -c -
          unzip -tq "$ARCHIVE"
          mkdir -p upstream-v018
          unzip -q "$ARCHIVE" -d upstream-v018
          PROJECT=upstream-v018/NovaIPTV-Pro
          grep -Fq "versionName '0.1.8-preview'" "$PROJECT/app/build.gradle"
          ! grep -Fq "versionName '0.1.9'" "$PROJECT/app/build.gradle"
          grep -q 'MAX_PLAYLIST_BYTES=96' "$PROJECT/app/src/main/java/com/novastream/iptv/core/Net.java"
          grep -q 'buildEnigmaHome' "$PROJECT/app/src/main/java/com/novastream/iptv/ui/MainActivity.java"
          grep -q 'ThemeColorPicker.show' "$PROJECT/app/src/main/java/com/novastream/iptv/ui/MainActivity.java"
          grep -q 'verifyReachability' "$PROJECT/app/src/main/java/com/novastream/iptv/core/Xtream.java"
          python3 - "$ARCHIVE" <<'PY'
          import hashlib, sys
          from zipfile import ZipFile
          archive=ZipFile(sys.argv[1])
          manifest='NovaIPTV-Pro/SOURCE_MANIFEST_SHA256.txt'
          assert manifest in archive.namelist(), 'v0.1.8 source manifest missing'
          for line in archive.read(manifest).decode('utf-8').splitlines():
              digest,path=line.split('  ',1)
              assert hashlib.sha256(archive.read('NovaIPTV-Pro/'+path)).hexdigest()==digest, 'Source integrity mismatch: '+path
          print('v0.1.8 release source archive manifest verified.')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile and unit test integrated Nova IPTV module
        working-directory: source
        run: gradle --no-daemon --console=plain :novaiptv:testDebugUnitTest :novaiptv:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mytube-nova-iptv-v018-audit
          path: source/novaiptv/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
