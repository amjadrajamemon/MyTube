name: TubeDeck v2.3.11 Install-Verified ARM64 ARMv7 and Universal

on:
  push:
    branches:
      - feature/fix-next-autoplay-blackout-home-20261102
      - feature/tubedeck-six-experiences-20261105
    paths:
      - 'source/**'
      - 'ci/**'
      - '.github/workflows/core-fixes-apk.yml'
      - '.github/mytube-signing-sha1.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mytube-core-fixes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dual-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - name: Checkout the actual feature branch
        uses: actions/checkout@v4

      - name: Verify IPTV was removed and core fixes are present
        shell: bash
        run: |
          set -euo pipefail
          ! test -d source/novaiptv
          ! test -d source/app/src/main/java/com/drivedeck/tubedeck/iptv
          ! grep -R -E 'NovaPlaybackBridge|IptvActivity|onOpenNovaIptv|onOpenIptv' source/app/src/main/java
          ! grep -Fq 'include(":app", ":novaiptv")' source/settings.gradle.kts
          grep -Fq 'versionCode = 121' source/app/build.gradle.kts
          grep -Fq 'versionName = "2.3.11"' source/app/build.gradle.kts
          grep -Fq 'PlaylistQueuePolicy.nextUnplayed' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'restoreScreenAfterTap()' source/app/src/main/java/com/drivedeck/tubedeck/ui/components/PlaybackBlackoutHost.kt
          HOME=source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/DriveDeckScreen.kt
          grep -Fq 'item(key = "home-three-feeds")' "$HOME"
          grep -Fq 'title = "History"' "$HOME"
          grep -Fq 'title = "Relevant"' "$HOME"
          grep -Fq 'title = "Trending"' "$HOME"
          grep -Fq 'searchDialogMode != null' "$HOME"
          grep -Fq 'CompactSearchPanel(' "$HOME"
          ! grep -Fq 'historyExpanded' "$HOME"
          grep -Fq '.setActions(listOf(closeAction, audioAction))' source/app/src/main/java/com/drivedeck/tubedeck/player/PlaybackPipActions.kt
          grep -Fq 'Close mini-player' source/app/src/main/java/com/drivedeck/tubedeck/MainActivity.kt
          grep -Fq 'tvNavigateBackBehindPip' source/app/src/main/java/com/drivedeck/tubedeck/MainActivity.kt
          grep -Fq 'tvPendingTopFocus' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'firstItemFocus' "$HOME"
          grep -Fq 'selectedHomeVideoId' "$HOME"
          grep -Fq 'selectedSearchVideoId' "$HOME"
          grep -Fq 'bringIntoViewRequester' "$HOME"
          grep -Fq 'TvRemoteNavigationPolicy.decide' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          test -f source/app/src/test/java/com/drivedeck/tubedeck/ui/components/TvRemoteNavigationPolicyTest.kt
          test -f source/app/src/test/java/com/drivedeck/tubedeck/player/AudioNextSessionPolicyTest.kt
          grep -Fq 'AudioNextSessionPolicy()' source/app/src/main/java/com/drivedeck/tubedeck/player/BackgroundAudioPlaybackService.kt
          grep -Fq 'positionSnapshotJob' source/app/src/main/java/com/drivedeck/tubedeck/player/BackgroundAudioPlaybackService.kt
          grep -Fq 'Restore video from blackout' source/app/src/main/java/com/drivedeck/tubedeck/ui/components/PlaybackBlackoutHost.kt
          # Regression check: the spinner and central Play/Pause MUST use the
          # same safe-drawing coordinate system and shared Y offset, especially
          # on landscape TV boxes with asymmetric system/navigation bar insets.
          python3 - <<'PY'
          from pathlib import Path
          src = Path("source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt").read_text()
          start = src.index("if ((isPreparing || !firstFrameRendered || isBuffering || playbackRecoveryActive)")
          end = src.index("if (gestureOverlayVisible)", start)
          spinner = src[start:end]
          assert ".fillMaxSize()" in spinner
          assert ".windowInsetsPadding(WindowInsets.safeDrawing)" in spinner
          assert ".offset(y = centerPlayYOffset)" in spinner
          assert src.count(".offset(y = centerPlayYOffset)") == 2, "Play and spinner offsets diverged"
          assert 'val centerPlayYOffset = if (compactPortrait) 12.dp else 10.dp' in src
          assert 'val centerControlDiameter = if (compactPortrait) 52.dp else 60.dp' in src
          # Equivalent modifier chains may wrap across lines when themed player chrome is added.
          import re
          assert re.search(r'Modifier\.focusRequester\(tvPlayPauseFocus\)\s*\.size\(centerControlDiameter\)', src), "Player focus target and spinner center must share the same size"
          print("PASS: loading spinner and Play control share safe-drawing center/offset/size")
          PY

          grep -Fq 'enableScreenBlackout()' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          ! grep -Fq 'always-reachable audio-only blackout shortcut' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'connection.disconnect()' source/app/src/main/java/com/drivedeck/tubedeck/player/YoutubeStreamResolver.kt
          test -f QUALITY_AUDIT_v1.9.7_2026-11-03.md
          test -f source/app/src/main/java/com/drivedeck/tubedeck/ui/theme/ThemeProfiles.kt
          grep -Fq 'appearancePreset = activeAppearance.appearancePreset' source/app/src/main/java/com/drivedeck/tubedeck/MainActivity.kt
          grep -Fq 'TubeDeckSideRail(' source/app/src/main/java/com/drivedeck/tubedeck/MainActivity.kt
          grep -Fq 'LazyRow(' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/DriveDeckScreen.kt
          grep -Fq 'LazyColumn(' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/DriveDeckScreen.kt
          grep -Fq 'loadMoreHomeFeed(feed)' source/app/src/main/java/com/drivedeck/tubedeck/MainActivity.kt
          # TV regressions: density, D-pad focus, persisted Back policy in both hosts.
          grep -Fq 'compactTvList = true' "$HOME"
          grep -Fq 'focusGroup()' "$HOME"
          grep -Fq 'TvBackButtonPolicy.decide(' source/app/src/main/java/com/drivedeck/tubedeck/MainActivity.kt
          grep -Fq 'TvBackButtonPolicy.decide(' source/app/src/main/java/com/drivedeck/tubedeck/NativePlayerActivity.kt
          grep -Fq 'tvBackButtonAction = tvBackButtonAction' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/SettingsScreen.kt
          test -f source/app/src/test/java/com/drivedeck/tubedeck/player/TvBackButtonPolicyTest.kt
          test -f source/app/src/test/java/com/drivedeck/tubedeck/player/SmartOfflineReplayPolicyTest.kt
          test -f source/app/src/test/java/com/drivedeck/tubedeck/data/repository/OfflineVaultPolicyTest.kt
          test -f source/app/src/main/java/com/drivedeck/tubedeck/data/repository/AuthorizedStreamCache.kt
          grep -Fq 'NoOpCacheEvictor()' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/AuthorizedStreamCache.kt
          grep -Fq 'offlineFirstEnabled' source/app/src/main/java/com/drivedeck/tubedeck/data/model/TubeDeckModels.kt
          grep -Fq 'waitingForWifi' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/TubeDeckRepository.kt
          grep -Fq 'FileProvider' source/app/src/main/AndroidManifest.xml
          grep -Fq 'onOrganizeMedia' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/DownloadsScreen.kt
          grep -Fq 'enqueueSmartOfflineReplay' source/app/src/main/java/com/drivedeck/tubedeck/data/repository/TubeDeckRepository.kt
          grep -Fq 'smartReplayWatch.finish(' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/PlayerScreen.kt
          grep -Fq 'smartOfflineReplayEnabled = smartOfflineReplayEnabled' source/app/src/main/java/com/drivedeck/tubedeck/ui/screens/SettingsScreen.kt
          grep -Fq 'searchVideosPage(' source/app/src/main/java/com/drivedeck/tubedeck/player/YoutubeStreamResolver.kt
          test -f source/app/src/main/java/com/drivedeck/tubedeck/ui/components/VideoBookmarksDialog.kt
          test -f source/app/src/main/java/com/drivedeck/tubedeck/ui/components/RemoteInputTrainingDialog.kt
          test -f source/app/src/test/java/com/drivedeck/tubedeck/player/PlaybackErrorAdvisorTest.kt
          test -f source/app/src/test/java/com/drivedeck/tubedeck/ui/components/TvRemoteKeyLearningPolicyTest.kt

      - name: Verify UI/UX Stage A–D and safe-area regression guards
        shell: bash
        run: bash ci/uiux-v220-guard.sh

      - name: Verify viewing modes, 13-theme availability, resume and seek guards
        shell: bash
        run: bash ci/viewing-resume-seek-v221-guard.sh

      - name: Verify car multimedia hardware Next/Previous key resilience
        shell: bash
        run: bash ci/car-android-next-v223-guard.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore the stable MyTube update-compatible debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mytube-debug-signing-v1

      - name: Verify existing signing identity (never silently rotate)
        shell: bash
        run: |
          set -euo pipefail
          KEY="$HOME/.android/debug.keystore"
          test -s "$KEY" || { echo "::error::Stable debug signing key missing; cannot publish an update-compatible APK"; exit 1; }
          EXPECTED="$(tr -d '\r\n ' < .github/mytube-signing-sha1.txt)"
          ACTUAL="$(keytool -list -v -keystore "$KEY" -storepass android -alias androiddebugkey -keypass android | awk -F': ' '/SHA1:/{print $2;exit}')"
          test -n "$EXPECTED" && test "$EXPECTED" != "UNSET" && test "$ACTUAL" = "$EXPECTED" || {
            echo "::error::APK signing identity differs from the prior MyTube release"; exit 1;
          }

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Configure Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Provision verified Whisper Tiny model
        shell: bash
        run: |
          set -euo pipefail
          MODEL="source/app/src/main/assets/models/ggml-tiny-q5_1.bin"
          mkdir -p "$(dirname "$MODEL")"
          curl -fL --retry 3 --retry-delay 3 https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin -o "$MODEL"
          echo "2827a03e495b1ed3048ef28a6a4620537db4ee51  $MODEL" | sha1sum -c -

      - name: Run ARM64 ARMv7 and Universal unit tests
        run: gradle -p source testArm64DebugUnitTest testArmv7DebugUnitTest testUniversalDebugUnitTest --no-parallel --max-workers=2 --stacktrace

      - name: Run Android lint audit (required gate)
        run: gradle -p source lintArm64Debug --no-parallel --max-workers=2 --stacktrace

      - name: Upload Android lint report when available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TubeDeck-v2.3.11-Android-Lint
          path: |
            source/app/build/reports/lint-results-arm64Debug.html
            source/app/build/reports/lint-results-arm64Debug.xml
            source/app/build/reports/lint-results-arm64Debug.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Compile ARM64 APK
        run: gradle -p source assembleArm64Debug --no-parallel --max-workers=2 --stacktrace

      - name: Compile 32-bit ARMv7 APK
        run: |
          gradle --stop
          gradle -p source assembleArmv7Debug --no-parallel --max-workers=2 --stacktrace

      - name: Compile Universal APK
        run: |
          gradle --stop
          gradle -p source assembleUniversalDebug --no-parallel --max-workers=2 --stacktrace

      - name: Apply legacy + modern signatures and verify installable APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          KEYSTORE="$HOME/.android/debug.keystore"
          test -s "$KEYSTORE"
          for FLAVOR in arm64 armv7 universal; do
            RAW="source/app/build/outputs/apk/$FLAVOR/debug/app-$FLAVOR-debug.apk"
            test -s "$RAW"
            unzip -t "$RAW" >/dev/null
            "$ZIPALIGN" -c -v 4 "$RAW" >/dev/null
            case "$FLAVOR" in
              arm64) FINAL="dist/TubeDeck-v2.3.11-ARM64-debug.apk";;
              armv7) FINAL="dist/TubeDeck-v2.3.11-ARMv7-debug.apk";;
              universal) FINAL="dist/TubeDeck-v2.3.11-Universal-debug.apk";;
            esac
            # AGP correctly emits v2+v3 for minSdk 24 but optimizes away
            # legacy JAR signing despite enableV1Signing=true. Explicitly
            # re-sign with a minSdk 23 signer policy to add v1, using the
            # ORIGINAL cached certificate (unchanged package identity).
            "$SIGNER" sign \
              --ks "$KEYSTORE" --ks-key-alias androiddebugkey \
              --ks-pass pass:android --key-pass pass:android \
              --min-sdk-version 23 \
              --v1-signing-enabled true --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$FINAL" "$RAW"
            test -s "$FINAL"
            unzip -t "$FINAL" >/dev/null
            "$ZIPALIGN" -c -v 4 "$FINAL" >/dev/null
            SIGNATURE_REPORT="$("$SIGNER" verify --verbose --print-certs --min-sdk-version 23 "$FINAL")"
            echo "$SIGNATURE_REPORT"
            echo "$SIGNATURE_REPORT" | grep -Fq 'Verified using v1 scheme (JAR signing): true'
            echo "$SIGNATURE_REPORT" | grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true'
            echo "$SIGNATURE_REPORT" | grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true'
            PACKAGE_INFO="$("$AAPT" dump badging "$FINAL")"
            echo "$PACKAGE_INFO" | grep -Fq "package: name='com.aistudio.tubedeck.kxmvd' versionCode='121' versionName='2.3.11'"
            echo "$PACKAGE_INFO" | grep -Fq "sdkVersion:'24'"
            if [ "$FLAVOR" = "arm64" ]; then
              unzip -l "$FINAL" | grep 'lib/arm64-v8a/' >/dev/null
              ! unzip -l "$FINAL" | grep 'lib/armeabi-v7a/' >/dev/null
            elif [ "$FLAVOR" = "armv7" ]; then
              unzip -l "$FINAL" | grep 'lib/armeabi-v7a/' >/dev/null
              ! unzip -l "$FINAL" | grep 'lib/arm64-v8a/' >/dev/null
            else
              unzip -l "$FINAL" | grep 'lib/armeabi-v7a/' >/dev/null
              unzip -l "$FINAL" | grep 'lib/arm64-v8a/' >/dev/null
            fi
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist

      - name: Upload installable triple-APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TubeDeck-v2.3.11-ARM64-ARMv7-Universal
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Install Universal APK on real Android emulator with ADB and launch app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          # Keep emulator-runner's animation-setting ADB calls disabled: Android 11
          # image sometimes returns 'settings: Broken pipe (32)' after boot.
          emulator-boot-timeout: 600
          script: bash ci/apk-install-smoke.sh dist/TubeDeck-v2.3.11-Universal-debug.apk dist/

      - name: Preserve emulator installation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TubeDeck-v2.3.11-Installation-Diagnostics
          path: |
            dist/install-clean.log
            dist/install-update.log
            dist/installed-paths.txt
            dist/package-dumpsys.txt
            dist/launch.txt
            dist/activities.txt
            dist/logcat-startup.txt
          if-no-files-found: ignore
          retention-days: 30

      # Explicitly publish this verified development build as a GitHub
      # prerelease. Never overwrite another tag or promote this PR to main.
      # This provides independently downloadable ARM64, ARMv7 and Universal APK links.
      - name: Publish v2.3.11 preview with three direct APK download links
        if: github.ref == 'refs/heads/feature/tubedeck-six-experiences-20261105' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v2.3.11-installation-compat-20261110"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; retaining immutable APK assets."
            exit 0
          fi
          gh release create "$TAG" \
            dist/TubeDeck-v2.3.11-ARM64-debug.apk \
            dist/TubeDeck-v2.3.11-Universal-debug.apk \
            dist/TubeDeck-v2.3.11-ARMv7-debug.apk \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "TubeDeck v2.3.11 — Installation Compatibility: ARM64 + ARMv7 + Universal" \
            --notes "PREVIEW / DEVICE TESTING BUILD. Packaging: same long-lived signing certificate, v1+v2+v3 signature schemes, 32-bit ARMv7-only APK, verified install/update and cold-start on Android 11 emulator; OEM Android/car firmware must still be tested. Auto-quality recovery: detects low buffer and startup stalls earlier, selects genuinely compatible lower MP4 variants including those exposed only in download formats, avoids immediately upgrading after a stall, and uses a healthier rebuffer threshold. Fixed-quality extracted YouTube URLs require media-source reprepare, so zero-delay seamless bitrate switching cannot be guaranteed; HLS uses native Media3 adaptation. Resume: only meaningfully unfinished videos offer Resume vs Start Over, configurable 1-15 second countdown defaults to 3 seconds and automatically starts over if no selection; legacy missing-duration saves are excluded. Search UI rework: persistent Home/Browser text fields removed, single-row launchers in portrait and landscape, bounded transient search dialog with recent history, automatic startup keyboard focus eliminated, landscape IME hides suggestion rows. Previous fixes: readable 15-24sp sans-serif video titles with larger channel metadata, responsive card widths and optional independent title-size adjustment; fixed Auto quality downshifts on weak networks even on resource-constrained car head units. Previous fix: landscape car tablets use a compact one-row search header, history remains collapsed until opened, and capped search suggestions float over content without consuming layout height. Six premium themes: NeoGlass Luxe, Cinema Deck, CommandDrive Auto, StreamPlus Luxe TV, Midnight Editorial Pro and Cyber Console X. Includes approved ideas #1 Morphing UI, #3 Car Mode, #4 Cinema Engine, #6 Smart Home, #7 Playback Doctor and #10 Theme Studio. Excludes ideas #2, #5, #8, #9. versionCode 119; Android Lint, both APK builds, tests and signature/ABI verification are mandatory CI gates. Physical-device validation is still required. This prerelease is generated from the isolated feature branch and is NOT a production/main release."
