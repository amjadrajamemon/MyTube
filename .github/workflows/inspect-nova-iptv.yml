name: Inspect Nova IPTV vendored project
on:
  push:
    branches: ['feature/iptv-nova-repository-integration-20261028']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory source and Android dependencies
        shell: bash
        run: |
          set -euo pipefail
          unzip -q iptv-vendor/NovaIPTV-Pro-v0.1.4-Source-GitHub-Build.zip -d /tmp/nova-source
          echo '=== SOURCE TREE ==='
          find /tmp/nova-source -type f | sort
          echo '=== APP GRADLE ==='
          sed -n '1,200p' /tmp/nova-source/NovaIPTV-Pro/app/build.gradle
          echo '=== ANDROID MANIFEST ==='
          cat /tmp/nova-source/NovaIPTV-Pro/app/src/main/AndroidManifest.xml
          echo '=== JAVA IMPORTS AND ACTIVITY DECLARATIONS ==='
          grep -hE '^import |class .*Activity' /tmp/nova-source/NovaIPTV-Pro/app/src/main/java/com/novastream/iptv/{ui,core,model}/*.java | sort -u | head -200
          echo '=== XML RESOURCES ==='
          find /tmp/nova-source/NovaIPTV-Pro/app/src/main/res -type f -maxdepth 4 -print | sort

      - name: Preserve Nova IPTV source, tests, assets and license inside MyTube
        shell: bash
        run: |
          set -euo pipefail
          from=/tmp/nova-source/NovaIPTV-Pro
          to=source/novaiptv/src
          mkdir -p "$to/main/java" "$to/main/res/drawable" "$to/main/res/mipmap-nodpi" "$to/test/java"
          cp -a "$from/app/src/main/java/." "$to/main/java/"
          cp -a "$from/app/src/test/java/." "$to/test/java/"
          cp "$from/app/src/main/res/drawable/ic_nova.xml" "$to/main/res/drawable/"
          cp "$from/app/src/main/res/mipmap-nodpi/tv_banner.png" "$to/main/res/mipmap-nodpi/"
          cp "$from/LICENSE" iptv-vendor/LICENSE.NovaIPTV
          cp "$from/docs/AUDIT.md" iptv-vendor/NOVA-AUDIT.md
          python3 iptv-vendor/patch-nova-playback.py
          printf '%s\n' 'Nova IPTV Pro v0.1.4 original source at amjadrajamemon/IPTV, vendored as an internal library module. Source ZIP SHA-256:' > iptv-vendor/IMPORT_PROVENANCE.txt
          sha256sum iptv-vendor/NovaIPTV-Pro-v0.1.4-Source-GitHub-Build.zip >> iptv-vendor/IMPORT_PROVENANCE.txt
          grep -q 'sourceNames' "$to/main/java/com/novastream/iptv/core/Catalog.java"
          grep -q 'favoriteFolders' "$to/main/java/com/novastream/iptv/core/Catalog.java"
          git add source/novaiptv/src iptv-vendor/LICENSE.NovaIPTV iptv-vendor/NOVA-AUDIT.md iptv-vendor/IMPORT_PROVENANCE.txt
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Import full Nova IPTV source and Java regression tests [skip ci]"
            git push origin HEAD:feature/iptv-nova-repository-integration-20261028
          fi
