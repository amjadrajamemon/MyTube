name: Integrate pinned Nova IPTV v0.1.8 into MyTube branch
on:
  push:
    branches: ['feature/iptv-v016-alignment-20261028']
    paths: ['.github/workflows/integrate-iptv-v016.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # Keep the same group as the superseded v0.2.1 workflow so this correction
  # cancels queued/in-progress v0.2.1 import runs instead of racing them.
  group: mytube-nova-v021-integration
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout triggering MyTube revision
        uses: actions/checkout@v4
      - name: Checkout immutable Nova IPTV v0.1.8 source commit
        uses: actions/checkout@v4
        with:
          repository: amjadrajamemon/IPTV
          ref: aba592d868ddd615f4be67af5002d6f01f6751fb
          path: upstream-iptv
      - name: Download and validate exact Nova IPTV v0.1.8 release source
        shell: bash
        run: |
          set -euo pipefail
          PIN=aba592d868ddd615f4be67af5002d6f01f6751fb
          EXPECTED_SHA=50b19792fbc28314e76956cc25ac987098d9cbb6879ad3d365841ae76a415843
          test "$(git -C upstream-iptv rev-parse HEAD)" = "$PIN"
          ARCHIVE="$RUNNER_TEMP/NovaIPTV-Pro-v0.1.8-Source-GitHub-Build.zip"
          curl -fLsS --retry 3 --retry-delay 2 "https://github.com/amjadrajamemon/IPTV/releases/download/v0.1.8-preview/NovaIPTV-Pro-v0.1.8-Source-GitHub-Build.zip" -o "$ARCHIVE"
          echo "$EXPECTED_SHA  $ARCHIVE" | sha256sum -c -
          unzip -tq "$ARCHIVE"
          mkdir -p upstream-v018
          unzip -q "$ARCHIVE" -d upstream-v018
          PROJECT=upstream-v018/NovaIPTV-Pro
          test -s "$PROJECT/settings.gradle"
          test -s "$PROJECT/app/build.gradle"
          grep -Eq "versionName ['\"]0\.1\.8(-preview)?['\"]" "$PROJECT/app/build.gradle"
          ! grep -Eq "versionName ['\"]0\.1\.9" "$PROJECT/app/build.gradle"
          grep -Eq 'MAX_PLAYLIST_BYTES[[:space:]]*=[[:space:]]*96' "$PROJECT/app/src/main/java/com/novastream/iptv/core/Net.java"
          grep -q 'buildEnigmaHome' "$PROJECT/app/src/main/java/com/novastream/iptv/ui/MainActivity.java"
          grep -q 'ThemeColorPicker.show' "$PROJECT/app/src/main/java/com/novastream/iptv/ui/MainActivity.java"
          grep -q 'verifyReachability' "$PROJECT/app/src/main/java/com/novastream/iptv/core/Xtream.java"
          grep -q 'normalizedHost=x.baseAddress()' "$PROJECT/app/src/main/java/com/novastream/iptv/ui/MainActivity.java"
          test -s "$PROJECT/app/src/main/java/com/novastream/iptv/core/PortalEndpoint.java"
          test -s "$PROJECT/app/src/test/java/com/novastream/iptv/core/PortalEndpointTest.java"
          test -s "$PROJECT/app/src/test/java/com/novastream/iptv/ui/ThemeIdentityTest.java"
          python3 - "$ARCHIVE" <<'PYVERIFY'
          import hashlib, sys
          from zipfile import ZipFile
          archive=ZipFile(sys.argv[1])
          manifest='NovaIPTV-Pro/SOURCE_MANIFEST_SHA256.txt'
          names=set(archive.namelist())
          assert manifest in names, 'v0.1.8 source manifest missing'
          expected={manifest}
          for line in archive.read(manifest).decode('utf-8').splitlines():
              digest,path=line.split('  ',1)
              member='NovaIPTV-Pro/'+path
              assert member in names, 'Manifest entry missing: '+path
              assert hashlib.sha256(archive.read(member)).hexdigest()==digest, 'Source integrity mismatch: '+path
              expected.add(member)
          actual={name for name in names if name.startswith('NovaIPTV-Pro/') and not name.endswith('/')}
          assert actual==expected, 'Unexpected or unmanifested source files: '+repr(sorted(actual ^ expected))
          assert all(name.startswith('NovaIPTV-Pro/') or name.endswith('/') for name in names), 'Unexpected file outside project root'
          print('Exact v0.1.8 source manifest and full file inventory verified.')
          PYVERIFY
      - name: Replace stale module source with the clean v0.1.8 source tree
        shell: bash
        run: |
          set -euo pipefail
          upstream=upstream-v018/NovaIPTV-Pro/app/src
          target=source/novaiptv/src
          rm -rf "$target/main/java/com/novastream/iptv" "$target/main/res" "$target/test/java/com/novastream/iptv"
          mkdir -p "$target/main/java/com/novastream" "$target/test/java/com/novastream"
          cp -a "$upstream/main/java/com/novastream/iptv" "$target/main/java/com/novastream/"
          cp -a "$upstream/main/res" "$target/main/"
          cp -a "$upstream/test/java/com/novastream/iptv" "$target/test/java/com/novastream/"
          cp iptv-vendor/NovaPlaybackBridge.java "$target/main/java/com/novastream/iptv/core/NovaPlaybackBridge.java"
          python3 iptv-vendor/patch-nova-playback.py
          grep -q 'NovaPlaybackBridge.claim(player)' "$target/main/java/com/novastream/iptv/ui/PlayerActivity.java"
          test -s "$target/main/java/com/novastream/iptv/core/NovaPlaybackBridge.java"
          grep -q 'KEYCODE_SPACE' "$target/main/java/com/novastream/iptv/ui/PlayerActivity.java"
          grep -q 'setOnApplyWindowInsetsListener' "$target/main/java/com/novastream/iptv/ui/MainActivity.java"
          grep -q 'verifyReachability' "$target/main/java/com/novastream/iptv/core/Xtream.java"
          grep -q 'buildEnigmaHome' "$target/main/java/com/novastream/iptv/ui/MainActivity.java"
          grep -q 'ThemeColorPicker.show' "$target/main/java/com/novastream/iptv/ui/MainActivity.java"
          printf '%s\n' 'aba592d868ddd615f4be67af5002d6f01f6751fb' > iptv-vendor/NOVA-V018-PIN.txt
          printf '%s  %s\n' '50b19792fbc28314e76956cc25ac987098d9cbb6879ad3d365841ae76a415843' 'NovaIPTV-Pro-v0.1.8-Source-GitHub-Build.zip' > iptv-vendor/NOVA-V018-SOURCE-SHA256.txt
          cat > iptv-vendor/IMPORT_PROVENANCE.txt <<'EOF'
          Nova IPTV Pro v0.1.8-preview source from amjadrajamemon/IPTV, imported as an internal library module.
          Upstream commit: aba592d868ddd615f4be67af5002d6f01f6751fb
          Release: https://github.com/amjadrajamemon/IPTV/releases/tag/v0.1.8-preview
          Source archive SHA-256: 50b19792fbc28314e76956cc25ac987098d9cbb6879ad3d365841ae76a415843
          The integration workflow verifies the archive digest, source manifest and complete file inventory before import. Nova v0.1.9 and later versions are explicitly excluded.
          EOF
          rm -f iptv-vendor/NOVA-V021-PIN.txt iptv-vendor/NOVA-V021-SOURCE-SHA256.txt iptv-vendor/NOVA-V021-BASE-SHA256.txt
          git add -A source/novaiptv/src iptv-vendor
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'feat(iptv): import exact Nova v0.1.8 source with playback bridge'
            git push origin HEAD:feature/iptv-v016-alignment-20261028
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile and unit test integrated Nova IPTV v0.1.8 module
        working-directory: source
        run: gradle --no-daemon --console=plain :novaiptv:testDebugUnitTest :novaiptv:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mytube-iptv-v018-integration-diagnostics
          path: source/novaiptv/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
