name: Integrate pinned Nova IPTV v0.2.1 into MyTube branch
on:
  push:
    branches: ['feature/iptv-v016-alignment-20261028']
    paths: ['.github/workflows/integrate-iptv-v016.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/iptv-v016-alignment-20261028
      - uses: actions/checkout@v4
        with:
          repository: amjadrajamemon/IPTV
          ref: c7550d4da9a73892fb70b35f0b53e1093bd289e3
          path: upstream-iptv
      - name: Download and validate pinned Nova IPTV v0.2.1 release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream-iptv rev-parse HEAD)" = "c7550d4da9a73892fb70b35f0b53e1093bd289e3"
          ARCHIVE="$RUNNER_TEMP/NovaIPTV-Pro-v0.2.0-Source-GitHub-Build.zip"
          curl -fLsS --retry 3 --retry-delay 2 "https://github.com/amjadrajamemon/IPTV/releases/download/v0.2.1-debug-preview/NovaIPTV-Pro-v0.2.0-Source-GitHub-Build.zip" -o "$ARCHIVE"
          curl -fLsS --retry 3 --retry-delay 2 "https://github.com/amjadrajamemon/IPTV/releases/download/v0.2.1-debug-preview/NovaIPTV-Pro-v0.2.0-Source-GitHub-Build.zip.sha256" -o "$ARCHIVE.sha256"
          EXPECTED="$(awk '{print $1}' "$ARCHIVE.sha256")"
          ACTUAL="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          echo "Verified v0.2.1 source archive SHA-256: $ACTUAL"
          unzip -tq "$ARCHIVE"
          mkdir -p upstream-v021
          unzip -q "$ARCHIVE" -d upstream-v021
          PROJECT=upstream-v021/NovaIPTV-Pro
          test -f "$PROJECT/app/build.gradle"
          grep -Fq "versionName '0.2.1'" "$PROJECT/app/build.gradle"
          ! grep -Fq "versionName '0.1.8'" "$PROJECT/app/build.gradle"
          grep -Fq 'MAX_PLAYLIST_BYTES = 96 * 1024 * 1024' "$PROJECT/app/src/main/java/com/novastream/iptv/core/Net.java"
          grep -Fq 'MAX_CHANNELS = 250000;' "$PROJECT/app/src/main/java/com/novastream/iptv/core/M3uParser.java"
          grep -Fq 'lines > 1000000' "$PROJECT/app/src/main/java/com/novastream/iptv/core/M3uParser.java"
          grep -Fq 'CONNECT_TIMEOUT_MS = 20000' "$PROJECT/app/src/main/java/com/novastream/iptv/core/Net.java"
          grep -Fq 'READ_TIMEOUT_MS = 180000' "$PROJECT/app/src/main/java/com/novastream/iptv/core/Net.java"
          test -s "$PROJECT/app/src/test/java/com/novastream/iptv/core/NetTransportTest.java"
          if grep -R -n '75000' "$PROJECT/app/src/main"; then echo 'Legacy playlist ceiling found in v0.2.1 source'; exit 1; fi
          grep -q 'buildEnigmaHome' "$PROJECT/app/src/main/java/com/novastream/iptv/ui/MainActivity.java"
          grep -q 'ThemeColorPicker.show' "$PROJECT/app/src/main/java/com/novastream/iptv/ui/MainActivity.java"
          grep -q 'verifyReachability' "$PROJECT/app/src/main/java/com/novastream/iptv/core/Xtream.java"
          test -s "$PROJECT/app/src/main/java/com/novastream/iptv/core/PortalEndpoint.java"
          test -s "$PROJECT/app/src/test/java/com/novastream/iptv/core/PortalEndpointTest.java"
          python3 - "$ARCHIVE" <<'PY'
          import hashlib, sys
          from zipfile import ZipFile
          archive=ZipFile(sys.argv[1])
          manifest='NovaIPTV-Pro/SOURCE_MANIFEST_SHA256.txt'
          names=set(archive.namelist())
          assert manifest in names, 'v0.2.1 source manifest missing'
          expected={manifest}
          for line in archive.read(manifest).decode('utf-8').splitlines():
              digest,path=line.split('  ',1)
              member='NovaIPTV-Pro/'+path
              assert member in names, 'Manifest entry missing from archive: '+path
              assert hashlib.sha256(archive.read(member)).hexdigest()==digest, 'Source integrity mismatch: '+path
              expected.add(member)
          actual={name for name in names if name.startswith('NovaIPTV-Pro/') and not name.endswith('/')}
          assert actual==expected, 'Unexpected or unmanifested source files: '+repr(sorted(actual ^ expected))
          assert all(name.startswith('NovaIPTV-Pro/') or name.endswith('/') for name in names), 'Unexpected file outside project root'
          print('Pinned Nova v0.2.1 source manifest and complete file inventory verified.')
          PY
          printf '%s\n' 'c7550d4da9a73892fb70b35f0b53e1093bd289e3' > iptv-vendor/NOVA-V021-PIN.txt
          printf '%s  %s\n' "$ACTUAL" 'NovaIPTV-Pro-v0.2.0-Source-GitHub-Build.zip' > iptv-vendor/NOVA-V021-SOURCE-SHA256.txt
          rm -f iptv-vendor/NOVA-V021-BASE-SHA256.txt
      - name: Import latest Java, resources and regression tests
        shell: bash
        run: |
          set -euo pipefail
          upstream=upstream-v021/NovaIPTV-Pro/app/src
          target=source/novaiptv/src
          cp -a "$upstream/main/java/." "$target/main/java/"
          cp -a "$upstream/main/res/." "$target/main/res/"
          mkdir -p "$target/test/java"
          cp -a "$upstream/test/java/." "$target/test/java/"
          python3 iptv-vendor/patch-nova-playback.py
          python3 - <<'PYDEP'
          from pathlib import Path
          p=Path("source/novaiptv/build.gradle.kts")
          s=p.read_text()
          dependency='    implementation("com.squareup.okhttp3:okhttp:4.12.0")'
          if dependency not in s:
              s=s.replace("dependencies {", "dependencies {\\n"+dependency, 1)
          p.write_text(s)
          assert dependency in p.read_text()
          PYDEP
          grep -q 'NovaPlaybackBridge.claim(player)' "$target/main/java/com/novastream/iptv/ui/PlayerActivity.java"
          grep -q 'KEYCODE_SPACE' "$target/main/java/com/novastream/iptv/ui/PlayerActivity.java"
          grep -q 'setOnApplyWindowInsetsListener' "$target/main/java/com/novastream/iptv/ui/MainActivity.java"
          printf '%s\n' 'c7550d4da9a73892fb70b35f0b53e1093bd289e3' > iptv-vendor/NOVA-V021-PIN.txt
          grep -q 'verifyReachability' "$target/main/java/com/novastream/iptv/core/Xtream.java"
          grep -q 'buildEnigmaHome' "$target/main/java/com/novastream/iptv/ui/MainActivity.java"
          test -s "$target/main/java/com/novastream/iptv/core/PortalEndpoint.java"
          git add -A source/novaiptv/src iptv-vendor
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'feat(iptv): import pinned Nova v0.2.1 portal recovery, XStreamity, themes and TV controls'
            git push origin HEAD:feature/iptv-v016-alignment-20261028
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile IPTV library and unit tests
        working-directory: source
        run: gradle --no-daemon --console=plain :novaiptv:testDebugUnitTest :novaiptv:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mytube-iptv-v021-integration-diagnostics
          path: source/novaiptv/build/reports/tests/
          if-no-files-found: ignore
